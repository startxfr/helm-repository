{{- if .Values.arraySecret.enabled -}}
{{- $namespace := .Values.project.project.name | default "default-dell-csm" -}}
{{- $csmName := .Values.csm.name | default "powerstore" -}}
{{- $name := .Values.arraySecret.name | default .Values.csm.authSecret | default (printf "%s-config" $csmName) -}}
{{- if dig "externalSecret" "enabled" false .Values.arraySecret }}
{{ include "cluster-dell-csm.externalSecret" (dict "root" . "name" $name "namespace" $namespace "config" .Values.arraySecret.externalSecret "defaults" .Values.externalSecretDefaults "keys" (list "config") "wave" "1") }}
{{- else -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "cluster-dell-csm.labels" . | nindent 4 }}
    app.kubernetes.io/name: "{{- $name -}}-secret"
  annotations:
    {{- include "cluster-dell-csm.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
stringData:
  config: |
    {{- .Values.arraySecret.config | default "arrays: []" | trim | nindent 4 }}
{{- end }}
{{- end -}}
