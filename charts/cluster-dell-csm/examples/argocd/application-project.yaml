apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-dell-csm-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: default-dell-csm
    server: https://kubernetes.default.svc
  project: cluster-dell-csm
  source:
    chart: cluster-dell-csm
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: true
        operator:
          enabled: false
        csm:
          enabled: false
        arraySecret:
          enabled: false
        storageClasses:
          enabled: false
        volumeSnapshotClasses:
          enabled: false
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    targetRevision: 21.3.321
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
