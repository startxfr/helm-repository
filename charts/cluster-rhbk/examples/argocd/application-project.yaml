# Creates the default-rhbk namespace (no finalizer: avoids a deadlock while the namespace terminates)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-rhbk-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cluster-rhbk
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-rhbk
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: true
        operator:
          enabled: false
        database:
          enabled: false
        rhbk:
          enabled: false
        route:
          enabled: false
        rhbk_realms:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default-rhbk
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      jsonPointers:
        - /imagePullSecrets
        - /secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
