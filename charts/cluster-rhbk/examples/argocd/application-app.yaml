# Deploys the development database, the Keycloak instance, its route and the startx realm in default-rhbk
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-rhbk-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-rhbk
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-rhbk
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: false
        database:
          enabled: true
        rhbk:
          enabled: true
        route:
          enabled: true
        rhbk_realms:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default-rhbk
  ignoreDifferences:
    - group: k8s.keycloak.org
      kind: Keycloak
      jsonPointers:
        - /metadata/finalizers
    - group: k8s.keycloak.org
      kind: KeycloakRealmImport
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
