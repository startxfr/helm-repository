# Installs the rhbk-operator (OwnNamespace OperatorGroup in default-rhbk)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-rhbk-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-rhbk
  source:
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    chart: cluster-rhbk
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: true
        database:
          enabled: false
        rhbk:
          enabled: false
        route:
          enabled: false
        rhbk_realms:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default-rhbk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
