{{- if .Values.rhbk.enabled -}}
{{- $namespace := include "cluster-rhbk.namespace" . -}}
{{- range $kind, $cfg := dict "dbSecret" .Values.rhbk.dbSecret "adminSecret" .Values.rhbk.adminSecret }}
{{- if $cfg.enabled }}
{{- $name := ternary (include "cluster-rhbk.dbSecretName" $) (include "cluster-rhbk.adminSecretName" $) (eq $kind "dbSecret") }}
{{- if dig "externalSecret" "enabled" false $cfg }}
{{ include "cluster-rhbk.externalSecret" (dict "root" $ "name" $name "namespace" $namespace "config" $cfg.externalSecret "defaults" $.Values.externalSecretDefaults "keys" (list "username" "password") "wave" "1") }}
{{- else }}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "cluster-rhbk.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-secret" $name | quote }}
  annotations:
    {{- include "cluster-rhbk.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
stringData:
  username: {{ required (printf "rhbk.%s.username is required" $kind) $cfg.username | quote }}
  password: {{ required (printf "rhbk.%s.password is required (or use rhbk.%s.externalSecret)" $kind $kind) $cfg.password | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end -}}
