{{- if .Values.rhbk_realms.enabled -}}
{{- $namespace := include "cluster-rhbk.namespace" . -}}
{{- range .Values.rhbk_realms.secrets }}
{{- if ne (toString .enabled) "false" }}
{{- $name := required "rhbk_realms.secrets[].name is required" .name }}
{{- if dig "externalSecret" "enabled" false . }}
{{ include "cluster-rhbk.externalSecret" (dict "root" $ "name" $name "namespace" $namespace "config" .externalSecret "defaults" $.Values.externalSecretDefaults "keys" (list) "wave" "1") }}
{{- else }}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "cluster-rhbk.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-secret" $name | quote }}
  annotations:
    {{- include "cluster-rhbk.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
stringData:
  {{- range $key, $value := (required (printf "rhbk_realms.secrets[%s].data is required (or use externalSecret)" $name) .data) }}
  {{ $key }}: {{ required (printf "rhbk_realms.secrets[%s].data.%s is required (or use externalSecret)" $name $key) $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end -}}
