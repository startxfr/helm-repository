# Auto-generated values-app file for deploying cluster-nmstate via argocd
# Source: examples/argocd/ from the cluster-nmstate chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-nmstate'
      namespace: 'openshift-gitops'
      wave: "-17"
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/*'
      destinations:
        - namespace: 'openshift-nmstate'
          server: 'https://kubernetes.default.svc'
        - namespace: '*'
          server: 'https://kubernetes.default.svc'

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-nmstate-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "7"
      server: 'https://kubernetes.default.svc'
      project: 'cluster-nmstate'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-nmstate'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          nmstate:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Installs and configures the operator
    - name: 'infra-nmstate-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "7"
      server: 'https://kubernetes.default.svc'
      project: 'cluster-nmstate'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-nmstate'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-nmstate-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'cluster-nmstate'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-nmstate'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
