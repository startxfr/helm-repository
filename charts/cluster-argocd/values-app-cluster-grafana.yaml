# Auto-generated values-app file for deploying cluster-grafana via argocd
# Source: examples/argocd/ from the cluster-grafana chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-grafana'
      namespace: 'openshift-gitops'
      wave: "-13"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default-grafana'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-grafana:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-grafana-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "13"
      server: 'https://kubernetes.default.svc'
      project: 'infra-grafana'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-grafana'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: false
          grafana:
            enabled: true
          route:
            enabled: true
          grafana_datasources:
            enabled: true
          grafana_dashboards:
            enabled: true
    # Installs and configures the operator
    - name: 'infra-grafana-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "13"
      server: 'https://kubernetes.default.svc'
      project: 'infra-grafana'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-grafana'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: true
          grafana:
            enabled: false
          route:
            enabled: false
          grafana_datasources:
            enabled: false
          grafana_dashboards:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-grafana-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-grafana'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-grafana'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          operator:
            enabled: false
          grafana:
            enabled: false
          route:
            enabled: false
          grafana_datasources:
            enabled: false
          grafana_dashboards:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
