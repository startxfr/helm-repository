# Auto-generated values-app file for deploying chaos via argocd
# Source: examples/argocd/ from the chaos chart

argocd_project:
  enabled: true
  list:
    - name: 'chaos-all'
      namespace: 'openshift-gitops'
      wave: "0"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
        - 'https://litmuschaos.github.io/litmus-helm'
        - 'https://charts.chaos-mesh.org'
        - 'https://asobti.github.io/kube-monkey/charts/repo'
      destinations:
        - namespace: 'chaos-cerberus'
          server: 'https://kubernetes.default.svc'
        - namespace: 'chaos-kraken'
          server: 'https://kubernetes.default.svc'
        - namespace: 'chaos-litmus'
          server: 'https://kubernetes.default.svc'
        - namespace: 'chaos-mesh'
          server: 'https://kubernetes.default.svc'
        - namespace: 'chaos-monkey'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:chaos-all:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Deploys service instances
    - name: 'chaos-all-cerberus-instance'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "50"
      server: 'https://kubernetes.default.svc'
      project: 'chaos'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-cerberus'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          cerberus:
            enabled: true
            kubeconfig:
              mode: token
              token:
                server: "https://api.<cluster>:6443"
                token: "sha256~REPLACE_WITH_YOUR_SA_TOKEN"
          # Required: prevents nil pointer error on .Values.kraken.version in cerberus template
          kraken:
            enabled: false
    # Deploys service instances
    - name: 'chaos-all-kraken-instance'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "50"
      server: 'https://kubernetes.default.svc'
      project: 'chaos'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-kraken'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          kraken:
            enabled: true
            mode: job
            cerberusUrl: "http://cerberus.chaos-cerberus.svc.cluster.local:8080"
            kubeconfig:
              mode: token
              token:
                server: "https://api.<cluster>:6443"
                token: "sha256~REPLACE_WITH_YOUR_TOKEN"
    # Deploys service instances
    - name: 'chaos-all-litmus-instance'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "50"
      server: 'https://kubernetes.default.svc'
      project: 'chaos'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-litmus'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          litmus:
            enabled: true
            # Use standalone MongoDB for test environments:
            # - avoids replicaSet (3 primary + 1 arbiter) which creates SCC issues on OCP
            # - disables PVC to avoid WaitForFirstConsumer StorageClass deadlock
            mongodb:
              architecture: standalone
              persistence:
                enabled: false
    # Deploys service instances
    - name: 'chaos-all-mesh-instance'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "50"
      server: 'https://kubernetes.default.svc'
      project: 'chaos'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-mesh'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          mesh:
            enabled: true
            # Disable prometheus to avoid PVC deadlock on WaitForFirstConsumer StorageClass
            prometheus:
              create: false
    # Deploys service instances
    - name: 'chaos-all-monkey-instance'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "50"
      server: 'https://kubernetes.default.svc'
      project: 'chaos'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-monkey'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          monkey:
            enabled: true
            config:
              dryRun: true
              timezone: Europe/Paris
              startHour: 9
              endHour: 17

argocd_repocreds:
  enabled: true
  list: []
