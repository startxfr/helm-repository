# Auto-generated values-app file for deploying cluster-pipeline via argocd
# Source: examples/argocd/ from the cluster-pipeline chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-pipeline'
      namespace: 'openshift-gitops'
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'

# Applications
application:
  enabled: true
  list:
    # Installs and configures the operator
    - name: 'infra-pipeline-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "13"
      server: 'https://kubernetes.default.svc'
      project: 'cluster-pipeline'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-pipeline'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-pipeline-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'cluster-pipeline'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-pipeline'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          projectOperator:
            enabled: true
          operator:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
