# Auto-generated values-app file for deploying cluster-loki via argocd
# Source: examples/argocd/ from the cluster-loki chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-loki'
      namespace: 'openshift-gitops'
      wave: "-10"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-logging'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-operators-redhat'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles:
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-loki:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-loki-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "10"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'openshift-logging'
      project: 'infra-loki'
      source:
        path: 'charts/cluster-loki'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operatorNamespace:
            enabled: false
          operator:
            enabled: false
          lokistack:
            enabled: true
          storageSecret:
            enabled: false
          alertingRules:
            enabled: false
          recordingRules:
            enabled: false
          rulerConfig:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - SkipDryRunOnMissingResource=true
      ignoreDifferences: |
        - group: loki.grafana.com
          jsonPointers:
          - /metadata/finalizers
          kind: LokiStack
    # Installs and configures the operator
    - name: 'infra-loki-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "5"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'openshift-operators-redhat'
      project: 'infra-loki'
      source:
        path: 'charts/cluster-loki'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operatorNamespace:
            enabled: false
          operator:
            enabled: true
          lokistack:
            enabled: false
          storageSecret:
            enabled: false
          alertingRules:
            enabled: false
          recordingRules:
            enabled: false
          rulerConfig:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-loki-project'
      namespace: 'openshift-gitops'
      finalizer: false
      wave: "1"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'openshift-logging'
      project: 'infra-loki'
      source:
        path: 'charts/cluster-loki'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          operatorNamespace:
            enabled: false
          operator:
            enabled: false
          lokistack:
            enabled: false
          storageSecret:
            enabled: false
          alertingRules:
            enabled: false
          recordingRules:
            enabled: false
          rulerConfig:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
