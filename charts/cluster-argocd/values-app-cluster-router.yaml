# Auto-generated values-app file for deploying cluster-router via argocd
# Source: examples/argocd/ from the cluster-router chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-router'
      namespace: 'openshift-gitops'
      wave: "-13"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-image-registry'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, role:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-router-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "3"
      server: 'https://kubernetes.default.svc'
      project: 'infra-router'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-router'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          registryroute:
            enabled: true
            name: external
            namespace: openshift-image-registry
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
