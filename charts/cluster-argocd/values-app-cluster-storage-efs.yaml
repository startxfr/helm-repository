# Auto-generated values-app file for deploying cluster-storage-efs via argocd
# Source: examples/argocd/ from the cluster-storage-efs chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-storage-efs'
      namespace: 'openshift-gitops'
      wave: "9"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-storage-efs:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-storage-efs-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "19"
      server: 'https://kubernetes.default.svc'
      project: 'infra-storage-efs'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-storage-efs'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: false
          sharedVolumes:
            enabled: true
            list:
            - name: startx-aws-efs
              namespace: "default"
              accessPointID: "fsap-xxxxxxxxxxxxxxxxx"
              fileSystemID: "fs-xxxxxxxxxxxxxxxxx"
    # Installs and configures the operator
    - name: 'infra-storage-efs-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "19"
      server: 'https://kubernetes.default.svc'
      project: 'infra-storage-efs'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-storage-efs'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
            operatorGroup:
              enabled: false
          sharedVolumes:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
