# Auto-generated values-app file for deploying cluster-unifai via argocd
# Source: examples/argocd/ from the cluster-unifai chart
# Note: UnifAI has no operator/CRD upstream, so there is no "-operator" Application here,
# unlike most other cluster-* charts in this repository.

argocd_project:
  enabled: true
  list:
    - name: 'infra-unifai'
      namespace: 'openshift-gitops'
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'startx-unifai'
          server: 'https://kubernetes.default.svc'
        - namespace: '*'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles:
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-unifai:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Deploys all enabled unifai components (backend, multiagent, rag, ui, identity)
    - name: 'infra-unifai-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "29"
      server: 'https://kubernetes.default.svc'
      project: 'infra-unifai'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-unifai'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          # All component aliases default to enabled: true already (except
          # multiagent_temporal_worker and temporal, opt-in only).
        syncOptions:
          - CreateNamespace=true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-unifai-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-unifai'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-unifai'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          unifai_backend: { enabled: false }
          multiagent_server: { enabled: false }
          multiagent_temporal_worker: { enabled: false }
          multiagent_shared_storage: { enabled: false }
          unifai_rag_server: { enabled: false }
          unifai_rag_celery: { enabled: false }
          unifai_rag_celery_beat: { enabled: false }
          unifai_rag_shared_storage: { enabled: false }
          ui: { enabled: false }
          identity: { enabled: false }
          mongodb: { enabled: false }
          qdrant: { enabled: false }
          rabbitmq: { enabled: false }
          redis: { enabled: false }
          temporal: { enabled: false }
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
