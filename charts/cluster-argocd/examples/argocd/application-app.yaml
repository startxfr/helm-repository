apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-argocd-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: cluster-argocd
  source:
    repoURL: https://gitlab.com/startx1/helm.git
    targetRevision: stable
    path: charts/cluster-argocd/
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        argocd:
          enabled: true
  ignoreDifferences:
    - group: argoproj.io
      kind: ArgoCD
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
