apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-argocd-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: cluster-argocd
  source:
    repoURL: https://gitlab.com/startx1/helm.git
    targetRevision: devel
    path: charts/cluster-argocd/
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        argocd:
          enabled: false
        project:
          enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
