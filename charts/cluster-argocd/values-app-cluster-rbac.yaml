# Auto-generated values-app file for deploying cluster-rbac via argocd
# Source: examples/argocd/ from the cluster-rbac chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-rbac'
      namespace: 'openshift-gitops'
      wave: "-26"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, role:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-rbac-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-6"
      server: 'https://kubernetes.default.svc'
      project: 'infra-rbac'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-rbac'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          groups:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
