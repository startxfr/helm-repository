# Auto-generated values-app file for deploying cluster-mongo via argocd
# Source: examples/argocd/ from the cluster-mongo chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-mongo'
      namespace: 'openshift-gitops'
      wave: "7"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'startx-mongo'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, role:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-mongo-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "37"
      server: 'https://kubernetes.default.svc'
      project: 'infra-mongo'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-mongo'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          cluster:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Installs and configures the operator
    - name: 'infra-mongo-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "37"
      server: 'https://kubernetes.default.svc'
      project: 'infra-mongo'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-mongo'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
          cluster:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-mongo-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-mongo'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-mongo'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          operator:
            enabled: false
          cluster:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
