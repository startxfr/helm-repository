# Default values for configuration of a STARTX cluster
# see values.yaml for explanation on each params
context: &context
  scope: startx
  cluster: default
  environment: infra
  component: argocd
  app: aoa-infra-all
  version: "0.1.0"

argocd_project:
  enabled: false
  list:
    - name: "aoa-infra-all"
      namespace: "openshift-gitops"
      sourceRepos:
        - '*'
      destinations:
        - namespace: "*"
          server: '*'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles:
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, role:startx-admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin
application:
  enabled: false
  list:
    - name: "aoa-infra-chaos"
      namespace: "openshift-gitops"
      finalizer: true
      server: "https://kubernetes.default.svc"
      project: "aoa-infra-all"
      source:
        repo: "https://gitlab.com/startx1/helm.git"
        rev: "stable"
        path: "charts/cluster-argocd/"
      helm: |
        valueFiles:
          - values-app-chaos.yaml
        parameters:
          - name: context.cluster
            value: "example"
          - name: context.environment
            value: "dev"
          - name: argocd_repocreds.enabled
            value: "true"
          - name: argocd_project.enabled
            value: "true"
          - name: application.enabled
            value: "true"
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - Validate=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 60s
