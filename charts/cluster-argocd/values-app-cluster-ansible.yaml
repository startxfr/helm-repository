# Auto-generated values-app file for deploying cluster-ansible via argocd
# Source: examples/argocd/ from the cluster-ansible chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-ansible'
      namespace: 'openshift-gitops'
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/*'
      destinations:
        - namespace: 'aap'
          server: 'https://kubernetes.default.svc'
        - namespace: 'startx-ansible'
          server: 'https://kubernetes.default.svc'
        - namespace: '*'
          server: 'https://kubernetes.default.svc'

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-ansible-app'
      namespace: 'openshift-gitops'
      finalizer: true
      server: 'https://kubernetes.default.svc'
      project: 'cluster-ansible'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-ansible'
        rev: '21.3.107'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          ansibleAAP:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    # Installs and configures the operator
    - name: 'infra-ansible-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      server: 'https://kubernetes.default.svc'
      project: 'cluster-ansible'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-ansible'
        rev: '21.3.107'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          projectOperator:
            enabled: true
            project:
              name: "aap"
          operator:
            enabled: true
            operatorGroup:
              enabled: true
              name: "aap"
              namespace: "aap"
            subscription:
              enabled: true
              namespace: "aap"
              operator:
                channel: stable-2.7
                installPlanApproval: Manual
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    # Creates project namespace and RBAC
    - name: 'infra-ansible-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'cluster-ansible'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-ansible'
        rev: '21.3.107'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
