# Auto-generated values-app file for deploying chaos-monkey via argocd
# Source: examples/argocd/ from the chaos-monkey chart

argocd_project:
  enabled: true
  list:
    - name: 'chaos-monkey'
      namespace: 'openshift-gitops'
      wave: "-1"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
        - 'https://asobti.github.io/kube-monkey/charts/repo'
      destinations:
        - namespace: 'chaos-monkey'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:chaos-monkey:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Deploys service instances
    - name: 'chaos-monkey-instance'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "54"
      server: 'https://kubernetes.default.svc'
      project: 'chaos-monkey'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-monkey'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          monkey:
            enabled: true
            config:
              dryRun: true
              timezone: Europe/Paris
              startHour: 9
              endHour: 17
    # Creates project namespace and RBAC
    - name: 'chaos-monkey-project'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "54"
      server: 'https://kubernetes.default.svc'
      project: 'chaos-monkey'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-monkey'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
