# Generated by .tools/generate-values-app.py from charts/chaos-pipeline/examples/argocd/ (do not edit by hand:
# hand tuned variants go in values-app-chaos-pipeline-<variant>.yaml)

argocd_project:
  enabled: true
  list:
    - name: 'chaos-pipeline'
      namespace: 'openshift-gitops'
      wave: "-10"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'chaos-pipeline'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: ''
          kind: 'Namespace'
        - group: 'project.openshift.io'
          kind: 'ProjectRequest'
        - group: 'rbac.authorization.k8s.io'
          kind: 'ClusterRole'
        - group: 'rbac.authorization.k8s.io'
          kind: 'ClusterRoleBinding'
      roles:
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:chaos-pipeline:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
