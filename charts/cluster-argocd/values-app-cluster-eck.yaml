# Auto-generated values-app file for deploying cluster-eck via argocd
# Source: examples/argocd/ from the cluster-eck chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-eck'
      namespace: 'openshift-gitops'
      wave: "-10"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'default-eck'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-cluster-node-tuning-operator'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles:
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-eck:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-eck-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "10"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'default-eck'
      project: 'infra-eck'
      source:
        path: 'charts/cluster-eck'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: false
          tuned:
            enabled: true
          elasticsearch:
            enabled: true
          kibana:
            enabled: true
          secrets:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - SkipDryRunOnMissingResource=true
      ignoreDifferences: |
        - group: elasticsearch.k8s.elastic.co
          jsonPointers:
          - /metadata/finalizers
          kind: Elasticsearch
        - group: kibana.k8s.elastic.co
          jsonPointers:
          - /metadata/finalizers
          kind: Kibana
    # Installs and configures the operator
    - name: 'infra-eck-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "5"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'openshift-operators'
      project: 'infra-eck'
      source:
        path: 'charts/cluster-eck'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: true
            operatorGroup:
              enabled: false
          tuned:
            enabled: false
          elasticsearch:
            enabled: false
          kibana:
            enabled: false
          secrets:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-eck-project'
      namespace: 'openshift-gitops'
      finalizer: false
      wave: "1"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'default-eck'
      project: 'infra-eck'
      source:
        path: 'charts/cluster-eck'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          operator:
            enabled: false
          tuned:
            enabled: false
          elasticsearch:
            enabled: false
          kibana:
            enabled: false
          secrets:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
