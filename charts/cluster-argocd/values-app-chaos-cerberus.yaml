# Auto-generated values-app file for deploying chaos-cerberus via argocd
# Source: examples/argocd/ from the chaos-cerberus chart

argocd_project:
  enabled: true
  list:
    - name: 'chaos-cerberus'
      namespace: 'openshift-gitops'
      wave: "-1"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'chaos-cerberus'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:chaos-cerberus:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Creates project namespace and RBAC
    - name: 'chaos-chaos-cerberus-project'
      namespace: 'openshift-gitops'
      finalizer: false
      wave: "1"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'default'
      project: 'chaos-cerberus'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-cerberus'
        targetRevision: stable
      helm: |
        values: |
          project:
            enabled: true
          cerberus:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Deploys the cerberus watchdog
    - name: 'chaos-chaos-cerberus-instance'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "50"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'chaos-cerberus'
      project: 'chaos-cerberus'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-cerberus'
        targetRevision: stable
      helm: |
        values: |
          project:
            enabled: false
          cerberus:
            enabled: true
            expose: false
            allowedNamespaces:
              - chaos-kraken
              - chaos-pipeline
            kubeconfig:
              # local: use the pod's own ServiceAccount token (in-cluster, no credentials needed)
              # token: monitor a remote cluster with a bearer token
              # file:  inject a full kubeconfig file
              mode: local
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
