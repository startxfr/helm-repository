# Auto-generated values-app file for deploying cluster-rhbk via argocd
# Source: examples/argocd/ from the cluster-rhbk chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-rhbk'
      namespace: 'openshift-gitops'
      wave: "-13"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default-rhbk'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-rhbk:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-rhbk-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "13"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'default-rhbk'
      project: 'infra-rhbk'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-rhbk'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: false
          database:
            enabled: true
          rhbk:
            enabled: true
          route:
            enabled: true
          rhbk_realms:
            enabled: true
      ignoreDifferences: |
        - group: k8s.keycloak.org
          kind: Keycloak
          jsonPointers:
          - /metadata/finalizers
        - group: k8s.keycloak.org
          kind: KeycloakRealmImport
          jsonPointers:
          - /metadata/finalizers
    # Installs and configures the operator
    - name: 'infra-rhbk-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "13"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'default-rhbk'
      project: 'infra-rhbk'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-rhbk'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: true
          database:
            enabled: false
          rhbk:
            enabled: false
          route:
            enabled: false
          rhbk_realms:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-rhbk-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'default-rhbk'
      project: 'infra-rhbk'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-rhbk'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          operator:
            enabled: false
          database:
            enabled: false
          rhbk:
            enabled: false
          route:
            enabled: false
          rhbk_realms:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      ignoreDifferences: |
        - group: ''
          kind: ServiceAccount
          jsonPointers:
          - /imagePullSecrets
          - /secrets

argocd_repocreds:
  enabled: true
  list: []
