# Auto-generated values-app file for deploying cluster-odf via cluster-argocd
# Source: examples/argocd/ from the cluster-odf chart

argocd_project:
  enabled: false
  list:
    - name: 'infra-odf'
      namespace: 'openshift-gitops'
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-storage'
          server: 'https://kubernetes.default.svc'

# Applications
application:
  enabled: false
  list:
    # Application configuration and instances
    - name: 'infra-odf-app'
      namespace: 'openshift-gitops'
      finalizer: true
      server: 'https://kubernetes.default.svc'
      project: 'cluster-odf'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-odf'
        rev: '21.3.107'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          odf:
            enabled: true
            nodeLabeler:
              enabled: false
          operator:
            enabled: false
          
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
    # Installs and configures the operator
    - name: 'infra-odf-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      server: 'https://kubernetes.default.svc'
      project: 'cluster-odf'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-odf'
        rev: '21.3.107'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
            subscription:
              operator:
                channel: "stable-4.21"
          
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
    # Creates project namespace and RBAC
    - name: 'infra-odf-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'cluster-odf'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-odf'
        rev: '21.3.107'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          operator:
            enabled: false
          
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: false
  list: []
