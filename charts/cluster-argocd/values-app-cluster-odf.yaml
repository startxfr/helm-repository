# Auto-generated values-app file for deploying cluster-odf via argocd
# Source: examples/argocd/ from the cluster-odf chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-odf'
      namespace: 'openshift-gitops'
      wave: "-27"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-storage'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-odf:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-odf-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-7"
      server: 'https://kubernetes.default.svc'
      project: 'infra-odf'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-odf'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          odf:
            enabled: true
            nodeLabeler:
              enabled: false
          operator:
            enabled: false
          project:
            enabled: false
      syncPolicy: |
        syncOptions:
          - SkipDryRunOnMissingResource=true
      ignoreDifferences: |
        - group: ocs.openshift.io
          kind: StorageCluster
          jqPathExpressions:
          - .metadata.finalizers
          - .metadata.annotations["uninstall.ocs.openshift.io/cleanup-policy"]
          - .metadata.annotations["uninstall.ocs.openshift.io/mode"]
          - .spec.version
          - .spec.encryption.keyRotation
          - .spec.managedResources
          - .spec.storageDeviceSets[].replica
    # Installs and configures the operator
    - name: 'infra-odf-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-7"
      server: 'https://kubernetes.default.svc'
      project: 'infra-odf'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-odf'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
            subscription:
              operator:
                channel: "stable-4.21"
          odf:
            enabled: false
          project:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
      ignoreDifferences: |
        - group: operators.coreos.com
          kind: OperatorGroup
          name: openshift-storage
          namespace: openshift-storage
          jsonPointers:
          - /metadata/annotations/olm.providedAPIs
          - /spec/upgradeStrategy
        - group: console.openshift.io
          kind: ConsolePlugin
          name: odf-console
          jqPathExpressions:
          - .spec
          - .metadata.annotations
          - .metadata.labels
    # Creates project namespace and RBAC
    - name: 'infra-odf-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-odf'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-odf'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          operator:
            enabled: false
          odf:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
