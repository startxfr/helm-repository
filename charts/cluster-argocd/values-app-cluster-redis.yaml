# Auto-generated values-app file for deploying cluster-redis via argocd
# Source: examples/argocd/ from the cluster-redis chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-redis'
      namespace: 'openshift-gitops'
      wave: "16"
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'startx-redis'
          server: 'https://kubernetes.default.svc'

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-redis-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "36"
      server: 'https://kubernetes.default.svc'
      project: 'cluster-redis'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-redis'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          cluster:
            enabled: true
            list:
              - name: startx-redis
                namespace: startx-redis
                enabled: true
                spec: |
                  clusterSize: 3
                  clusterVersion: v7
                  kubernetesConfig:
                    image: quay.io/opstree/redis:v7.0.5
                    imagePullPolicy: IfNotPresent
                    updateStrategy: {}
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    # Installs and configures the operator
    - name: 'infra-redis-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "36"
      server: 'https://kubernetes.default.svc'
      project: 'cluster-redis'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-redis'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
            operatorGroup:
              enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-redis-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'cluster-redis'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-redis'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          rbac:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
