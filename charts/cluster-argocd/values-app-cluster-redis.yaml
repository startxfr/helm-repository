# Auto-generated values-app file for deploying cluster-redis via argocd
# Source: examples/argocd/ from the cluster-redis chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-redis'
      namespace: 'openshift-gitops'
      wave: "16"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'startx-redis'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-redis:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-redis-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "36"
      server: 'https://kubernetes.default.svc'
      project: 'infra-redis'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-redis'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          cluster:
            enabled: true
            list:
              - name: startx-redis
                namespace: startx-redis
                enabled: true
                spec: |
                  clusterSize: 3
                  clusterVersion: v7
                  kubernetesConfig:
                    image: quay.io/opstree/redis:v7.0.5
                    imagePullPolicy: IfNotPresent
                    updateStrategy: {}
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    # Installs and configures the operator
    - name: 'infra-redis-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "36"
      server: 'https://kubernetes.default.svc'
      project: 'infra-redis'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-redis'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
            operatorGroup:
              enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-redis-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-redis'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-redis'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          rbac:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
