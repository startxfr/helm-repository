# Auto-generated values-app file for deploying cluster-3scale via argocd
# Source: examples/argocd/ from the cluster-3scale chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-3scale'
      namespace: 'openshift-gitops'
      wave: "-5"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-crunchy-pgo'
          server: 'https://kubernetes.default.svc'
        - namespace: 'startx-3scale'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default-crunchy'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-3scale:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-3scale-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "48"
      server: 'https://kubernetes.default.svc'
      project: 'infra-3scale'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-3scale'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: false
          manager:
            enabled: true
          externalComponents:
            enabled: true
            redis:
              enabled: true
            database:
              enabled: true
          clusterRedis:
            enabled: true
            project:
              enabled: false
            operator:
              enabled: false
            cluster:
              enabled: true
          clusterCrunchy:
            enabled: true
            project:
              enabled: false
            operator:
              enabled: false
            cluster:
              enabled: true
    # Installs and configures the operator
    - name: 'infra-3scale-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "48"
      server: 'https://kubernetes.default.svc'
      project: 'infra-3scale'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-3scale'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: true
          manager:
            enabled: false
          externalComponents:
            enabled: false
            redis:
              enabled: false
            database:
              enabled: false
          clusterRedis:
            enabled: true
            project:
              enabled: false
            operator:
              enabled: true
            cluster:
              enabled: false
          clusterCrunchy:
            enabled: true
            project:
              enabled: false
            operator:
              enabled: true
            cluster:
              enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-3scale-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-3scale'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-3scale'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          operator:
            enabled: false
          manager:
            enabled: false
          externalComponents:
            enabled: false
          clusterRedis:
            enabled: false
          clusterCrunchy:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
