# Auto-generated values-app file for deploying cluster-trident via argocd
# Source: examples/argocd/ from the cluster-trident chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-trident'
      namespace: 'openshift-gitops'
      wave: "-7"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'trident'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-trident:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-trident-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "17"
      server: 'https://kubernetes.default.svc'
      project: 'infra-trident'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-trident'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: false
          orchestrator:
            enabled: true
          backends:
            enabled: true
          storageClasses:
            enabled: true
          volumeSnapshotClasses:
            enabled: true
    # Installs and configures the operator
    - name: 'infra-trident-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "17"
      server: 'https://kubernetes.default.svc'
      project: 'infra-trident'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-trident'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: true
            operatorGroup:
              enabled: false
          orchestrator:
            enabled: false
          backends:
            enabled: false
          storageClasses:
            enabled: false
          volumeSnapshotClasses:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-trident-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-trident'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-trident'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx.yaml
        values: |
          project:
            enabled: true
          operator:
            enabled: false
          orchestrator:
            enabled: false
          backends:
            enabled: false
          storageClasses:
            enabled: false
          volumeSnapshotClasses:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
