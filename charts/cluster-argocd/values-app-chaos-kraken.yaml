# Auto-generated values-app file for deploying chaos-kraken via argocd
# Source: examples/argocd/ from the chaos-kraken chart

argocd_project:
  enabled: true
  list:
    - name: 'chaos-kraken'
      namespace: 'openshift-gitops'
      wave: "-1"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'chaos-kraken'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:chaos-kraken:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Creates project namespace
    - name: 'chaos-kraken-project'
      namespace: 'openshift-gitops'
      finalizer: false
      wave: "1"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'default'
      project: 'chaos-kraken'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-kraken'
        targetRevision: stable
      helm: |
        values: |
          project:
            enabled: true
          kraken:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Runs the chaos job (no automated sync: every sync starts a chaos run)
    - name: 'chaos-kraken-instance'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "52"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'chaos-kraken'
      project: 'chaos-kraken'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-kraken'
        targetRevision: stable
      helm: |
        values: |
          project:
            enabled: false
          kraken:
            enabled: true
            engine: core
            cerberus:
              enabled: true
              url: http://cerberus.chaos-cerberus.svc.cluster.local:8080
            scenarios:
              pods-monitoring:
                enabled: true
            kubeconfig:
              # local: use the kraken ServiceAccount and the chaos ClusterRole of the chart
              mode: local

argocd_repocreds:
  enabled: true
  list: []
