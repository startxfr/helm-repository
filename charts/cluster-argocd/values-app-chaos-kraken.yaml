# Auto-generated values-app file for deploying chaos-kraken via argocd
# Source: examples/argocd/ from the chaos-kraken chart

argocd_project:
  enabled: true
  list:
    - name: 'chaos-chaos-kraken'
      namespace: 'openshift-gitops'
      wave: "-1"
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/*'
      destinations:
        - namespace: 'chaos-kraken'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, role:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Deploys service instances
    - name: 'chaos-chaos-kraken-instance'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "52"
      server: 'https://kubernetes.default.svc'
      project: 'chaos-kraken'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-kraken'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx-deploy.yaml
        values: |
          kraken:
            enabled: true
            mode: job
            cerberusUrl: http://cerberus.chaos-cerberus.svc.cluster.local:8080
            kubeconfig:
              mode: token
              token:
                server: https://api.demo219.startx.fr:6443
                token: sha256~REPLACE_WITH_YOUR_TOKEN
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'chaos-chaos-kraken-project'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "52"
      server: 'https://kubernetes.default.svc'
      project: 'chaos-kraken'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/chaos-kraken'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx-project.yaml
        values: |
          project:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
