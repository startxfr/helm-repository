# Auto-generated values-app file for deploying cluster-kubecost via argocd
# Source: examples/argocd/ from the cluster-kubecost chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-kubecost'
      namespace: 'openshift-gitops'
      wave: "2"
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/*'
      destinations:
        - namespace: 'default-kubecost'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default-kubecost'
          server: 'https://kubernetes.default.svc'
        - namespace: '*'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, role:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-kubecost-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "29"
      server: 'https://kubernetes.default.svc'
      project: 'infra-kubecost'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-kubecost'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          kubecost:
            enabled: true
            namespace: default-kubecost
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    # Installs and configures the operator
    - name: 'infra-kubecost-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "29"
      server: 'https://kubernetes.default.svc'
      project: 'infra-kubecost'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-kubecost'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-kubecost-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-kubecost'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-kubecost'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
