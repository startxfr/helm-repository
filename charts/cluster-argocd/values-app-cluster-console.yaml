# Auto-generated values-app file for deploying cluster-console via argocd
# Source: examples/argocd/ from the cluster-console chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-console'
      namespace: 'openshift-gitops'
      wave: "-8"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-config'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-console'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-console:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Customizes OpenShift console appearance
    - name: 'infra-console-personalize'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "1"
      server: 'https://kubernetes.default.svc'
      project: 'infra-console'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-console'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          console:
            enabled: true
            namespace: openshift-config
            state: Managed
          webTerminal:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
      ignoreDifferences: |
        - kind: ConfigMap
          name: startx-logo
          namespace: openshift-console
          jsonPointers:
            - /metadata/annotations
            - /metadata/labels
    # Enables OpenShift web terminal plugin
    - name: 'infra-console-webterminal'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "1"
      server: 'https://kubernetes.default.svc'
      project: 'infra-console'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-console'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          console:
            enabled: false
          webTerminal:
            enabled: true
            subscription:
              enabled: true
            operatorGroup:
              enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
