# Auto-generated values-app file for deploying cluster-metallb via argocd
# Source: examples/argocd/ from the cluster-metallb chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-metallb'
      namespace: 'openshift-gitops'
      wave: "-10"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'metallb-system'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles:
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-metallb:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-metallb-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "10"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'metallb-system'
      project: 'infra-metallb'
      source:
        path: 'charts/cluster-metallb'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: false
          metallb:
            enabled: true
          ipAddressPools:
            enabled: false
          l2Advertisements:
            enabled: false
          bgpPeers:
            enabled: false
          bgpAdvertisements:
            enabled: false
          bfdProfiles:
            enabled: false
          communities:
            enabled: false
          secrets:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - SkipDryRunOnMissingResource=true
      ignoreDifferences: |
        - group: metallb.io
          jsonPointers:
          - /metadata/finalizers
          kind: MetalLB
    # Installs and configures the operator
    - name: 'infra-metallb-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "5"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'metallb-system'
      project: 'infra-metallb'
      source:
        path: 'charts/cluster-metallb'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: true
          metallb:
            enabled: false
          ipAddressPools:
            enabled: false
          l2Advertisements:
            enabled: false
          bgpPeers:
            enabled: false
          bgpAdvertisements:
            enabled: false
          bfdProfiles:
            enabled: false
          communities:
            enabled: false
          secrets:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-metallb-project'
      namespace: 'openshift-gitops'
      finalizer: false
      wave: "1"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'metallb-system'
      project: 'infra-metallb'
      source:
        path: 'charts/cluster-metallb'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          operator:
            enabled: false
          metallb:
            enabled: false
          ipAddressPools:
            enabled: false
          l2Advertisements:
            enabled: false
          bgpPeers:
            enabled: false
          bgpAdvertisements:
            enabled: false
          bfdProfiles:
            enabled: false
          communities:
            enabled: false
          secrets:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
