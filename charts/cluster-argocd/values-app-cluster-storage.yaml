# Auto-generated values-app file for deploying cluster-storage via argocd
# Source: examples/argocd/ from the cluster-storage chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-storage'
      namespace: 'openshift-gitops'
      wave: "-22"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-storage:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-storage-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-2"
      server: 'https://kubernetes.default.svc'
      project: 'infra-storage'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-storage'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
