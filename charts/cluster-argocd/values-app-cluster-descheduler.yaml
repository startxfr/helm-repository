# Auto-generated values-app file for deploying cluster-descheduler via argocd
# Source: examples/argocd/ from the cluster-descheduler chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-descheduler'
      namespace: 'openshift-gitops'
      wave: "-10"
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
      destinations:
        - namespace: 'openshift-kube-descheduler-operator'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-descheduler-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "12"
      server: 'https://kubernetes.default.svc'
      project: 'cluster-descheduler'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-descheduler'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          descheduler:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Installs and configures the operator
    - name: 'infra-descheduler-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "12"
      server: 'https://kubernetes.default.svc'
      project: 'cluster-descheduler'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-descheduler'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-descheduler-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'cluster-descheduler'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-descheduler'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
