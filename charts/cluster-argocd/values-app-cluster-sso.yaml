# Auto-generated values-app file for deploying cluster-sso via argocd
# Source: examples/argocd/ from the cluster-sso chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-sso'
      namespace: 'openshift-gitops'
      wave: "-13"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'startx-sso'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-sso:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-sso-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "13"
      server: 'https://kubernetes.default.svc'
      project: 'infra-sso'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-sso'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          sso:
            enabled: true
    # Installs and configures the operator
    - name: 'infra-sso-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "13"
      server: 'https://kubernetes.default.svc'
      project: 'infra-sso'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-sso'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-sso-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-sso'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-sso'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
