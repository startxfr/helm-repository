# Auto-generated values-app file for deploying cluster-auth via argocd
# Source: examples/argocd/ from the cluster-auth chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-auth'
      namespace: 'openshift-gitops'
      wave: "-20"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: '*'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-auth:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-auth-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-5"
      server: 'https://kubernetes.default.svc'
      project: 'infra-auth'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-auth'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          auth:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
