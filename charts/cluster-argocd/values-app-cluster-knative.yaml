# Auto-generated values-app file for deploying cluster-knative via argocd
# Source: examples/argocd/ from the cluster-knative chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-knative'
      namespace: 'openshift-gitops'
      wave: "-12"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-serverless'
          server: 'https://kubernetes.default.svc'
        - namespace: 'knative-serving'
          server: 'https://kubernetes.default.svc'
        - namespace: 'knative-eventing'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-knative:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-knative-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "12"
      server: 'https://kubernetes.default.svc'
      project: 'infra-knative'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-knative'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          kServing:
            enabled: true
          kEventing:
            enabled: true
          kKafka:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Installs and configures the operator
    - name: 'infra-knative-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "12"
      server: 'https://kubernetes.default.svc'
      project: 'infra-knative'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-knative'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operator:
            enabled: true
          kServing:
            enabled: false
          kEventing:
            enabled: false
          kKafka:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-knative-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-knative'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-knative'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          projectOperator:
            enabled: true
          projectKServing:
            enabled: true
          projectKEventing:
            enabled: true
          kServing:
            enabled: false
          kEventing:
            enabled: false
          kKafka:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
