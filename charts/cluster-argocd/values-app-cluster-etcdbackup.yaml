# Auto-generated values-app file for deploying cluster-etcdbackup via argocd
# Source: examples/argocd/ from the cluster-etcdbackup chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-etcdbackup'
      namespace: 'openshift-gitops'
      wave: "-7"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'etcd-backup'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-etcdbackup:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-etcdbackup-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "17"
      server: 'https://kubernetes.default.svc'
      project: 'infra-etcdbackup'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-etcdbackup'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx.yaml
        values: |
          project:
            enabled: false
          etcdBackup:
            enabled: true
    # Creates project namespace and RBAC
    - name: 'infra-etcdbackup-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-etcdbackup'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-etcdbackup'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx.yaml
        values: |
          project:
            enabled: true
          etcdBackup:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
