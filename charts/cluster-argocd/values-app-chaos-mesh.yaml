# Generated by .tools/generate-values-app.py from charts/chaos-mesh/examples/argocd/ (do not edit by hand:
# hand tuned variants go in values-app-chaos-mesh-<variant>.yaml)

argocd_project:
  enabled: true
  list:
    - name: 'chaos-mesh'
      namespace: 'openshift-gitops'
      wave: "-10"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'chaos-mesh'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: ''
          kind: 'Namespace'
        - group: 'project.openshift.io'
          kind: 'ProjectRequest'
        - group: 'security.openshift.io'
          kind: 'SecurityContextConstraints'
        - group: 'rbac.authorization.k8s.io'
          kind: 'ClusterRole'
        - group: 'rbac.authorization.k8s.io'
          kind: 'ClusterRoleBinding'
        - group: 'apiextensions.k8s.io'
          kind: 'CustomResourceDefinition'
        - group: 'admissionregistration.k8s.io'
          kind: 'MutatingWebhookConfiguration'
        - group: 'admissionregistration.k8s.io'
          kind: 'ValidatingWebhookConfiguration'
      roles:
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:chaos-mesh:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    - name: 'chaos-mesh-instance'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "5"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'chaos-mesh'
      project: 'chaos-mesh'
      source:
        path: 'charts/chaos-mesh'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values.yaml
        values: |
          project:
            enabled: false
          mesh:
            enabled: true
            prometheus:
              create: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
      ignoreDifferences: |
        - kind: Secret
          name: chaos-mesh-webhook-certs
          jsonPointers:
          - /data
        - kind: Secret
          name: chaos-mesh-chaosd-client-certs
          jsonPointers:
          - /data
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          name: chaos-mesh-mutation
          jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: chaos-mesh-validation
          jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: chaos-mesh-validation-auth
          jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
        - group: apps
          kind: Deployment
          name: chaos-controller-manager
          jqPathExpressions:
          - .spec.template.metadata.annotations.rollme
    - name: 'chaos-mesh-project'
      namespace: 'openshift-gitops'
      finalizer: false
      wave: "1"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'default'
      project: 'chaos-mesh'
      source:
        path: 'charts/chaos-mesh'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values.yaml
        values: |
          project:
            enabled: true
          mesh:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
