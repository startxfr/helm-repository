# Auto-generated values-app file for deploying sxapi via argocd
# Source: examples/argocd/ from the sxapi chart

argocd_project:
  enabled: true
  list:
    - name: 'sxapi-dev-example'
      namespace: 'openshift-gitops'
      wave: "29"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'demo-sxapi-dev'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:sxapi-dev-example:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'sxapi-dev-example-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "49"
      server: 'https://kubernetes.default.svc'
      project: 'sxapi-dev'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/sxapi'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          sxapi:
            service:
              enabled: true
            expose:
              enabled: true
            version: "0.3.63"
            profile: "prod:start"
            debug: true
            replicas: 1
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'sxapi-dev-example-project'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "49"
      server: 'https://kubernetes.default.svc'
      project: 'project'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/project'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
            type: namespace
            name: demo-sxapi-dev
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
