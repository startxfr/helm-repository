# Auto-generated values-app file for deploying cluster-network-observability via argocd
# Source: examples/argocd/ from the cluster-network-observability chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-network-observability'
      namespace: 'openshift-gitops'
      wave: "-10"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-netobserv-operator'
          server: 'https://kubernetes.default.svc'
        - namespace: 'netobserv'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles:
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-network-observability:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-network-observability-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "10"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'netobserv'
      project: 'infra-network-observability'
      source:
        path: 'charts/cluster-network-observability'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: false
          flowcollector:
            enabled: true
          flowMetrics:
            enabled: false
          lokiRbac:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - SkipDryRunOnMissingResource=true
      ignoreDifferences: |
        - group: flows.netobserv.io
          jsonPointers:
          - /metadata/finalizers
          kind: FlowCollector
    # Installs and configures the operator
    - name: 'infra-network-observability-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "5"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'openshift-netobserv-operator'
      project: 'infra-network-observability'
      source:
        path: 'charts/cluster-network-observability'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: true
          flowcollector:
            enabled: false
          flowMetrics:
            enabled: false
          lokiRbac:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-network-observability-project'
      namespace: 'openshift-gitops'
      finalizer: false
      wave: "1"
      server: 'https://kubernetes.default.svc'
      destinationNamespace: 'openshift-netobserv-operator'
      project: 'infra-network-observability'
      source:
        path: 'charts/cluster-network-observability'
        repo: 'https://gitlab.com/startx1/helm.git'
        rev: 'stable'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          operator:
            enabled: false
          flowcollector:
            enabled: false
          flowMetrics:
            enabled: false
          lokiRbac:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
