# Auto-generated values-app file for deploying cluster-config via argocd
# Source: examples/argocd/ from the cluster-config chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-config'
      namespace: 'openshift-gitops'
      wave: "-20"
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
      destinations:
        - namespace: '*'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, role:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Deploys monitoring stack
    - name: 'infra-config-monitoring'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-config'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-config'
        rev: '21.3.201'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          monitoring:
            enabled: true
            infra_enabled: true
            storageClass: gp3-csi
            storageSize: "30Gi"
            enableUserWorkload: true
          alertmanager:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Configures network policies
    - name: 'infra-config-network'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-config'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-config'
        rev: '21.3.201'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          api:
            enabled: false
          ingresscontroller:
            enabled: true
            list:
              - name: default
                infra_enabled: true
          proxy:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Installs and configures the operator
    - name: 'infra-config-operator-elastic'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-config'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-config'
        rev: '21.3.201'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operatorElastic:
            enabled: true
            subscription:
              enabled: true
            operatorGroup:
              enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Installs and configures the operator
    - name: 'infra-config-operator-global'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-config'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-config'
        rev: '21.3.201'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operatorGlobal:
            enabled: true
            operatorGroup:
              enabled: false
          redhat:
            operators: true
          tracing:
            operators: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Installs and configures the operator
    - name: 'infra-config-operator-loki'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-config'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-config'
        rev: '21.3.201'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operatorLoki:
            enabled: true
            subscription:
              enabled: true
            operatorGroup:
              enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-config-project'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-config'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-config'
        rev: '21.3.201'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          redhat:
            operators: true
          tracing:
            operators: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-config-projecttemplate'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-config'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-config'
        rev: '21.3.201'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          autoscaling:
            enabled: false
          clusterversion:
            enabled: false
          projecttemplate:
            enabled: true
            rbac:
              enabled: true
            networkpolicy:
              enabled: true
          priorityClass:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Configures image registry
    - name: 'infra-config-registry'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-config'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-config'
        rev: '21.3.201'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          imageprunner:
            enabled: true
            schedule: "15 * * * *"
            suspend: false
          registryroute:
            enabled: true
          registryconfig:
            enabled: true
            infra_enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
