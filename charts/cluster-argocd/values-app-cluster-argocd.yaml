# Auto-generated values-app file for deploying cluster-argocd via cluster-argocd
# Source: examples/argocd/ from the cluster-argocd chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-argocd-example'
      namespace: 'openshift-gitops'
      wave: "1"
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/*'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'startx-argocd'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, role:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-argocd-example-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "9"
      server: 'https://kubernetes.default.svc'
      project: 'infra-argocd-example'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-argocd'
        rev: '21.3.201'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          argocd_project:
            enabled: true
          application:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
