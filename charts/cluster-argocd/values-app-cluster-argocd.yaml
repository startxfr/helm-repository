# Auto-generated values-app file for deploying cluster-argocd via cluster-argocd
# Source: examples/argocd/ from the cluster-argocd chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-argocd-example'
      namespace: 'openshift-gitops'
      wave: "1"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'startx-argocd'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-argocd:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-argocd-example-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "9"
      server: 'https://kubernetes.default.svc'
      project: 'infra-argocd-example'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-argocd'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          argocd_project:
            enabled: true
          application:
            enabled: true

argocd_repocreds:
  enabled: true
  list: []
