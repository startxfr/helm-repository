# Auto-generated values-app file for deploying cluster-mustgather via argocd
# Source: examples/argocd/ from the cluster-mustgather chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-mustgather'
      namespace: 'openshift-gitops'
      sourceRepos:
        - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/*'
      destinations:
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default-mustgather'
          server: 'https://kubernetes.default.svc'

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-mustgather-app'
      namespace: 'openshift-gitops'
      finalizer: true
      server: 'https://kubernetes.default.svc'
      project: 'cluster-mustgather'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-mustgather'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          report:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    # Installs and configures the operator
    - name: 'infra-mustgather-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      server: 'https://kubernetes.default.svc'
      project: 'cluster-mustgather'
      source:
        repo: 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable'
        chart: 'cluster-mustgather'
        rev: '21.3.106'
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
