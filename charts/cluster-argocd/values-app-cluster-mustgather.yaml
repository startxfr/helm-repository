# Auto-generated values-app file for deploying cluster-mustgather via argocd
# Source: examples/argocd/ from the cluster-mustgather chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-mustgather'
      namespace: 'openshift-gitops'
      wave: "22"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'default-mustgather'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-mustgather:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-mustgather-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "42"
      server: 'https://kubernetes.default.svc'
      project: 'infra-mustgather'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-mustgather'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          report:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    # Installs and configures the operator
    - name: 'infra-mustgather-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "42"
      server: 'https://kubernetes.default.svc'
      project: 'infra-mustgather'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-mustgather'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
