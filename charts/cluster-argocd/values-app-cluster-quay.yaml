# Auto-generated values-app file for deploying cluster-quay via argocd
# Source: examples/argocd/ from the cluster-quay chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-quay'
      namespace: 'openshift-gitops'
      wave: "16"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-startx-quay'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-quay:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-quay-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "36"
      server: 'https://kubernetes.default.svc'
      project: 'infra-quay'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-quay'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra-quay.yaml
        values: |
          quay:
            enabled: true
          rhn:
            user: "<your-rhn-username>"
            pwd: "<your-rhn-password>"
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    # Installs and configures the operator
    - name: 'infra-quay-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "36"
      server: 'https://kubernetes.default.svc'
      project: 'infra-quay'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-quay'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra-quay.yaml
        values: |
          operator:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-quay-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-quay'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-quay'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra-quay.yaml
        values: |
          project:
            enabled: true
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

argocd_repocreds:
  enabled: true
  list: []
