# Auto-generated values-app file for deploying cluster-dvo via argocd
# Source: examples/argocd/ from the cluster-dvo chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-dvo'
      namespace: 'openshift-gitops'
      wave: "-10"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-dvo:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-dvo-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "13"
      server: 'https://kubernetes.default.svc'
      project: 'infra-dvo'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-dvo'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          grafana:
            enabled: true
    # Installs and configures the operator
    - name: 'infra-dvo-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "13"
      server: 'https://kubernetes.default.svc'
      project: 'infra-dvo'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-dvo'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: false
          operator:
            enabled: true

argocd_repocreds:
  enabled: true
  list: []
