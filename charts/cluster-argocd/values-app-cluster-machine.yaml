# Auto-generated values-app file for deploying cluster-machine via argocd
# Source: examples/argocd/ from the cluster-machine chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-machine'
      namespace: 'openshift-gitops'
      wave: "-19"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-machine-api'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-machine:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Configures autoscaling
    - name: 'infra-machine-autoscaler'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-machine'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-machine'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          cluster:
            id: demo219-g866v
            region: eu-west-2
            autoscaler:
              enabled: true
              spec: |
                podPriorityThreshold: -10
                resourceLimits:
                  maxNodesTotal: 9
                  cores:
                    min: 6
                    max: 12
                  memory:
                    min: 12
                    max: 48
                scaleDown:
                  enabled: true
                  delayAfterAdd: 5m
                  delayAfterDelete: 3m
                  delayAfterFailure: 40s
                  unneededTime: 60s
          machineAutoscaler:
            enabled: true
    # Cluster configuration
    - name: 'infra-machine-config'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-machine'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-machine'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          machineConfigPool:
            enabled: true
          machineConfig:
            enabled: true
    # Configures health checks
    - name: 'infra-machine-healthcheck'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-machine'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-machine'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          cluster:
            id: demo219-g866v
            region: eu-west-2
          machineHealthCheck:
            enabled: true
    # Application configuration and instances
    - name: 'infra-machine-machineset'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "-4"
      server: 'https://kubernetes.default.svc'
      project: 'infra-machine'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-machine'
        targetRevision: stable
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          cluster:
            id: demo219-g866v
            region: eu-west-2
          machineSet:
            enabled: true
            list:
            - name: app-a
              az: a
              type: app
              ami: ami-0e079f8742280b034
              instanceType: "t3a.large"
              volumeSize: 75
              volumeType: "gp3"
              replicas: 1
              securityGroupName: "demo219-g866v-node"
              subnet_name: "demo219-g866v-subnet-private-eu-west-2a"
            - name: app-b
              az: b
              type: app
              ami: ami-0e079f8742280b034
              instanceType: "t3a.large"
              volumeSize: 75
              volumeType: "gp3"
              replicas: 1
              securityGroupName: "demo219-g866v-node"
              subnet_name: "demo219-g866v-subnet-private-eu-west-2b"
            - name: app-c
              az: c
              type: app
              ami: ami-0e079f8742280b034
              instanceType: "t3a.large"
              volumeSize: 75
              volumeType: "gp3"
              replicas: 1
              securityGroupName: "demo219-g866v-node"
              subnet_name: "demo219-g866v-subnet-private-eu-west-2c"

argocd_repocreds:
  enabled: true
  list: []
