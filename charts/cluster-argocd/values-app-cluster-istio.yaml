# Auto-generated values-app file for deploying cluster-istio via argocd
# Source: examples/argocd/ from the cluster-istio chart

argocd_project:
  enabled: true
  list:
    - name: 'infra-istio'
      namespace: 'openshift-gitops'
      wave: "-10"
      sourceRepos:
        - 'https://gitlab.com/startx1/helm.git'
      destinations:
        - namespace: 'startx-istio'
          server: 'https://kubernetes.default.svc'
        - namespace: 'istio-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-operators-redhat'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-operators'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-distributed-tracing'
          server: 'https://kubernetes.default.svc'
        - namespace: 'openshift-gitops'
          server: 'https://kubernetes.default.svc'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles: 
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, proj:infra-istio:admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin

# Applications
application:
  enabled: true
  list:
    # Application configuration and instances
    - name: 'infra-istio-app'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "6"
      server: 'https://kubernetes.default.svc'
      project: 'infra-istio'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-istio'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          istio:
            enabled: false
    # Installs and configures the operator
    - name: 'infra-istio-operator'
      namespace: 'openshift-gitops'
      finalizer: true
      wave: "6"
      server: 'https://kubernetes.default.svc'
      project: 'infra-istio'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-istio'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          operatorElastic:
            enabled: true
          operatorLoki:
            enabled: true
          operatorKiali:
            enabled: true
          operatorJaeger:
            enabled: true
          operatorIstio:
            enabled: true
          istio:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true
    # Creates project namespace and RBAC
    - name: 'infra-istio-project'
      namespace: 'openshift-gitops'
      finalizer: false
      server: 'https://kubernetes.default.svc'
      project: 'infra-istio'
      source:
        repoURL: 'https://gitlab.com/startx1/helm.git'
        path: 'charts/cluster-istio'
        targetRevision: devel
      helm: |
        valueFiles:
          - values-startx_noinfra.yaml
        values: |
          project:
            enabled: true
          projectOperator:
            enabled: true
          istio:
            enabled: false
      syncPolicy: |
        automated:
          prune: true
          selfHeal: true

argocd_repocreds:
  enabled: true
  list: []
