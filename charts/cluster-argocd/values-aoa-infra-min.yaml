# Default values for configuration of a STARTX cluster
# see values.yaml for explanation on each params
context: &context
  scope: startx
  cluster: default
  environment: infra
  component: argocd
  app: aoa-infra-min
  version: "0.1.0"

argocd_project:
  enabled: false
  list:
    - name: "aoa-infra-min"
      namespace: "openshift-gitops"
      sourceRepos:
        - '*'
      destinations:
        - namespace: "*"
          server: '*'
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles:
      - name: admin
        description: All privileges to group admin in project
        policies:
        - p, role:startx-admin, *, *, */*, allow
        - g, system:cluster-admins, role:admin
        groups:
        - system:cluster-admins
        - admin
application:
  enabled: false
  list: 
    - name: "aoa-infra-cluster-auth"
      namespace: "openshift-gitops"
      finalizer: true
      server: "https://kubernetes.default.svc"
      project: "aoa-infra-min"
      source: 
        repo: "https://gitlab.com/startx1/helm.git"
        rev: "stable"
        path: "charts/cluster-auth/"
      # Configuration of the helm chart
      helm: | 
        valueFiles:
          - values-startx.yaml
        parameters:
          - name: context.cluster
            value: "example"
          - name: context.environment
            value: "dev"
      # Configuration of the syncPolicy chart
      syncPolicy: | 
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - Validate=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 60s
argocd_repocreds:
  enabled: false
  list: []

# Default project used par application namespace
project: 
  enabled: false
  project: 
    enabled: false
    name: startx-argocd