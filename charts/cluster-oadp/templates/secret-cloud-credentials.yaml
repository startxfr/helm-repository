{{- if .Values.cloudcreds.enabled -}}
{{- $namespace := .Values.project.project.name | default "openshift-adp" -}}
{{- $spec := .Values.cloudcreds.spec | default "" -}}
{{- if dig "externalSecret" "enabled" false .Values.cloudcreds }}
{{- $cfg := deepCopy .Values.cloudcreds.externalSecret }}
{{- $refs := $cfg.remoteRefs | default dict }}
{{- if and (not $cfg.template) (hasKey $refs "aws_access_key_id") (hasKey $refs "aws_secret_access_key") }}
{{- /* Build the AWS-style credentials file expected by OADP from the two keys */}}
{{- $ini := printf "[%s]\naws_access_key_id={{ .aws_access_key_id }}\naws_secret_access_key={{ .aws_secret_access_key }}\n" ($cfg.profile | default "default") }}
{{- $_ := set $cfg "template" (dict "engineVersion" "v2" "data" (dict "cloud" $ini)) }}
{{- end }}
{{ include "cluster-oadp.externalSecret" (dict "root" . "name" (.Values.cloudcreds.name | default "cloud-credentials") "namespace" $namespace "config" $cfg "defaults" .Values.externalSecretDefaults "keys" (list "cloud") "wave" "1") }}
{{- else -}}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: {{ .Values.cloudcreds.name | default "cloud-credentials" | quote }}
  namespace: "{{- $namespace -}}"
  labels:
    {{- include "cluster-oadp.labels" . | nindent 4 }}
    app.kubernetes.io/name: "{{- .Values.cloudcreds.name | default "cloud-credentials" -}}-secret"
  annotations:
    {{- include "cluster-oadp.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
stringData:
  cloud: |-
  {{- $spec | nindent 4 }}
{{- end -}}
{{- end -}}


