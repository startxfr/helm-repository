# Configures LocalVolume, LocalVolumeSet and LocalVolumeDiscovery (disabled by default)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-localstorage-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-localstorage
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-localstorage
    targetRevision: 21.3.199
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        operator:
          enabled: false
        localstorage:
          enabled: false
        localstorageset:
          enabled: false
        localstoragediscovery:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-local-storage
  ignoreDifferences:
    - group: local.storage.openshift.io
      kind: LocalVolume
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
