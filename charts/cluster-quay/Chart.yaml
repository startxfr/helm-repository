apiVersion: v2
# Name of this Helm chart
name: cluster-quay
# Description of this Helm chart
description: Helm chart used to configure a Red Hat Quay registry at the cluster level, from the single pod databases of the operator up to a highly available registry (external S3 storage, PostgreSQL clusters of the cluster-crunchy or cluster-cloudnativedb sub-charts, OIDC login, pod disruption budgets)
# Helm chart application
type: application
# Version of this helm chart (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release guidelines)
version: 21.3.279
# Version name of the quay operator (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release history)
appVersion: "3.18.0"
# Icon of this helm-chart
icon: https://helm-repository.readthedocs.io/en/latest/img/cluster-quay.svg
# Kube minimum version
kubeVersion: ">=1.30.0-0"
# Keyword list for this chart
keywords:
  - kubernetes
  - helm
  - startx
  - cluster-chart
  - cluster
  - infrastructure
  - security
  - registry
  - container registry
  - docker registry
  - quay
  - postgresql
  - high availability
# STARTX helm chart repository homepage
home: https://helm-repository.readthedocs.io/en/latest
# Sources and documentation for this chart
sources:
  - https://helm-repository.readthedocs.io/en/latest/charts/cluster-quay
  - https://github.com/startxfr/helm-repository/tree/master/charts/cluster-quay
# Main maintainer contact for this helm chart
maintainers:
  - name: "STARTX"
    email: "dev@startx.fr"
    url: "https://www.startx.fr"

dependencies:
  - name: project
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.278"
    alias: project
    condition: project.enabled
  - name: operator
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.278"
    alias: operator
    condition: operator.enabled
  - name: operator
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.278"
    alias: operatorsec
    condition: operatorsec.enabled
  - name: cluster-crunchy
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.279"
    alias: crunchy
    condition: crunchy.enabled
  - name: cluster-cloudnativedb
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.279"
    alias: cloudnativedb
    condition: cloudnativedb.enabled

annotations:
  # category associated to this package
  category: cluster
  # Artifacthub category associated to this package
  artifacthub.io/category: integration-delivery
  # Artifacthub license
  artifacthub.io/license: "GPL-3.0-or-later"
  # Artifacthub is this release a pre-release
  artifacthub.io/prerelease: "true"
  # Artifacthub is an operator chart
  artifacthub.io/operator: "true"
  # Artifacthub operator capabilities
  artifacthub.io/operatorCapabilities: "Seamless Upgrades"
  # Artifacthub chart recommendations
  startx.io/recommendations: |
    - name: Startx basic chart - Project
      url: https://helm-repository.readthedocs.io/en/latest/charts/project
    - name: Startx basic chart - Operator
      url: https://helm-repository.readthedocs.io/en/latest/charts/operator
    - name: Startx cluster chart - Crunchy
      url: https://helm-repository.readthedocs.io/en/latest/charts/cluster-crunchy
    - name: Startx cluster chart - CloudNativeDB
      url: https://helm-repository.readthedocs.io/en/latest/charts/cluster-cloudnativedb
  # Artifacthub signing keys
  artifacthub.io/signKey: |
    fingerprint: FAC998719FEFFB2E03E119EE0F36B25015D3A34D
    url: https://helm-repository.readthedocs.io/en/latest/pgp_keys.asc
  # Artifacthub changes logs
  artifacthub.io/changes: |
    - kind: added
      description: "[cluster-quay] Config bundle rendered by the chart (quay.config): external S3 storage, OIDC login, extra CA certificates, custom TLS certificate"
    - kind: added
      description: "[cluster-quay] PostgreSQL clusters of Quay and Clair from the cluster-crunchy or cluster-cloudnativedb sub-charts (database.mode crunchy, cloudnativedb) or external databases, TLS verify-full"
    - kind: added
      description: "[cluster-quay] Components switches, overrides, stopped mode, PodDisruptionBudgets, ApplicationSet and Argo CD Vault Plugin examples, Argo CD health checks"
    - kind: changed
      description: "[cluster-quay] quay-operator 3.18 (channel stable-3.18), dependencies 21.3.278, QuayRegistry rendered with every component kind"
    - kind: removed
      description: "[cluster-quay] Unused values quay.image, quay.size, quay.storageClass and quay.storageAccess"
  artifacthub.io/containsSecurityUpdates: "false"