# Wave 5: OLM subscriptions of the Quay operator (openshift-operators, cluster wide) and of the Crunchy operator
# (quay-postgres, OperatorGroup). Approve the InstallPlans before the app Application syncs (installPlanApproval: Manual).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-quay-ha-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-quay-ha
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-quay
    targetRevision: 21.3.279
    helm:
      valueFiles:
        - values-startx_noinfra-quay-ha-crunchy.yaml
      values: |
        operator:
          enabled: true
        crunchy:
          operator:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
