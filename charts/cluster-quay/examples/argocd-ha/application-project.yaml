# Wave 1: namespaces of the registry (quay-enterprise) and of the databases (quay-postgres), both annotated
# Prune=false by the values file. No finalizer: deleting the Application keeps the namespaces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-quay-ha-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cluster-quay-ha
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-quay
    targetRevision: 21.3.279
    helm:
      valueFiles:
        - values-startx_noinfra-quay-ha-crunchy.yaml
      values: |
        project:
          enabled: true
        crunchy:
          project:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
