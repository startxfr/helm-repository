# Wave 10: databases, config bundle, QuayRegistry, pod disruption budgets, monitoring and network policies of the
# databases. Sync waves inside the chart order the objects (secrets 1, clusters 15, registry 25, budgets and rules 30);
# the health checks of argocd-health.yaml make Argo CD wait for the databases before creating the registry. Secrets:
# use a values file kept out of Git, or the Argo CD Vault Plugin (applicationset.yaml).
# For CloudNativePG, use values-startx_noinfra-quay-ha-cloudnativedb.yaml and the cloudnativedb flags in the three
# Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-quay-ha-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-quay-ha
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-quay
    targetRevision: 21.3.279
    helm:
      valueFiles:
        - values-startx_noinfra-quay-ha-crunchy.yaml
      values: |
        quay:
          enabled: true
        crunchy:
          cluster:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  ignoreDifferences:
    - group: postgres-operator.crunchydata.com
      kind: PostgresCluster
      jsonPointers:
        - /metadata/finalizers
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /metadata/finalizers
    - group: quay.redhat.com
      kind: QuayRegistry
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
