# Declaration in Argo CD of the Git repository holding the values of one cluster (applicationset.yaml derives its
# URL from the cluster name: the repository is named after the cluster). One Secret per cluster, with a read-only deploy token; the
# token never goes through Git: the automation that creates the Secret reads it from Vault.
apiVersion: v1
kind: Secret
metadata:
  name: repo-mycluster
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://git.example.com/infra/mycluster.git
  username: quay-argocd
  password: <deploy-token>
