# Default values for configuration of a STARTX cluster
# see values.yaml for explanation on each params
context: &context
  scope: startx
  cluster: default
  environment: infra
  component: quay
  app: startx-quay
  version: "3.18.0"
rhn:
  enabled: true
  user: startx_rhnuser
  pwd: startx_rhnpwd
route:
  enabled: true
  name: registry
quay:
  enabled: false
  hooked: false
  pullSecretEnabled: true
  admin:
    enabled: true
    username: "admin"
    password: "mysecret123"
    email: "cl@startx.fr"
project:
  enabled: false
  infra: true
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "openshift-startx-quay"
    display_name: "Startx QUAY"
    requester: startx
    description: Quay enterprise registry configured by STARTX
operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "quay-operator"
    namespace: "openshift-startx-quay"
    version: "v3.18.0"
    operator:
      channel: stable-3.18
      name: quay-operator
      installPlanApproval: Manual
      # csv: quay-operator
      source:
        name: redhat-operators
        namespace: openshift-marketplace
      config:
        infra: true
        # resources:
        #   limits:
        #     cpu: 400m
        #   requests:
        #     cpu: 400m
  operatorGroup:
    enabled: true
    hooked: false
    name: "startx-quay"
    namespace: "openshift-startx-quay"
    providedAPIs: "QuayEcosystem.v1alpha1.redhatcop.redhat.io,QuayRegistry.v1.quay.redhat.com"
operatorsec:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: false
  operatorGroup:
    enabled: false
