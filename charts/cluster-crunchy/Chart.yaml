apiVersion: v2
# Name of this Helm chart
name: cluster-crunchy
# Description of this Helm chart
description: Helm chart used to configure highly available PostgreSQL clusters using the Crunchy Postgres for Kubernetes operator, with S3 backups, restore, monitoring and network policies
# Helm chart application
type: application
# Version of this helm chart (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release guidelines)
version: 21.3.309
# Version name of the crunchy operator (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release history)
appVersion: "5.8.9"
# Icon of this helm-chart
icon: https://helm-repository.readthedocs.io/en/latest/img/cluster-crunchy.svg
# Kube minimum version
kubeVersion: ">=1.30.0-0"
# Keyword list for this chart
keywords: 
  - kubernetes
  - helm
  - startx
  - cluster-chart
  - cluster
  - infrastructure
  - crunchy
  - database
  - sql
  - postgresql
  - postgres
# STARTX helm chart repository homepage
home: https://helm-repository.readthedocs.io/en/latest
# Sources and documentation for this chart
sources:
  - https://helm-repository.readthedocs.io/en/latest/charts/cluster-crunchy
  - https://github.com/startxfr/helm-repository/tree/master/charts/cluster-crunchy
# Main maintainer contact for this helm chart
maintainers: 
  - name: "STARTX"
    email: "dev@startx.fr"
    url: "https://www.startx.fr"

dependencies:
  - name: project
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.278"
    alias: project
    condition: project.enabled
  - name: operator
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.278"
    alias: operator
    condition: operator.enabled

annotations:
  # category associated to this package
  category: cluster
  # Artifacthub category associated to this package
  artifacthub.io/category: integration-delivery
  # Artifacthub license
  artifacthub.io/license: "GPL-3.0-or-later"
  # Artifacthub is this release a pre-release
  artifacthub.io/prerelease: "true"
  # Artifacthub is an operator chart
  artifacthub.io/operator: "true"
  # Artifacthub operator capabilities
  artifacthub.io/operatorCapabilities: "Seamless Upgrades"
  # Artifacthub chart recommendations
  startx.io/recommendations: |
    - name: Startx basic chart - Project
      url: https://helm-repository.readthedocs.io/en/latest/charts/project
    - name: Startx basic chart - Operator
      url: https://helm-repository.readthedocs.io/en/latest/charts/operator
  # Artifacthub signing keys
  artifacthub.io/signKey: |
    fingerprint: FAC998719FEFFB2E03E119EE0F36B25015D3A34D
    url: https://helm-repository.readthedocs.io/en/latest/pgp_keys.asc
  # Artifacthub changes logs
  artifacthub.io/changes: |
    - kind: added
      description: "High availability settings per cluster: replicas, synchronous replication, anti-affinity, resources, parameters, owner password and extensions"
    - kind: added
      description: "S3 backups with pgBackRest (s3.list endpoints, retention, schedules), restore into a new cluster or in place"
    - kind: added
      description: "PodMonitor, PrometheusRule alerts and NetworkPolicy per cluster"
    - kind: changed
      description: "pgBouncer, pgAdmin and pg_hba trust become optional (enabled by default); instance and pgBackRest images default to the operator images; empty storageClassName uses the default StorageClass"
    - kind: changed
      description: "Crunchy Postgres for Kubernetes 5.8.9; Argo CD sync waves aligned on the repository conventions (Secrets and ConfigMaps 1, PostgresCluster 15, monitoring 30)"
    - kind: fixed
      description: "pgAdmin volume claim without accessModes, refused by the PostgresCluster CRD of the operator 5.8"
  artifacthub.io/containsSecurityUpdates: "false"
