# Default values for cluster-crunchy.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organizational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-crunchy
  # Version name of this application (default use Chart appVersion)
  version: "5.8.9"

# Configure the loaders pod
loader:
  # Enable the configuration of the crunchy loader (post install)
  enabled: false
  # List of loader to deploy
  list:
    # name of the loader
  - name: default
    # namespace of the loader
    namespace: default-crunchy
    # Command to execute for the loader
    command: |
      #!/bin/bash
      echo "write your workload generator script using psql ..."
      exit 0;

# S3 compatible buckets used by pgBackRest when a cluster sets backup.type to s3 (see cluster.list[].backup).
# One Secret <name>-pgbackrest-s3 is rendered per entry (when cluster.enabled), in its namespace, holding the credentials and the CA.
# Secret values are expected to be Argo CD Vault Plugin placeholders (<path:kv/data/...#key>) or supplied by a
# values file kept out of Git; the chart never generates them.
s3:
  # List of S3 endpoints usable by the clusters
  list: []
    # name of the endpoint, referenced by cluster.list[].backup.s3 and cluster.list[].restore.s3
  # - name: backup
    # namespace where the credentials Secret is rendered (must be the namespace of the clusters using it)
    # namespace: default-crunchy
    # Hostname of the endpoint, without scheme
    # endpoint: s3.example.com
    # Port of the endpoint (empty: 443)
    # port: ""
    # Signature region of the endpoint (required by pgBackRest)
    # region: us-east-1
    # Bucket holding the backups
    # bucket: mybucket
    # Credentials (secret)
    # accessKey: ""
    # secretKey: ""
    # PEM of a private CA signing the endpoint certificate (empty: system trust store)
    # caCert: ""
    # path (https://<endpoint>/<bucket>/) or host (https://<bucket>.<endpoint>/) addressing of the bucket
    # uriStyle: path

# Configure the crunchy environment
cluster:
  # Enable the configuration of the crunchy environment
  enabled: false
  # List of cluster to deploy. Every key not listed in the first entry below is optional: the defaults keep the
  # behaviour of the previous releases of this chart (one instance, volume based backups, pgBouncer and pgAdmin).
  list:
    # name of the cluster
  - name: default-db
    # Enable the creation and deployment of this cluster
    enabled: true
    # namespace of this cluster
    namespace: default-crunchy
    # Version of the postgresql to deploy
    postgresVersion: 14
    # storageClass to use for storage provisioning (empty: default storageClass of the cluster)
    storageClassName: gp3-csi
    # storage size to use for persistence
    storageInstanceSize: "2Gi"
    # storage size to use for backup persistence (backup.type volume)
    storageBackupSize: "2Gi"
    # default created username (owner of the database)
    username: default-user
    # Enable the istio sidecar
    istioSidecarEnabled: false
    # Init scripts
    initScript: |-
      -- Create the "default" database and "default" user
      CREATE DATABASE "default";
      CREATE USER "default" WITH PASSWORD 'Default123$';
      GRANT ALL PRIVILEGES ON DATABASE "default" TO "default";
      -- Create the "default" database and "default" user
      CREATE DATABASE "default";
      \c default
      CREATE TABLE default_table (
        field       TEXT COLLATE "C" NOT NULL,
        CONSTRAINT field PRIMARY KEY (field)
      );
      CREATE INDEX field_idx ON field (field);
      GRANT ALL PRIVILEGES ON DATABASE "default" TO "default";
    # ---- Optional keys, high availability and production settings (see README) ----
    # Name of the database owned by username (empty: the cluster name)
    database: ""
    # Password of username (secret). Empty: the operator generates one in the Secret <name>-pguser-<username>.
    # Set: the chart renders that Secret with this password, the operator computes the SCRAM verifier
    password: ""
    # Extensions created in the database at initialization (ignored when initScript is set)
    extensions: []
    # Number of PostgreSQL instances (1: no replica; 2 or more: Patroni failover)
    replicas: 1
    # Synchronous replication (Patroni synchronous_mode): no committed transaction lost at failover
    synchronous: false
    # Keep the instances on distinct nodes (required pod anti-affinity) and off the infra nodes
    avoidInfraNodes: false
    # Image of the instances (empty: default image of the operator for postgresVersion)
    image: ""
    # Resources of each instance (empty: no request nor limit)
    resources: {}
    # postgresql.conf parameters
    parameters: {}
    # Allow password-less connections from any address (pg_hba trust, behaviour of the previous releases).
    # false: the operator defaults (SCRAM authentication, TLS)
    pgHbaTrust: true
    # pgBouncer connection pooler in front of the cluster
    pgbouncer:
      enabled: true
    # pgAdmin user interface
    pgadmin:
      enabled: true
    # Backups (pgBackRest)
    backup:
      # false: no backups section (the volume based repository of a running cluster needs the annotation
      # postgres-operator.crunchydata.com/authorizeBackupRemoval=true before the operator accepts the removal)
      enabled: true
      # volume: a persistent volume of storageBackupSize; s3: an entry of s3.list
      type: volume
      # Name of the s3.list entry (type s3)
      s3: ""
      # Prefix of the repository path in the bucket (type s3): /<pathPrefix>/<name>/repo1. Empty: the namespace
      pathPrefix: ""
      # Retention of the full backups, in days
      retentionDays: 14
      # Cron schedules (5 fields)
      schedules:
        full: "0 1 * * 0"
        differential: "0 1 * * 1-6"
      # Image of pgBackRest (empty: default image of the operator)
      image: ""
    # Bootstrap the cluster from the backups of another cluster (read at cluster creation only)
    restore:
      enabled: false
      # Name of the s3.list entry holding the backups to restore from (empty: backup.s3)
      s3: ""
      # repo1-path of the source cluster, e.g. /default-crunchy/old-db/repo1. The new cluster must not back up
      # into this path: set backup.pathPrefix or the cluster name to another value
      source: ""
      # Point in time to restore, "2026-10-15 14:00:00+00" (empty: end of the archive)
      target: ""
    # Restore in place of a running cluster (spec.backups.pgbackrest.restore), triggered by the annotation
    # postgres-operator.crunchydata.com/pgbackrest-restore (see README)
    inPlaceRestore:
      enabled: false
      target: ""
    # Monitoring: pgMonitor exporter, PodMonitor and PrometheusRule (Prometheus operator CRDs, user workload monitoring)
    monitoring:
      enabled: false
      # Alert thresholds
      replicationLagBytes: 104857600
      backupMaxAgeHours: 36
      fullBackupMaxAgeDays: 8
      volumeUsagePercent: 80
    # Ingress NetworkPolicy on the database pods: same namespace, allowedNamespaces on 5432, operatorNamespaces
    # on every port, monitoringNamespaces on the metrics port
    networkPolicy:
      enabled: false
      allowedNamespaces: []
      operatorNamespaces: []
      monitoringNamespaces:
        - openshift-monitoring
        - openshift-user-workload-monitoring

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "default-crunchy"
    display_name: "Demo CrunchyDB"
    description: Demo CrunchyDB configured by STARTX

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "crunchy-postgres-operator"
    namespace: "default-crunchy"
    version: "v5.8.9"
    operator:
      channel: v5
      name: crunchy-postgres-operator
      installPlanApproval: Manual
      csv: postgresoperator
      source:
        name: certified-operators
        namespace: openshift-marketplace
      config:
        infra: false
  operatorGroup:
    enabled: true
    hooked: false
    name: "crunchy-operator"
    namespace: "default-crunchy"
    providedAPIs: "PostgresCluster.v1beta1.postgres-operator.crunchydata.com"
