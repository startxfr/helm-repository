# Deploys PostgresCluster instances in default-crunchy
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-crunchy-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-crunchy
  source:
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    chart: cluster-crunchy
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        cluster:
          enabled: true
        loader:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default-crunchy
  ignoreDifferences:
    - group: postgres-operator.crunchydata.com
      kind: PostgresCluster
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
