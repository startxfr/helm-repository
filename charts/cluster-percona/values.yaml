# Default values for cluster-percona.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organizational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-percona
  # Version name of this application (default use Chart appVersion)
  version: "3.1.0"

# Version of the operator written in spec.crVersion of every PerconaPGCluster (empty: the appVersion of the chart).
# The operator reads it to enable the features of that version; when the value is missing the operator writes its
# own version into the object, which Argo CD would report as a drift
crVersion: ""

# Default images of the components. The certified operator sets no default image: the PostgreSQL image of a cluster
# is images.postgres.<postgresVersion> unless the entry sets image, the other images apply unless the entry sets its own
images:
  # PostgreSQL (Percona Distribution for PostgreSQL) per major version
  postgres:
    "14": docker.io/percona/percona-distribution-postgresql:14.24-3
    "15": docker.io/percona/percona-distribution-postgresql:15.19-3
    "16": docker.io/percona/percona-distribution-postgresql:16.15-3
    "17": docker.io/percona/percona-distribution-postgresql:17.11.1-3
    "18": docker.io/percona/percona-distribution-postgresql:18.6.1-3
  # pgBackRest (backups, WAL archiving, restores)
  pgbackrest: docker.io/percona/percona-pgbackrest:2.59.1-2
  # pgBouncer (connection pooler)
  pgbouncer: docker.io/percona/percona-pgbouncer:1.25.2-8
  # PMM client sidecar (monitoring)
  pmm: docker.io/percona/pmm-client:3.9.1
  # Fluent Bit sidecar (log collector)
  logcollector: docker.io/percona/fluentbit:5.1.1-1

# Configure the loaders pod
loader:
  # Enable the configuration of the loader (post install)
  enabled: false
  # List of loader to deploy
  list:
    # name of the loader
  - name: default
    # namespace of the loader
    namespace: default-percona
    # Command to execute for the loader
    command: |
      #!/bin/bash
      echo "write your workload generator script using psql ..."
      exit 0;

# S3 compatible buckets used by pgBackRest when a cluster enables S3 backups (see cluster.list[].backup).
# One Secret <name>-pgbackrest-s3 is rendered per entry (when cluster.enabled), in its namespace, holding the credentials and the CA.
# Secret values are expected to be Argo CD Vault Plugin placeholders (<path:kv/data/...#key>) or supplied by a
# values file kept out of Git; the chart never generates them.
s3:
  # List of S3 endpoints usable by the clusters
  list: []
    # name of the endpoint, referenced by cluster.list[].backup.s3 and cluster.list[].restore.s3
  # - name: backup
    # namespace where the credentials Secret is rendered (must be the namespace of the clusters using it)
    # namespace: default-percona
    # Hostname of the endpoint, without scheme
    # endpoint: s3.example.com
    # Port of the endpoint (empty: 443)
    # port: ""
    # Signature region of the endpoint (required by pgBackRest)
    # region: us-east-1
    # Bucket holding the backups
    # bucket: mybucket
    # Credentials (secret)
    # accessKey: ""
    # secretKey: ""
    # PEM of a private CA signing the endpoint certificate (empty: system trust store)
    # caCert: ""
    # URI style of the endpoint: path (most S3 compatible endpoints) or host (Amazon S3)
    # uriStyle: path

# Configure the Percona Operator for PostgreSQL environment
cluster:
  # Enable the configuration of the Percona Operator for PostgreSQL environment
  enabled: false
  # List of cluster to deploy. Every key not listed in the first entry below is optional (see README)
  list:
    # name of the cluster
  - name: default-db
    # Enable the creation and deployment of this cluster
    enabled: true
    # namespace of this cluster
    namespace: default-percona
    # Major version of PostgreSQL: selects images.postgres.<version> unless image is set
    postgresVersion: 18
    # Image of the instances (empty: images.postgres.<postgresVersion>)
    image: ""
    # storageClass to use for storage provisioning (empty: default storageClass of the cluster)
    storageClassName: ""
    # storage size to use for persistence
    storageInstanceSize: "2Gi"
    # storage size of the volume based pgBackRest repository (backup.type volume)
    storageBackupSize: "2Gi"
    # Owner of the database
    username: default-user
    # Database created at initialization (empty: the cluster name)
    database: ""
    # Password of username (secret). Empty: generated by the operator. Set: the chart renders the Secret
    # <name>-pguser-<username> with it and the operator computes the SCRAM verifier
    password: ""
    # Extensions created in the database at initialization (databaseInitSQL); ignored when initScript is set
    extensions: []
    # Full psql script executed after the initialization (ConfigMap <name>-initdb), takes precedence over extensions
    initScript: ""
    # Number of PostgreSQL instances of the instance set instance1 (2 or more: Patroni failover)
    replicas: 1
    # Patroni synchronous_mode: no committed transaction lost at failover
    synchronous: false
    # Keep the instances on distinct nodes (required pod anti-affinity) and off the infra nodes, backup jobs included
    avoidInfraNodes: false
    # Resources of each instance (empty: no request nor limit)
    resources: {}
    # postgresql.conf parameters (patroni.dynamicConfiguration.postgresql.parameters)
    parameters: {}
    # Password-less connections from any address (pg_hba trust). false: the operator defaults (SCRAM, TLS)
    pgHbaTrust: false
    # Create a schema named after the owner in its database (Percona autoCreateUserSchema)
    autoCreateUserSchema: false
    # pgBouncer connection pooler (Service <name>-pgbouncer)
    pgbouncer:
      enabled: true
      replicas: 1
      # Image (empty: images.pgbouncer)
      image: ""
    # Built-in extensions of the Percona distribution, as in spec.extensions of the PerconaPGCluster. Example:
    # builtinExtensions:
    #   pg_stat_monitor:
    #     enabled: true
    #   pgvector:
    #     enabled: true
    builtinExtensions: {}
    # Enable the istio sidecar on the instances
    istioSidecarEnabled: false
    # Backups (pgBackRest)
    backup:
      enabled: true
      # volume: repository on a persistent volume (storageBackupSize); s3: repository in the bucket of an s3.list entry
      type: volume
      # Name of the s3.list entry (type s3)
      s3: ""
      # Prefix of the repository path in the bucket: /<pathPrefix>/<name>/repo1 (empty: the namespace)
      pathPrefix: ""
      # Retention of the full backups, in days (repo1-retention-full, type time)
      retentionDays: 14
      # Cron schedules (5 fields) of the full and differential backups; differential "" disables it
      schedules:
        full: "0 1 * * 0"
        differential: "0 1 * * 1-6"
      # pgBackRest image (empty: images.pgbackrest)
      image: ""
    # Bootstrap the cluster from the repository of another cluster (dataSource, read at cluster creation only)
    restore:
      enabled: false
      # Name of the s3.list entry holding the repository to restore from (empty: backup.s3)
      s3: ""
      # repo1-path of the source cluster in the bucket, e.g. /default-percona/default-db/repo1
      source: ""
      # Point in time to restore, "2026-10-15 14:00:00+00" (empty: end of the archive)
      target: ""
    # Restore in place of the running cluster: a PerconaPGRestore <name>-restore-<restoreName> is rendered (README)
    inPlaceRestore:
      enabled: false
      # Name of the restore: a finished PerconaPGRestore is never re-run, give each restore a new name
      restoreName: ""
      # Point in time to restore, "2026-10-15 14:00:00+00" (empty: end of the archive)
      target: ""
    # Monitoring with Percona Monitoring and Management (PMM 3): pmm-client sidecar on every instance
    monitoring:
      enabled: false
      # Hostname (or Service name) of the PMM server
      serverHost: monitoring-service
      # Service account token of the PMM server (secret): rendered in the Secret <name>-pmm-secret, key PMM_SERVER_TOKEN
      token: ""
      # Name of an existing Secret holding PMM_SERVER_TOKEN (empty: the Secret rendered from token)
      existingSecret: ""
      # Query analytics source: pgstatmonitor or pgstatstatements
      querySource: pgstatmonitor
      # PMM client image (empty: images.pmm)
      image: ""
    # PostgreSQL and pgBackRest logs persisted by a Fluent Bit sidecar
    logCollector:
      enabled: false
      # Fluent Bit image (empty: images.logcollector)
      image: ""
    # Ingress NetworkPolicy on the database pods: same namespace, allowedNamespaces on 5432, operatorNamespaces
    # on every port (the operator reaches the instances on 8008 and 5432)
    networkPolicy:
      enabled: false
      allowedNamespaces: []
      operatorNamespaces: []

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "default-percona"
    display_name: "Demo Percona PostgreSQL"
    description: Demo Percona Operator for PostgreSQL configured by STARTX

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator).
# Percona Operator for PostgreSQL from the certified catalog (package percona-postgresql-operator-certified, channel
# stable), own namespace: the OperatorGroup only targets the namespace of the clusters
operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "percona-postgresql-operator-certified"
    namespace: "default-percona"
    version: "v3.1.0"
    operator:
      channel: stable
      name: percona-postgresql-operator-certified
      installPlanApproval: Manual
      csv: percona-postgresql-operator-certified
      source:
        name: certified-operators
        namespace: openshift-marketplace
      config:
        infra: false
  operatorGroup:
    enabled: true
    hooked: false
    name: "percona-operator"
    namespace: "default-percona"
    providedAPIs: "PerconaPGCluster.v2.pgv2.percona.com,PerconaPGBackup.v2.pgv2.percona.com,PerconaPGRestore.v2.pgv2.percona.com,PerconaPGUpgrade.v2.pgv2.percona.com,PostgresCluster.v1beta1.upstream.pgv2.percona.com,PGUpgrade.v1beta1.upstream.pgv2.percona.com,PGAdmin.v1beta1.upstream.pgv2.percona.com,CrunchyBridgeCluster.v1beta1.upstream.pgv2.percona.com"
