# Values for the two PostgreSQL clusters of a highly available Red Hat Quay registry (see the cluster-quay chart, which embeds this chart as the percona sub-chart). Two instances per cluster, synchronous replication, SCRAM authentication, pgBackRest backups to an S3 bucket, network policies, PMM monitoring ready to switch on.
# see values.yaml for explanation on each params
context: &context
  scope: startx
  cluster: default
  environment: infra
  component: percona
  app: quay-percona
  version: "3.1.0"

loader:
  enabled: false
  list: []

# Secret values are Argo CD Vault Plugin placeholders: replace the KV path by yours, or use a values file kept out of Git
s3:
  list:
    - name: quay-backup
      namespace: quay-postgres
      endpoint: s3.example.com
      port: ""
      region: us-east-1
      bucket: quay-pgbackrest
      accessKey: <path:kv/data/quay/prod#pgbackrest_access_key>
      secretKey: <path:kv/data/quay/prod#pgbackrest_secret_key>
      caCert: ""
      uriStyle: path

cluster:
  enabled: false
  list:
    - name: quay-db
      enabled: true
      namespace: quay-postgres
      postgresVersion: 17
      image: ""
      storageClassName: ""
      storageInstanceSize: "100Gi"
      username: quay
      database: quay
      password: <path:kv/data/quay/prod#quay_db_password>
      extensions:
        - pg_trgm
      replicas: 2
      synchronous: true
      avoidInfraNodes: true
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          memory: 16Gi
      parameters:
        max_connections: "2000"
        shared_buffers: "2GB"
        effective_cache_size: "6GB"
      pgHbaTrust: false
      pgbouncer:
        enabled: false
      backup:
        enabled: true
        type: s3
        s3: quay-backup
        pathPrefix: quay-postgres
        retentionDays: 14
        schedules:
          full: "0 1 * * 0"
          differential: "0 1 * * 1-6"
      restore:
        enabled: false
        source: ""
        target: ""
      inPlaceRestore:
        enabled: false
        restoreName: ""
        target: ""
      monitoring:
        enabled: false
        serverHost: monitoring-service
        token: <path:kv/data/quay/prod#pmm_server_token>
      logCollector:
        enabled: false
      networkPolicy:
        enabled: true
        allowedNamespaces:
          - quay-enterprise
    - name: clair-db
      enabled: true
      namespace: quay-postgres
      postgresVersion: 15
      image: ""
      storageClassName: ""
      storageInstanceSize: "50Gi"
      username: clair
      database: clair
      password: <path:kv/data/quay/prod#clair_db_password>
      extensions:
        - uuid-ossp
      replicas: 2
      synchronous: true
      avoidInfraNodes: true
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          memory: 8Gi
      parameters:
        max_connections: "2000"
        shared_buffers: "1GB"
        effective_cache_size: "3GB"
      pgHbaTrust: false
      pgbouncer:
        enabled: false
      backup:
        enabled: true
        type: s3
        s3: quay-backup
        pathPrefix: quay-postgres
        retentionDays: 14
        schedules:
          full: "0 1 * * 0"
          differential: "0 1 * * 1-6"
      restore:
        enabled: false
        source: ""
        target: ""
      inPlaceRestore:
        enabled: false
        restoreName: ""
        target: ""
      monitoring:
        enabled: false
        serverHost: monitoring-service
        token: <path:kv/data/quay/prod#pmm_server_token>
      logCollector:
        enabled: false
      networkPolicy:
        enabled: true
        allowedNamespaces:
          - quay-enterprise

project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "quay-postgres"
    display_name: "Quay - PostgreSQL databases"
    requester: startx
    description: PostgreSQL databases of the Quay registry, Percona Operator for PostgreSQL, configured by STARTX
    # Argo CD never deletes the namespace of the databases, whatever the pruning policy of the Application
    additionalAnnotations: |-
      argocd.argoproj.io/sync-options: Prune=false

operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "percona-postgresql-operator-certified"
    namespace: "quay-postgres"
    version: "v3.1.0"
    operator:
      channel: stable
      name: percona-postgresql-operator-certified
      installPlanApproval: Manual
      csv: percona-postgresql-operator-certified
      source:
        name: certified-operators
        namespace: openshift-marketplace
      config:
        infra: true
  operatorGroup:
    enabled: true
    hooked: false
    name: "percona-operator"
    namespace: "quay-postgres"
    providedAPIs: "PerconaPGCluster.v2.pgv2.percona.com,PerconaPGBackup.v2.pgv2.percona.com,PerconaPGRestore.v2.pgv2.percona.com,PerconaPGUpgrade.v2.pgv2.percona.com,PostgresCluster.v1beta1.upstream.pgv2.percona.com,PGUpgrade.v1beta1.upstream.pgv2.percona.com,PGAdmin.v1beta1.upstream.pgv2.percona.com,CrunchyBridgeCluster.v1beta1.upstream.pgv2.percona.com"
