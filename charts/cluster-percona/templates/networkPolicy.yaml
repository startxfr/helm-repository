{{- if .Values.cluster }}{{- if .Values.cluster.enabled }}
{{- $defaultns := include "cluster-percona.defaultNamespace" . -}}

{{/* Ingress NetworkPolicy of every cluster with networkPolicy enabled */}}
{{- range .Values.cluster.list }}
{{- $name := .name | default "default-cluster" -}}
{{- $ns := .namespace | default $defaultns -}}
{{- $np := .networkPolicy | default dict -}}
{{- $opNs := without ($np.operatorNamespaces | default list) $ns -}}
{{- $allowed := without ($np.allowedNamespaces | default list) $ns -}}
{{- if and .enabled $np.enabled }}
---
# Only the pods of the namespace, the allowed namespaces (5432) and the operator namespaces reach the database
# pods; password and TLS are still required. The PMM client pushes its metrics to the PMM server: no ingress needed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ $name }}-postgres"
  namespace: {{ $ns | quote }}
  labels:
    {{- include "cluster-percona.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{ $name }}-postgres-networkpolicy"
    postgresql_cluster: "{{- $name -}}"
    postgresql: "{{- $name -}}"
  annotations:
    {{- include "cluster-percona.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "15"
spec:
  podSelector:
    matchLabels:
      postgres-operator.crunchydata.com/cluster: "{{- $name -}}"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    {{- if $allowed }}
    - from:
        {{- range $allowed }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if $opNs }}
    # Database operator running outside the database namespace (every port: Patroni API, PostgreSQL)
    - from:
        {{- range $opNs }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end -}}{{- end }}
