{{- if .Values.enabled }}{{- if .Values.dockercfg }}{{- if .Values.dockercfg.enabled -}}
{{- $defaultns := .Values.project.name | default .Chart.Name -}}

{{ range .Values.dockercfg.list }}
{{- $name := .name | default "registrycreds" -}}
{{- $namespace := .namespace | default $defaultns -}}
{{- /* existingSecret: the Secret is provided by the user (ExternalSecret, SealedSecret, by hand): nothing is rendered */ -}}
{{- if .existingSecret -}}
{{- if or .registry .username .password .email -}}
{{- fail (printf "project.dockercfg.list: the entry '%s' sets existingSecret and clear-text credentials (registry, username, password or email): use one or the other" .existingSecret) -}}
{{- end -}}
{{- if and .name (ne .name .existingSecret) -}}
{{- fail (printf "project.dockercfg.list: the entry '%s' sets existingSecret '%s' and a different name: drop name, the Secret keeps the name given by existingSecret" .name .existingSecret) -}}
{{- end -}}
{{- else -}}
---
kind: Secret
apiVersion: v1
type: "kubernetes.io/dockerconfigjson"
metadata:
  name: "{{- $name -}}"
  namespace: "{{- $namespace -}}"
  labels:
    {{- include "project.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{- include "startx.appName" $ -}}-dockercfg-{{- include "startx.appVersion" $ -}}"
    {{- if $.Values.dockercfg.additionalLabels }}
    {{- include "project.extra" $.Values.dockercfg.additionalLabels | nindent 4 }}
    {{- end}}
  annotations:
    {{- include "project.annotations" $ | nindent 4 }}
    template.openshift.io/expose-registry: "{{- .registry | default "docker.io" -}}"
    template.openshift.io/expose-username: "{{- .username | default "username" -}}"
    template.openshift.io/expose-email: "{{- .email | default "mail@example.com" -}}"
    template.openshift.io/expose-password: "{{- .password | default "password" -}}"
    template.openshift.io/base64-expose-dockerconfig: "{.data['\\.dockerconfigjson']}"
    {{- if $.Values.dockercfg.additionalAnnotations }}
    {{- include "project.extra" $.Values.dockercfg.additionalAnnotations | nindent 4 }}
    {{- end}}
stringData:
  .dockerconfigjson: "{{ include "imagePullSecret" . | replace "\"" "\\\"" }}"
{{ end }}
{{ end }}
{{- end -}}{{- end -}}{{- end }}
