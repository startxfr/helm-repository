apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-etcdbackup-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-etcdbackup
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-etcdbackup
    targetRevision: 21.3.278
    helm:
      valueFiles:
        - values-startx.yaml
      values: |
        project:
          enabled: false
        etcdBackup:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: etcd-backup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
