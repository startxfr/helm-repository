apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-etcdbackup-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cluster-etcdbackup
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-etcdbackup
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
    helm:
      valueFiles:
        - values-startx.yaml
      values: |
        project:
          enabled: true
        etcdBackup:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: etcd-backup
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      name: default
      jsonPointers:
        - /imagePullSecrets
        - /secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
