# Creates the startx MonitoringStack in default-prometheus. The ServiceMonitor, PodMonitor, PrometheusRule and
# AlertmanagerConfig resources of the workloads are specific to each cluster: declare them in your own values
# (serviceMonitors.list...) and switch the matching block to enabled: true.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-prometheus-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: default-prometheus
    server: https://kubernetes.default.svc
  project: cluster-prometheus
  source:
    chart: cluster-prometheus
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operatorNamespace:
          enabled: false
        operator:
          enabled: false
        monitoringStacks:
          enabled: true
        thanosQueriers:
          enabled: false
        serviceMonitors:
          enabled: false
        podMonitors:
          enabled: false
        scrapeConfigs:
          enabled: false
        prometheusRules:
          enabled: false
        alertmanagerConfigs:
          enabled: false
        networkPolicies:
          enabled: false
        routes:
          enabled: false
        secrets:
          enabled: false
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  ignoreDifferences:
    - group: monitoring.rhobs
      kind: MonitoringStack
      jsonPointers:
        - /metadata/finalizers
    - group: monitoring.rhobs
      kind: ThanosQuerier
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
