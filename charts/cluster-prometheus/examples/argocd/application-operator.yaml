# Deploys the Cluster Observability Operator in openshift-cluster-observability-operator (AllNamespaces
# install mode, OperatorGroup without target). The Subscription uses installPlanApproval Manual: approve
# the InstallPlan to install the operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-prometheus-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: openshift-cluster-observability-operator
    server: https://kubernetes.default.svc
  project: cluster-prometheus
  source:
    chart: cluster-prometheus
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operatorNamespace:
          enabled: false
        operator:
          enabled: true
        monitoringStacks:
          enabled: false
        thanosQueriers:
          enabled: false
        serviceMonitors:
          enabled: false
        podMonitors:
          enabled: false
        scrapeConfigs:
          enabled: false
        prometheusRules:
          enabled: false
        alertmanagerConfigs:
          enabled: false
        networkPolicies:
          enabled: false
        routes:
          enabled: false
        secrets:
          enabled: false
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
