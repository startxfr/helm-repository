apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-prometheus
  namespace: openshift-gitops
spec:
  description: Deploy the Cluster Observability Operator and the Prometheus monitoring stacks of the application workloads
  sourceRepos:
    - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/*'
  destinations:
    - server: https://kubernetes.default.svc
      namespace: default-prometheus
    - server: https://kubernetes.default.svc
      namespace: openshift-cluster-observability-operator
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: operators.coreos.com
      kind: OperatorGroup
    - group: operators.coreos.com
      kind: Subscription
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
