apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-kraken-instance
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: chaos-kraken
    server: https://kubernetes.default.svc
  project: chaos-kraken
  source:
    chart: chaos-kraken
    helm:
      valueFiles:
        - values-startx-deploy.yaml
      values: |
        kraken:
          enabled: true
          mode: job
          cerberusUrl: http://cerberus.chaos-cerberus.svc.cluster.local:8080
          kubeconfig:
            mode: token
            token:
              server: https://api.demo219.startx.fr:6443
              token: sha256~REPLACE_WITH_YOUR_TOKEN
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
