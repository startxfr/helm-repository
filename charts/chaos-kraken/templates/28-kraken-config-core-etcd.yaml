{{- if .Values.kraken.enabled -}}
{{- $appName := include "startx.appName" . -}}
{{- $namespace := .Values.project.project.name -}}
---
kind: ConfigMap
apiVersion: v1
immutable: false
metadata:
  name: kraken-scenario-startx-openshift-etcd-container
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "kraken-scenario-startx-openshift-etcd-container"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
data:
  startx_openshift_etcd_container.yml: |
    scenarios:
    - name: "kill etcd container"
      namespace: "openshift-etcd"
      label_selector: "k8s-app=etcd"
      container_name: "etcd"
      action: "kill 1"
      count: 1
      expected_recovery_time: 60
---
kind: ConfigMap
apiVersion: v1
immutable: false
metadata:
  name: kraken-scenario-startx-openshift-etcd-pod
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "kraken-scenario-startx-openshift-etcd-pod"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
data:
  startx_openshift_etcd_pod.yml: |
    - id: kill-pods
      config:
        namespace_pattern: ^openshift-etcd$
        label_selector: k8s-app=etcd
    - id: wait-for-pods
      config:
        namespace_pattern: ^openshift-etcd$
        label_selector: k8s-app=etcd
        count: 3
---
kind: ConfigMap
apiVersion: v1
immutable: false
metadata:
  name: kraken-scenario-post-action-etcd
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "kraken-scenario-post-action-etcd"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
data:
  post_action_etcd_container.py: |
    #!/usr/bin/env python3
    import subprocess
    import logging
    import time


    def run(cmd):
        try:
            output = subprocess.Popen(
                cmd, shell=True, universal_newlines=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
            )
            (out, err) = output.communicate()
        except Exception as e:
            logging.error("Failed to run %s, error: %s" % (cmd, e))
        return out


    i = 0
    while i < 100:
        pods_running = run("oc get pods -n openshift-etcd -l app=etcd | grep -c '4/4'").rstrip()
        if pods_running == "3":
            break
        time.sleep(5)
        i += 1

    if pods_running == str(3):
        print("There were 3 pods running properly")
    else:
        print("ERROR there were " + str(pods_running) + " pods running instead of 3")
  post_action_etcd_example_py.py: |
    #!/usr/bin/env python3
    import subprocess
    import logging


    def run(cmd):
        try:
            output = subprocess.Popen(
                cmd, shell=True, universal_newlines=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
            )
            (out, err) = output.communicate()
            logging.info("out " + str(out))
        except Exception as e:
            logging.error("Failed to run %s, error: %s" % (cmd, e))
        return out


    pods_running = run("oc get pods -n openshift-etcd | grep -c Running").rstrip()

    if pods_running == str(3):
        print("There were 3 pods running properly")
    else:
        print("ERROR there were " + str(pods_running) + " pods running instead of 3")
---
kind: ConfigMap
apiVersion: v1
immutable: false
metadata:
  name: kraken-config-chaos-etcd
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "kraken-config-chaos-etcd"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
data:
  config.yaml: |-
    kraken:
      distribution: openshift
      kubeconfig_path: /home/krkn/.kube/config
      exit_on_failure: False
      port: 8081
      publish_kraken_status: False
      signal_address: 0.0.0.0
      signal_state: RUN
      litmus_version: v1.13.6
      litmus_uninstall: False
      litmus_uninstall_before_run: False
      chaos_scenarios:
        - pod_disruption_scenarios:
          - scenarios/startx_openshift_etcd_pod.yml
        - container_scenarios: 
          - - scenarios/startx_openshift_etcd_container.yml
    cerberus:
        cerberus_enabled: True
        cerberus_url: {{ $.Values.kraken.cerberusUrl | quote }}
        check_applicaton_routes: True
    performance_monitoring:
        deploy_dashboards: False
        repo: "https://github.com/cloud-bulldozer/performance-dashboards.git"
        kube_burner_binary_url: "https://github.com/cloud-bulldozer/kube-burner/releases/download/v1.7.2/kube-burner-V1.7.2-linux-x86_64.tar.gz"
        capture_metrics: True
        config_path: config/kube_burner.yaml
        metrics_profile_path: config/metrics-aggregated.yaml
        prometheus_url:
        prometheus_bearer_token:
        uuid:
        enable_alerts: False
        alert_profile: config/alerts
    tunings:
        wait_duration: 300
        iterations: 1
        daemon_mode: False
{{- end -}}
