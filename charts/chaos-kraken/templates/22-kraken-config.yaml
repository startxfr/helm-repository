{{- if .Values.kraken.enabled -}}
{{- $namespace := .Values.project.project.name -}}
{{- $k := .Values.kraken -}}
{{- $cfg := $k.config | default dict -}}
{{- $cerberus := $k.cerberus | default dict -}}
{{- $hc := $k.healthChecks | default dict -}}
{{- $osc := $k.objectStateChecks | default dict -}}
{{- $mon := $k.monitoring | default dict -}}
{{- $kubeconfigPath := ternary "/tmp/kubeconfig" "/etc/kraken/kubeconfig/config" (eq $k.kubeconfig.mode "local") -}}
{{- if eq ($k.engine | default "core") "core" }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: kraken-config
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "kraken-config"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
data:
  config.yaml: |
    # See https://github.com/krkn-chaos/krkn/blob/main/config/config.yaml for the detail of each property
    kraken:
        kubeconfig_path: {{ $kubeconfigPath }}
        image_signature_verification_enabled: {{ include "chaos-kraken.bool" (list $cfg.imageSignatureVerification true) }}
        image_signature_public_key: cosign.pub
        exit_on_failure: {{ include "chaos-kraken.bool" (list $cfg.exitOnFailure false) }}
        auto_rollback: {{ include "chaos-kraken.bool" (list $cfg.autoRollback true) }}
        rollback_versions_directory:
        publish_kraken_status: False
        signal_state: RUN
        signal_address: 0.0.0.0
        port: 8081
        report_formats: {{ toJson ($cfg.reportFormats | default list) }}
        chaos_scenarios:
        {{- $count := 0 }}
        {{- range $name := keys ($k.scenarios | default dict) | sortAlpha }}
        {{- $s := index $k.scenarios $name }}
        {{- if $s.enabled }}
        {{- $count = add1 $count }}
        {{- if not $s.type }}{{ fail (printf "chaos-kraken: kraken.scenarios.%s.type is required" $name) }}{{ end }}
        {{- if and (not $s.file) (not $s.content) }}{{ fail (printf "chaos-kraken: kraken.scenarios.%s needs a file or a content" $name) }}{{ end }}
            - {{ $s.type }}:
                - {{ $s.file | default (printf "scenarios/custom/%s.yaml" $name) }}
        {{- end }}
        {{- end }}
        {{- if eq $count 0 }} []{{ end }}
    resiliency:
        resiliency_run_mode: {{ $cfg.resiliencyRunMode | default "disabled" }}
        resiliency_file: config/alerts.yaml
    cerberus:
        cerberus_enabled: {{ include "chaos-kraken.bool" (list $cerberus.enabled false) }}
        cerberus_url: {{ $cerberus.url | default "" }}
        check_application_routes: {{ include "chaos-kraken.bool" (list $cerberus.checkApplicationRoutes false) }}
    elastic:
        enable_elastic: False
    tunings:
        wait_duration: {{ $cfg.waitDuration | default 60 }}
        iterations: {{ $cfg.iterations | default 1 }}
        daemon_mode: {{ include "chaos-kraken.bool" (list $cfg.daemonMode false) }}
    telemetry:
        enabled: False
        events_backup: False
        logs_backup: False
        prometheus_backup: False
    performance_monitoring:
        prometheus_url: {{ $mon.prometheusUrl | default "''" }}
        prometheus_bearer_token: {{ $mon.prometheusToken | default "" }}
        uuid:
        enable_alerts: {{ include "chaos-kraken.bool" (list $mon.enableAlerts false) }}
        alert_profile: {{ $mon.alertProfile | default "config/alerts.yaml" }}
        run_during: during
        exit_on_failure: True
        only_failures: True
        enable_metrics: {{ include "chaos-kraken.bool" (list $mon.enableMetrics false) }}
        metrics_profile: {{ $mon.metricsProfile | default "config/metrics-report.yaml" }}
        check_critical_alerts: {{ include "chaos-kraken.bool" (list $mon.checkCriticalAlerts false) }}
    health_checks:
        interval: {{ $hc.interval | default 2 }}
        run_during: {{ toJson ($hc.runDuring | default "post") }}
        exit_on_failure: {{ include "chaos-kraken.bool" (list $hc.exitOnFailure false) }}
        only_failures: False
        config: {{ if $hc.endpoints }}{{ toJson $hc.endpoints }}{{ else }}[{"url": null}]{{ end }}
    kubevirt_checks:
        interval: 2
        run_during: []
        exit_on_failure: False
        namespace:
        name:
        only_failures: False
        disconnected: False
        ssh_node: ""
        node_names: ""
    object_state_checks:
        interval: {{ $osc.interval | default 2 }}
        run_during: {{ toJson ($osc.runDuring | default list) }}
        exit_on_failure: {{ include "chaos-kraken.bool" (list $osc.exitOnFailure false) }}
        only_failures: False
        config: {{ toJson ($osc.checks | default list) }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: kraken-scenarios
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "kraken-scenarios"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
data:
  {{- $any := false }}
  {{- range $name := keys ($k.scenarios | default dict) | sortAlpha }}
  {{- $s := index $k.scenarios $name }}
  {{- if and $s.enabled $s.content (not $s.file) }}
  {{- $any = true }}
  {{ $name }}.yaml: |
    {{- if kindIs "string" $s.content }}
    {{- $s.content | nindent 4 }}
    {{- else }}
    {{- toYaml $s.content | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- if not $any }}
  README: "no inline scenario enabled"
  {{- end }}
{{- end }}
{{- if ne $k.kubeconfig.mode "local" }}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: kraken-kubeconfig
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "kraken-kubeconfig"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
stringData:
{{- if eq $k.kubeconfig.mode "file" }}
  config: |
    {{- $k.kubeconfig.file | nindent 4 }}
{{- else }}
  {{- if or (not $k.kubeconfig.token.token) (contains "PUT_YOUR_TOKEN_HERE" $k.kubeconfig.token.token) }}
  {{- fail "chaos-kraken: kraken.kubeconfig.token.token must be set when kraken.kubeconfig.mode is token" }}
  {{- end }}
  config: |
    kind: Config
    apiVersion: v1
    current-context: default
    clusters:
    - name: default
      cluster:
        {{- if $k.kubeconfig.token.ca }}
        certificate-authority-data: {{ $k.kubeconfig.token.ca | b64enc }}
        {{- else if $k.kubeconfig.token.insecure }}
        insecure-skip-tls-verify: true
        {{- end }}
        server: "{{ $k.kubeconfig.token.server }}"
    users:
    - name: default
      user:
        token: "{{ $k.kubeconfig.token.token }}"
    contexts:
    - name: default
      context:
        cluster: default
        namespace: default
        user: default
    preferences: {}
{{- end }}
{{- end }}
{{- end -}}
