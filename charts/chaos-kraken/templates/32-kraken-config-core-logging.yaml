{{- if .Values.kraken.enabled -}}
{{- $appName := include "startx.appName" . -}}
{{- $namespace := .Values.project.project.name -}}
---
kind: ConfigMap
apiVersion: v1
immutable: false
metadata:
  name: kraken-scenario-startx-openshift-logging-loki
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "kraken-scenario-startx-openshift-logging-loki"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
data:
  startx_openshift_logging_loki.yml: |
    - id: kill-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "app.kubernetes.io/name=collector"
        kill: 1
    - id: wait-for-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "app.kubernetes.io/name=collector"
        timeout: 60

    - id: kill-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "app.kubernetes.io/component=ingester"
        kill: 1
    - id: wait-for-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "app.kubernetes.io/component=ingester"
        timeout: 60

    - id: kill-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "app.kubernetes.io/component=distributor"
        kill: 1
    - id: wait-for-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "app.kubernetes.io/component=distributor"
        timeout: 60

    - id: kill-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "app.kubernetes.io/component=compactor"
        kill: 1
    - id: wait-for-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "app.kubernetes.io/component=compactor"
        timeout: 60
---
kind: ConfigMap
apiVersion: v1
immutable: false
metadata:
  name: kraken-scenario-startx-openshift-logging-elastic
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "kraken-scenario-startx-openshift-logging-elastic"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
data:
  startx_openshift_logging_elastic.yml: |
    - id: kill-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "app.kubernetes.io/name=collector"
        kill: 1
    - id: wait-for-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "app.kubernetes.io/name=collector"
        timeout: 60

    - id: kill-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "common.k8s.elastic.co/type=elasticsearch"
        kill: 1
    - id: wait-for-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "common.k8s.elastic.co/type=elasticsearch"
        timeout: 90

    - id: kill-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "common.k8s.elastic.co/type=kibana"
        kill: 1
    - id: wait-for-pods
      config:
        namespace_pattern: ^openshift-logging$
        label_selector: "common.k8s.elastic.co/type=kibana"
        timeout: 60
---
kind: ConfigMap
apiVersion: v1
immutable: false
metadata:
  name: kraken-config-chaos-logging
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "kraken-config-chaos-logging"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
data:
  config.yaml: |-
    kraken:
      distribution: openshift
      kubeconfig_path: /home/krkn/.kube/config
      exit_on_failure: False
      port: 8081
      publish_kraken_status: False
      signal_address: 0.0.0.0
      signal_state: RUN
      litmus_version: v1.13.6
      litmus_uninstall: False
      litmus_uninstall_before_run: False
      chaos_scenarios:
        - pod_disruption_scenarios:
          - scenarios/startx_openshift_logging_loki.yml
    cerberus:
        cerberus_enabled: True
        cerberus_url: {{ $.Values.kraken.cerberusUrl | quote }}
        check_applicaton_routes: True
    performance_monitoring:
        deploy_dashboards: False
        repo: "https://github.com/cloud-bulldozer/performance-dashboards.git"
        kube_burner_binary_url: "https://github.com/cloud-bulldozer/kube-burner/releases/download/v1.7.2/kube-burner-V1.7.2-linux-x86_64.tar.gz"
        capture_metrics: True
        config_path: config/kube_burner.yaml
        metrics_profile_path: config/metrics-aggregated.yaml
        prometheus_url:
        prometheus_bearer_token:
        uuid:
        enable_alerts: False
        alert_profile: config/alerts
    tunings:
        wait_duration: 180
        iterations: 1
        daemon_mode: False
{{- end -}}
