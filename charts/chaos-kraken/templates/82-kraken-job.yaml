{{- if .Values.kraken.enabled -}}
{{- $namespace := .Values.project.project.name -}}
{{- $k := .Values.kraken -}}
{{- $job := $k.job | default dict -}}
{{- $local := eq $k.kubeconfig.mode "local" -}}
{{- $cloud := $k.cloud | default dict -}}
{{- $cerberus := $k.cerberus | default dict -}}
{{- $engine := $k.engine | default "core" -}}
{{- if eq $engine "core" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job.name | default "kraken-test" | quote }}
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "{{ $job.name | default "kraken-test" }}-job"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
    tool: kraken
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds | default 7200 }}
  backoffLimit: 0
  completions: 1
  parallelism: 1
  suspend: {{ $job.suspend | default false }}
  {{- if $job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ $job.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        tool: kraken
        app: {{ $job.name | default "kraken-test" | quote }}
    spec:
      serviceAccountName: kraken
      restartPolicy: Never
      containers:
      - name: kraken
        image: {{ include "chaos-kraken.image" $k.image | quote }}
        imagePullPolicy: {{ $k.image.pullPolicy | default "IfNotPresent" }}
        command:
          - /bin/bash
          - -c
        args:
          - |
            set -e
            # The image expects a fixed user owning /home/krkn/kraken: work on a writable copy instead
            cp -r /home/krkn/kraken /tmp/kraken
            cd /tmp/kraken
            mkdir -p scenarios/custom
            cp /etc/kraken/scenarios/*.yaml scenarios/custom/ 2>/dev/null || true
            {{- if $local }}
            {{- include "chaos-kraken.localKubeconfig" . | nindent 12 }}
            {{- end }}
            exec "${PYTHON_CMD:-python3.11}" run_kraken.py --config=/etc/kraken/config/config.yaml
        env:
          - name: HOME
            value: /tmp
          - name: KUBECONFIG
            value: {{ ternary "/tmp/kubeconfig" "/etc/kraken/kubeconfig/config" $local }}
        {{- if $cloud.existingSecret }}
        envFrom:
          - secretRef:
              name: {{ $cloud.existingSecret | quote }}
        {{- end }}
        resources:
          {{- toYaml ($k.resources | default dict) | nindent 10 }}
        securityContext:
          {{- include "chaos-kraken.securityContext" . | nindent 10 }}
        volumeMounts:
        - mountPath: /etc/kraken/config
          name: kraken-config
        - mountPath: /etc/kraken/scenarios
          name: kraken-scenarios
        {{- if not $local }}
        - mountPath: /etc/kraken/kubeconfig
          name: kraken-kubeconfig
          readOnly: true
        {{- end }}
      volumes:
      - name: kraken-config
        configMap:
          name: kraken-config
      - name: kraken-scenarios
        configMap:
          name: kraken-scenarios
      {{- if not $local }}
      - name: kraken-kubeconfig
        secret:
          secretName: kraken-kubeconfig
          defaultMode: 288
      {{- end }}
{{- else if eq $engine "hub" }}
{{- $hub := $k.hub | default dict }}
{{- range $name := keys ($hub.scenarios | default dict) | sortAlpha }}
{{- $s := index $hub.scenarios $name }}
{{- if $s.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ $job.name | default "kraken-test" }}-{{ $name }}"
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "{{ $job.name | default "kraken-test" }}-{{ $name }}-job"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
    tool: kraken
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds | default 7200 }}
  backoffLimit: 0
  completions: 1
  parallelism: 1
  suspend: {{ $job.suspend | default false }}
  {{- if $job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ $job.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        tool: kraken
        app: "{{ $job.name | default "kraken-test" }}-{{ $name }}"
    spec:
      serviceAccountName: kraken
      restartPolicy: Never
      containers:
      - name: kraken
        image: {{ include "chaos-kraken.image" (dict "repository" ($hub.repository | default "quay.io/krkn-chaos/krkn-hub") "tag" ($s.tag | default $name) "digest" $s.digest) | quote }}
        imagePullPolicy: {{ $hub.pullPolicy | default "IfNotPresent" }}
        command:
          - /bin/bash
          - -c
        args:
          - |
            set -e
            # The image expects a fixed user owning /home/krkn: work on a writable copy instead
            mkdir -p /tmp/krkn
            cp -r /home/krkn/kraken /home/krkn/*.sh /tmp/krkn/
            export ROOT_FOLDER=/tmp/krkn KRAKEN_FOLDER=/tmp/krkn/kraken
            {{- if $local }}
            {{- include "chaos-kraken.localKubeconfig" $ | nindent 12 }}
            {{- end }}
            cd "$KRAKEN_FOLDER"
            exec /tmp/krkn/run.sh
        env:
          - name: HOME
            value: /tmp
          - name: KRKN_KUBE_CONFIG
            value: {{ ternary "/tmp/kubeconfig" "/etc/kraken/kubeconfig/config" $local }}
          - name: TELEMETRY_ENABLED
            value: "False"
          - name: CERBERUS_ENABLED
            value: {{ include "chaos-kraken.bool" (list $cerberus.enabled false) | quote }}
          {{- if $cerberus.url }}
          - name: CERBERUS_URL
            value: {{ $cerberus.url | quote }}
          {{- end }}
          {{- range $key := keys ($s.env | default dict) | sortAlpha }}
          - name: {{ $key }}
            value: {{ index $s.env $key | toString | quote }}
          {{- end }}
        {{- if $cloud.existingSecret }}
        envFrom:
          - secretRef:
              name: {{ $cloud.existingSecret | quote }}
        {{- end }}
        resources:
          {{- toYaml ($k.resources | default dict) | nindent 10 }}
        securityContext:
          {{- include "chaos-kraken.securityContext" $ | nindent 10 }}
        {{- if not $local }}
        volumeMounts:
        - mountPath: /etc/kraken/kubeconfig
          name: kraken-kubeconfig
          readOnly: true
        {{- end }}
      {{- if not $local }}
      volumes:
      - name: kraken-kubeconfig
        secret:
          secretName: kraken-kubeconfig
          defaultMode: 288
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end -}}
