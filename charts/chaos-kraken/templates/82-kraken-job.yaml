{{- if .Values.kraken.enabled -}}
{{- $appName := include "startx.appName" . -}}
{{- $namespace := .Values.project.project.name -}}
{{- $version := .Values.kraken.version | default "latest" -}}
{{- if eq .Values.kraken.mode "job" -}}{{- if .Values.kraken.job -}}
{{- with .Values.kraken.job }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{- .prefix -}}"
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "{{- .prefix -}}-job"
    {{- include "chaos-kraken.labels" $ | nindent 4 }}
    tool: kraken
  annotations:
    {{- include "chaos-kraken.annotations" $ | nindent 4 }}
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  suspend: false
  template:
    metadata:
      labels:
        tool: kraken
        app: {{ .prefix | quote }}
    spec:
      containers:
      - name: kraken
        image: "quay.io/redhat-chaos/krkn:{{- $version -}}"
        imagePullPolicy: Always
        args:
          - python3.11 run_kraken.py -c config/config.yaml
        command:
          - /bin/sh
          - -c
        env:
          - name: KUBECONFIG
            value: /home/krkn/.kube/config
        {{- if $.Values.kraken.aws }}{{- if $.Values.kraken.aws.enabled }}
        envFrom:
          - secretRef:
              name: kraken-aws-creds
        {{- end }}{{- end }}
        resources: {}
        securityContext:
          privileged: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home/krkn/.kube/config
          name: kube-config
          subPath: config
        - mountPath: /home/krkn/kraken/scenarios
          name: kraken-scenarios
        - mountPath: /home/krkn/kraken/config/config.yaml
          name: kraken-config
          subPath: config.yaml
        - mountPath: /home/krkn/kraken/kube_burner.yaml
          name: kraken-config-common
          subPath: kube_burner.yaml
        - mountPath: /home/krkn/kraken/metrics-aggregated.yaml
          name: kraken-config-common
          subPath: metrics-aggregated.yaml
        - mountPath: /home/krkn/kraken/startx_alerts.yaml
          name: kraken-config-common
          subPath: startx_alerts.yaml
      restartPolicy: Never
      serviceAccount: kraken
      terminationGracePeriodSeconds: 10
      volumes:
      - name: kube-config
        configMap:
          defaultMode: 420
          name: kraken-kubeconfig
      - name: kraken-config
        configMap:
          defaultMode: 420
          name: kraken-config-all
          items:
          - key: config.yaml
            path: config.yaml
      - name: kraken-scenarios
        projected:
          defaultMode: 420
          sources:
          - configMap:
              name: kraken-scenario-app-outage
          - configMap:
              name: kraken-scenario-customapp-pod
          - configMap:
              name: kraken-scenario-startx-pvc-fruitapp1
          - configMap:
              name: kraken-scenario-startx-pvc-fruitapp2
          - configMap:
              name: kraken-scenario-startx-openshift-logging-loki
          - configMap:
              name: kraken-scenario-startx-openshift-logging-elastic
          - configMap:
              name: kraken-scenario-startx-openshift-machines
          - configMap:
              name: kraken-scenario-startx-openshift-monitoring
          - configMap:
              name: kraken-scenario-startx-openshift-acm
          - configMap:
              name: kraken-scenario-startx-openshift-acs
          - configMap:
              name: kraken-scenario-startx-openshift-podmonkey
          - configMap:
              name: kraken-scenario-startx-openshift-apiserver
          - configMap:
              name: kraken-scenario-startx-openshift-etcd-container
          - configMap:
              name: kraken-scenario-startx-openshift-etcd-pod
          - configMap:
              name: kraken-scenario-startx-time-node
          - configMap:
              name: kraken-scenario-startx-time-pod
          - configMap:
              name: kraken-scenario-startx-zone-outage
          - configMap:
              name: kraken-scenario-startx-node-app
          - configMap:
              name: kraken-scenario-startx-node-app-cpu-chaos
          - configMap:
              name: kraken-scenario-startx-node-app-network-chaos
          - configMap:
              name: kraken-scenario-startx-node-master-network-chaos
          - configMap:
              name: kraken-scenario-startx-node-infra-network-chaos
          - configMap:
              name: kraken-scenario-startx-node-master
          - configMap:
              name: kraken-scenario-startx-node-infra
          - configMap:
              name: kraken-scenario-startx-node-worker
          - configMap:
              name: kraken-scenario-cluster-shut-down
          - configMap:
              name: kraken-scenario-post-action-etcd
      - name: kraken-config-common
        configMap:
          defaultMode: 420
          name: kraken-config-common
          items:
          - key: startx_alerts.yaml
            path: startx_alerts.yaml
          - key: kube_burner.yaml
            path: kube_burner.yaml
          - key: metrics-aggregated.yaml
            path: metrics-aggregated.yaml
{{- end -}}{{- end -}}{{- end -}}
{{- end -}}
