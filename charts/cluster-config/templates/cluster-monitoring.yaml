{{- if .Values.monitoring.enabled -}}
{{- $m := .Values.monitoring -}}
{{- $alertmanager := $m.alertmanager | default dict -}}
kind: ConfigMap
apiVersion: v1
immutable: false
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  labels:
    {{- include "cluster-config.labels" . | nindent 4 }}
    app.kubernetes.io/name: "{{- include "startx.appName" . -}}-monitoring-{{- include "startx.appVersion" . -}}"
  annotations:
    {{- include "cluster-config.annotations" . | nindent 4 }}
data:
  config.yaml: |
    {{- if $m.enableUserWorkload }}
    enableUserWorkload: true
    {{- end }}
    {{- if $m.infra_enabled }}
    prometheusOperator:
      {{- include "cluster-config.monitoring.infraPlacement" . | nindent 6 }}
    metricsServer:
      {{- include "cluster-config.monitoring.infraPlacement" . | nindent 6 }}
    kubeStateMetrics:
      {{- include "cluster-config.monitoring.infraPlacement" . | nindent 6 }}
    openshiftStateMetrics:
      {{- include "cluster-config.monitoring.infraPlacement" . | nindent 6 }}
    telemeterClient:
      {{- include "cluster-config.monitoring.infraPlacement" . | nindent 6 }}
    thanosQuerier:
      {{- include "cluster-config.monitoring.infraPlacement" . | nindent 6 }}
    monitoringPlugin:
      {{- include "cluster-config.monitoring.infraPlacement" . | nindent 6 }}
    {{- end }}
    prometheusK8s:
      retention: {{ $m.retentionPeriod | default "7d" }}
      {{- with $m.retentionSize }}
      retentionSize: {{ . }}
      {{- end }}
      {{- with $m.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $m.infra_enabled }}
      {{- include "cluster-config.monitoring.infraPlacement" . | nindent 6 }}
      {{- end }}
      volumeClaimTemplate:
        spec:
          storageClassName: {{ $m.storageClass | default "gp3-csi" }}
          volumeMode: Filesystem
          resources:
            requests:
              storage: {{ $m.storageSize | default "20Gi" }}
      {{- $externalLabels := include "cluster-config.monitoring.externalLabels" . }}
      {{- if ne $externalLabels "{}" }}
      externalLabels:
        {{- $externalLabels | nindent 8 }}
      {{- end }}
      {{- with $m.remoteWrite }}
      remoteWrite:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    alertmanagerMain:
      {{- if eq (toString $alertmanager.enabled) "false" }}
      enabled: false
      {{- else }}
      {{- if $m.infra_enabled }}
      {{- include "cluster-config.monitoring.infraPlacement" . | nindent 6 }}
      {{- end }}
      {{- if $m.enableUserWorkload }}
      enableUserAlertmanagerConfig: true
      {{- end }}
      volumeClaimTemplate:
        spec:
          storageClassName: {{ $m.storageClass | default "gp3-csi" }}
          resources:
            requests:
              storage: {{ $m.storageSizeAlert | default "5Gi" }}
      {{- end }}
    {{- with $m.extraConfig }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
