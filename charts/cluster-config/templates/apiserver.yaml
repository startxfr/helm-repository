{{- if .Values.api.enabled }}
---
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
  labels:
    {{- include "cluster-config.labels" . | nindent 4 }}
    app.kubernetes.io/name: "cluster-api"
  annotations:
    {{- include "cluster-config.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "15"
spec:
  servingCerts:
    namedCertificates:
    - names:
      - {{ .Values.api.url }}
      servingCertificate:
        name: {{ .Values.api.name | default "api-tls" | quote }}
  audit:
    profile: Default
{{- if dig "externalSecret" "enabled" false .Values.api }}
{{ include "cluster-config.externalSecret" (dict "root" . "name" (.Values.api.name | default "api-tls") "namespace" "openshift-config" "config" .Values.api.externalSecret "defaults" .Values.externalSecretDefaults "keys" (list "tls.crt" "tls.key") "type" "kubernetes.io/tls" "wave" "0") }}
{{- else }}
---
kind: Secret
apiVersion: v1
type: kubernetes.io/tls
metadata:
  name: {{ .Values.api.name | default "api-tls" | quote }}
  namespace: openshift-config
  labels:
    {{- include "cluster-config.labels" . | nindent 4 }}
    app.kubernetes.io/name: "cluster-secret"
  annotations:
    {{- include "cluster-config.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "0"
data:
  tls.crt: >-
{{- if .Values.api.certificateChainRaw }}
    {{ default "xxxxxx" .Values.api.certificateChainRaw }}
{{- else }}
    {{ .Values.api.certificateChain | b64enc }}
{{- end }}
  tls.key: >-
{{- if .Values.api.privateKeyRaw }}
    {{ default "xxxxxx" .Values.api.privateKeyRaw }}
{{- else }}
    {{ .Values.api.privateKey | b64enc }}
{{- end }}
{{- end }}
{{- end }}