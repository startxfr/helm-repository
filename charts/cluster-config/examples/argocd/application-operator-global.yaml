# Ensures global-operators OperatorGroup exists in openshift-operators
# Note: operatorGroup.enabled: false because global-operators OG already exists on OCP clusters
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config-operator-global
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-config
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-config
    targetRevision: 21.3.107
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        operatorGlobal:
          enabled: true
          operatorGroup:
            enabled: false
        redhat:
          operators: true
        tracing:
          operators: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
