# chaos-cerberus ArgoCD deployment example
#
# Prerequisites:
#   For token/file mode — create a ServiceAccount with cluster-reader access:
#     oc create serviceaccount cerberus-monitor -n chaos-cerberus
#     oc create clusterrolebinding cerberus-monitor-cluster-reader \
#       --clusterrole=cluster-reader --serviceaccount=chaos-cerberus:cerberus-monitor
#     SA_TOKEN=$(oc create token cerberus-monitor -n chaos-cerberus --duration=8760h)
#
#   For local mode — no external credentials needed; the chart creates the
#   ClusterRole/ClusterRoleBinding automatically for the cerberus ServiceAccount.
#
# Apply with:
#   kubectl apply -f cerberus-argocd.yaml -n openshift-gitops
#
# Deletion order (to avoid stuck Terminating namespaces):
#   1. chaos-cerberus-instance  2. chaos-cerberus-project
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: chaos-cerberus
  namespace: openshift-gitops
spec:
  description: Deploy cerberus cluster healthcheck watchdog on OpenShift
  sourceRepos:
    - 'http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/*'
  destinations:
    - server: https://kubernetes.default.svc
      namespace: chaos-cerberus
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: project.openshift.io
      kind: ProjectRequest
    - group: security.openshift.io
      kind: SecurityContextConstraints
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
---
# Wave 1 — create the chaos-cerberus namespace
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-cerberus-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  # No finalizer on project wave — avoids deadlock when namespace is slow to terminate
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: chaos-cerberus
  source:
    chart: chaos-cerberus
    helm:
      values: |
        project:
          enabled: true
        cerberus:
          enabled: false
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    targetRevision: 21.3.199
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Wave 5 — deploy cerberus using in-cluster local auth (no external credentials)
# Switch kubeconfig.mode to "token" or "file" to monitor a remote cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-cerberus-instance
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: chaos-cerberus
    server: https://kubernetes.default.svc
  project: chaos-cerberus
  source:
    chart: chaos-cerberus
    helm:
      values: |
        project:
          enabled: false
        cerberus:
          enabled: true
          version: "latest"
          expose: true
          kraken_allowed: true
          kraken_ns: chaos-kraken
          isDaemon: true
          sleep_time: 15
          watch_nodes: true
          watch_cluster_operators: true
          watch_terminating_namespaces: true
          watch_namespaces:
            - openshift-etcd
            - openshift-apiserver
            - openshift-kube-apiserver
            - openshift-monitoring
            - openshift-kube-controller-manager
            - openshift-machine-api
            - openshift-kube-scheduler
            - openshift-ingress
            - openshift-ovn-kubernetes
          watch_namespaces_ignore_pattern:
            - "^installer.*"
          watch_url_routes: []
          custom_checks: []
          kubeconfig:
            # local: use the pod's own ServiceAccount token (in-cluster, no credentials needed)
            # token: monitor a remote cluster with a bearer token
            # file:  inject a full kubeconfig file
            mode: local
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    targetRevision: 21.3.199
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
