# Default values for chaos-cerberus.

# # Use it to Overwrite the helm-chart name
#nameOverride: chaos-cerberus
# # Use it to Overwrite the helm-chart version
#versionOverride: 0.0.1

# Application chaos context
context:  &context
  # Name of the global scope for this application (organizational tenant)
  scope: companyname
  # Name of the cluster running this application (platform tenant)
  cluster: clustername
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: dev
  # Component name of this application (logical tenant)
  component: chaos
  # Application name (functional tenant, default use Chart name)
  app: cerberus
  # Version name of this application (default use Chart appVersion)
  version: "1.0.4"

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    type: namespace
    name: chaos-cerberus
    display_name: Chaos - Cerberus
    description: Cerberus watchdog of the chaos test suite

# Configuration of the cerberus deployment
cerberus: 
  # Deploy the cerberus watchdog
  enabled: false
  # Cerberus container image (upstream publishes no versioned tag: pin it by digest)
  image:
    # Image repository
    repository: quay.io/krkn-chaos/cerberus
    # Image tag, used when no digest is set
    tag: latest
    # Image digest (takes precedence over the tag). Default is the build of 2026-08-19 running cerberus v1.0.4
    digest: sha256:59abd5d1119595197b842da9a4774533f9c599ed33983b7b548d899318dcf14d
    # Image pull policy
    pullPolicy: IfNotPresent
  # Run the cerberus container as privileged (binds the service account to the privileged SCC). Not required by default
  privileged: false
  # User id of the cerberus container. Leave empty on OpenShift (assigned by the SCC), set it on plain Kubernetes (ex: 1001)
  runAsUser: ""
  # Resources requests and limits of the cerberus container
  resources: {}
  # Expose the health signal outside of the cluster (route based)
  expose: false
  # Namespaces allowed to query the cerberus health signal (networkpolicy)
  allowedNamespaces:
    - chaos-kraken
    - chaos-pipeline
  # Kind of cluster watched (openshift or kubernetes)
  distribution: openshift
  # Run cerberus as a daemon (infinite loop instead of a fixed number of iterations)
  isDaemon: true
  # Number of iterations when cerberus is not a daemon
  iterations: 25
  # Sleep time between 2 checks (in seconds)
  sleep_time: 15
  # Timeout of a single check (in seconds)
  timeout: 10
  # Enable watching nodes health as part of the global health signal
  watch_nodes: true
  # Enable watching cluster operator health as part of the global health signal
  watch_cluster_operators: true
  # Enable watching terminating namespaces as part of the global health signal
  watch_terminating_namespaces: true
  # Enable watching for schedulable control plane nodes as part of the global health signal
  watch_master_schedulable: true
  # Label identifying the control plane nodes
  controlPlaneLabel: node-role.kubernetes.io/control-plane
  # Url list of endpoint to watch as part of the global healthcheck (double array)
  # Example: [["https://myapp.apps.example.com"], ["https://api.example.com/health", "Bearer mytoken"]]
  watch_url_routes: []
  # List of namespaces to watch (supports regex patterns)
  watch_namespaces:
    - openshift-etcd
    - openshift-apiserver
    - openshift-kube-apiserver
    - openshift-monitoring
    - openshift-kube-controller-manager
    - openshift-machine-api
    - openshift-kube-scheduler
    - openshift-ingress
    - openshift-ovn-kubernetes
  # Namespace ignore pattern (regex) - namespaces matching this pattern are excluded
  watch_namespaces_ignore_pattern:
    - "^installer.*"
  # List of custom check scripts to run (path relative to the cerberus working directory)
  # The scripts of customCheckScripts are copied in the custom directory. Example: ["custom/my_check.py"]
  custom_checks: []
  # Custom check scripts added to the cerberus configuration (file name: python content exposing a main() function)
  customCheckScripts: {}
  # Prometheus checks (API server latency, etcd leader changes). Not enabled by default
  prometheus:
    # Enable the prometheus checks. In local mode, binds the service account to cluster-monitoring-view
    enabled: false
    # Prometheus or thanos querier URL
    url: https://thanos-querier.openshift-monitoring.svc:9091
    # Bearer token used to query prometheus (in local mode, defaults to the service account token)
    token: ""
  # Kubeconfig of the watched cluster
  kubeconfig:
    # Connection mode to use for the cluster (could be local, token or file)
    # - local: in-cluster access using the cerberus service account, with a read-only ClusterRole (no credential needed)
    # - token: kubeconfig built from a server URL and a bearer token, stored in a Secret
    # - file: raw kubeconfig content, stored in a Secret
    mode: local
    # If mode is token, this section must be filled
    token:
      # The server URL to the target cluster API
      server: https://localhost:6443
      # The token to use to get access. A read-only access (cluster-reader) is enough
      token: sha256~XXXXXXXXXX_PUT_YOUR_TOKEN_HERE_XXXXXXXXXXXX
      # PEM content of the certificate authority of the target cluster API
      ca: ""
      # Skip the TLS verification of the target cluster API (only used when no ca is given)
      insecure: false
    # # If mode is file, this property must be set with a full kubeconfig content
    # file: |
    #   kind: Config
    #   apiVersion: v1
    #   current-context: default
    #   clusters:
    #   - name: default
    #     cluster:
    #       certificate-authority-data: XXXXXXX
    #       server: https://localhost:6443
    #   users:
    #   - name: default
    #     user:
    #       token: XXXXXXX
    #   contexts:
    #   - name: default
    #     context:
    #       cluster: default
    #       namespace: default
    #       user: default
    #   preferences: {}
