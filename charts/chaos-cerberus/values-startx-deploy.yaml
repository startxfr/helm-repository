

# # Use it to Overwrite the helm-chart name
#nameOverride: chaos-cerberus
# # Use it to Overwrite the helm-chart version
#versionOverride: 0.0.1

# Application chaos context
context:  &context
  scope: startx
  cluster: mycluster
  environment: dev
  component: chaos
  app: cerberus
  version: "1.0.4"

project: 
  enabled: false
  project: 
    name: startx-chaos-cerberus

cerberus: 
  enabled: true
  expose: true
  allowedNamespaces:
    - startx-chaos-kraken
    - startx-chaos-pipeline
  isDaemon: true
  sleep_time: 5
  watch_nodes: true
  watch_cluster_operators: true
  watch_url_routes: []
  kubeconfig:
    mode: local
