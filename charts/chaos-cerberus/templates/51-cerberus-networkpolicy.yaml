{{- if .Values.cerberus.enabled -}}
{{- $namespace := .Values.project.project.name -}}
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: cerberus-allow-signal
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "cerberus-allow-signal-networkpolicy"
    {{- include "chaos-cerberus.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-cerberus.annotations" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: cerberus
      tool: cerberus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.cerberus.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- if .Values.cerberus.expose }}
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
{{- end -}}
