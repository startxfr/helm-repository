{{- if .Values.cerberus.enabled -}}
{{- $namespace := .Values.project.project.name -}}
{{- $c := .Values.cerberus -}}
{{- $local := eq $c.kubeconfig.mode "local" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "cerberus-deployment"
    {{- include "chaos-cerberus.labels" $ | nindent 4 }}
    tool: cerberus
  annotations:
    {{- include "chaos-cerberus.annotations" $ | nindent 4 }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: cerberus
      tool: cerberus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cerberus
        tool: cerberus
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/21-cerberus-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: cerberus
      containers:
      - name: cerberus
        image: {{ include "chaos-cerberus.image" . | quote }}
        imagePullPolicy: {{ $c.image.pullPolicy | default "IfNotPresent" }}
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -e
            # The image expects to run as root in /root/cerberus: work on a writable copy instead
            cp -r /root/cerberus /tmp/cerberus
            cd /tmp/cerberus
            {{- if $local }}
            # The kubernetes python client used by cerberus does not support tokenFile: embed the token
            TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
            CA_DATA=$(base64 -w0 /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
            cat > /tmp/kubeconfig <<KUBECONFIGEOF
            kind: Config
            apiVersion: v1
            current-context: default
            clusters:
            - name: default
              cluster:
                certificate-authority-data: ${CA_DATA}
                server: https://kubernetes.default.svc
            users:
            - name: default
              user:
                token: ${TOKEN}
            contexts:
            - name: default
              context:
                cluster: default
                namespace: default
                user: default
            preferences: {}
            KUBECONFIGEOF
            {{- end }}
            exec python3 start_cerberus.py -c /etc/cerberus/config.yaml -o /tmp/cerberus.report
        env:
        - name: HOME
          value: /tmp
        - name: KUBECONFIG
          value: {{ ternary "/tmp/kubeconfig" "/etc/cerberus-kubeconfig/config" $local }}
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          {{- toYaml ($c.resources | default dict) | nindent 10 }}
        securityContext:
          {{- if $c.privileged }}
          privileged: true
          {{- else }}
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
          {{- end }}
        volumeMounts:
        - mountPath: /etc/cerberus
          name: cerberus-config
        {{- if not $local }}
        - mountPath: /etc/cerberus-kubeconfig
          name: cerberus-kubeconfig
          readOnly: true
        {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
      volumes:
      - configMap:
          defaultMode: 420
          name: cerberus-config
        name: cerberus-config
      {{- if not $local }}
      - secret:
          defaultMode: 288
          secretName: cerberus-kubeconfig
        name: cerberus-kubeconfig
      {{- end }}
{{- end -}}
