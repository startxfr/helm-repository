{{- if .Values.cerberus.enabled -}}
{{- $namespace := .Values.project.project.name -}}
{{- $c := .Values.cerberus -}}
{{- $kubeconfigPath := ternary "/tmp/kubeconfig" "/etc/cerberus-kubeconfig/config" (eq $c.kubeconfig.mode "local") -}}
---
kind: ConfigMap
apiVersion: v1
immutable: false
metadata:
  name: cerberus-config
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "cerberus-config"
    {{- include "chaos-cerberus.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-cerberus.annotations" $ | nindent 4 }}
data:
  config.yaml: |
    # See https://github.com/krkn-chaos/cerberus/blob/main/config/config.yaml for the detail of each property
    cerberus:
        distribution: {{ $c.distribution | default "openshift" }}
        kubeconfig_path: {{ $kubeconfigPath }}
        port: 8080
        watch_nodes: {{ include "chaos-cerberus.bool" (list $c.watch_nodes true) }}
        watch_cluster_operators: {{ include "chaos-cerberus.bool" (list $c.watch_cluster_operators true) }}
        watch_terminating_namespaces: {{ include "chaos-cerberus.bool" (list $c.watch_terminating_namespaces true) }}
        watch_url_routes: {{ toJson ($c.watch_url_routes | default list) }}
        watch_master_schedulable:
            enabled: {{ include "chaos-cerberus.bool" (list $c.watch_master_schedulable true) }}
            label: {{ $c.controlPlaneLabel | default "node-role.kubernetes.io/control-plane" }}
        watch_namespaces: {{ toJson ($c.watch_namespaces | default list) }}
        watch_namespaces_ignore_pattern: {{ toJson ($c.watch_namespaces_ignore_pattern | default list) }}
        cerberus_publish_status: True
        inspect_components: False
        {{- if and $c.prometheus $c.prometheus.enabled }}
        prometheus_url: {{ $c.prometheus.url | default "https://thanos-querier.openshift-monitoring.svc:9091" }}
        prometheus_bearer_token: {{ $c.prometheus.token | default (ternary "__SERVICE_ACCOUNT_TOKEN__" "" (eq $c.kubeconfig.mode "local")) }}
        {{- else }}
        prometheus_url:
        prometheus_bearer_token:
        {{- end }}
        slack_integration: False
        watcher_slack_ID:
            Monday:
            Tuesday:
            Wednesday:
            Thursday:
            Friday:
            Saturday:
            Sunday:
        slack_team_alias:
        custom_checks: {{ toJson ($c.custom_checks | default list) }}
    tunings:
        timeout: {{ $c.timeout | default 10 }}
        iterations: {{ $c.iterations | default 25 }}
        sleep_time: {{ $c.sleep_time | default 10 }}
        kube_api_request_chunk_size: 500
        daemon_mode: {{ include "chaos-cerberus.bool" (list $c.isDaemon true) }}
        cores_usage_percentage: 0.6
    database:
        database_path: /tmp/cerberus.db
        reuse_database: False
  {{- range $name, $content := $c.customCheckScripts }}
  {{ $name }}: |-
    {{- $content | nindent 4 }}
  {{- end }}
{{- if ne $c.kubeconfig.mode "local" }}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: cerberus-kubeconfig
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "cerberus-kubeconfig"
    {{- include "chaos-cerberus.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-cerberus.annotations" $ | nindent 4 }}
stringData:
{{- if eq $c.kubeconfig.mode "file" }}
  config: |
    {{- $c.kubeconfig.file | nindent 4 }}
{{- else }}
  {{- if or (not $c.kubeconfig.token.token) (contains "PUT_YOUR_TOKEN_HERE" $c.kubeconfig.token.token) }}
  {{- fail "chaos-cerberus: cerberus.kubeconfig.token.token must be set when cerberus.kubeconfig.mode is token" }}
  {{- end }}
  config: |
    kind: Config
    apiVersion: v1
    current-context: default
    clusters:
    - name: default
      cluster:
        {{- if $c.kubeconfig.token.ca }}
        certificate-authority-data: {{ $c.kubeconfig.token.ca | b64enc }}
        {{- else if $c.kubeconfig.token.insecure }}
        insecure-skip-tls-verify: true
        {{- end }}
        server: "{{ $c.kubeconfig.token.server }}"
    users:
    - name: default
      user:
        token: "{{ $c.kubeconfig.token.token }}"
    contexts:
    - name: default
      context:
        cluster: default
        namespace: default
        user: default
    preferences: {}
{{- end }}
{{- end }}
{{- end -}}
