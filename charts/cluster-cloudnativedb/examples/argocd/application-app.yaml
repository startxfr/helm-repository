# Deploys CloudNativePG clusters in default-cloudnativedb
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-cloudnativedb-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-cloudnativedb
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-cloudnativedb
    targetRevision: 21.3.279
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        cluster:
          enabled: true
        loader:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default-cloudnativedb
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
