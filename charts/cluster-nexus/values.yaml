# Default values for cluster-nexus.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organisational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-nexus
  # Version name of this application (default use Chart appVersion)
  version: "3.90.3"

# Deploy a Nexus server instance
nexus:
  # Enable the configuration of the Nexus server
  enabled: false
  # Activate the manager as a helm hook
  hooked: false
  # Name of the deployed instance of NexusRepo
  name: default
  # The applied Nexus config specifications
  spec: |
    daemonNodeSelector:
      node-role.kubernetes.io/worker: ""


# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
# openshift-operators already exists as a system namespace — keep disabled
project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "openshift-operators"
    display_name: Operator NEXUS
    description: Nexus HA configured by STARTX

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "nexus-repository-ha-operator-certified"
    namespace: "openshift-operators"
    version: "v3.90.3-1"
    operator:
      channel: stable
      name: nexus-repository-ha-operator-certified
      installPlanApproval: Automatic
      # csv: nexus-repository-ha-operator-certified.v3.90.3-1
      source:
        name: certified-operators
        namespace: openshift-marketplace
      config:
        infra: false
  operatorGroup:
    enabled: true
    hooked: false
    name: "global-operators"
    namespace: "openshift-operators"
    providedAPIs: "NexusRepo.v1alpha1.sonatype.com"
