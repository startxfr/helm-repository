{{- if .Values.nexus.enabled -}}
{{- $namespace := .Values.nexus.namespace | default .Values.project.project.name -}}
{{- $spec := .Values.nexus.spec | default "{}" -}}
apiVersion: sonatype.com/v1alpha1
kind: NexusRepo
metadata:
  name: {{ .Values.nexus.name | default "default" | quote }}
  namespace: "{{- $namespace -}}"
  labels:
    {{- include "cluster-nexus.labels" . | nindent 4 }}
    app.kubernetes.io/name: "{{- .Values.nexus.name | default "default" -}}-nexusrepo"
  annotations:
    {{- include "cluster-nexus.annotations" . | nindent 4 }}
    {{- if .Values.nexus.hooked }}
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: hook-failed
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
    {{- end }}
    argocd.argoproj.io/sync-wave: "10"
spec:
  {{- $spec | nindent 2 }}
{{- end -}}
