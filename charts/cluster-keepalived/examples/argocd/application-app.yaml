# Configures cluster network, KeepalivedGroups and optional IngressController
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-keepalived-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-keepalived
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-keepalived
    targetRevision: 21.3.4
    helm:
      values: |
        project:
          enabled: false
        operator:
          enabled: false
        clusterNetwork:
          enabled: true
          externalIP:
            autoAssignCIDRs:
              - 10.99.10.237/32
            policy:
              allowedCIDRs:
                - 10.99.10.237/32
        keepalived:
          enabled: true
          groups:
            enabled: true
            list:
              - name: keepalivedgroup-workers
                namespace: openshift-ingress
                spec: |
                  blacklistRouterIDs:
                    - 165
                    - 168
                    - 169
                  image: registry.redhat.io/openshift4/ose-keepalived-ipfailover
                  interface: br-ex
                  nodeSelector:
                    node-role.kubernetes.io/infra: ''
        ingressController:
          enabled: true
          name: public
          domain: apps.public.example.com
          replicas: 3
          routeSelector:
            matchLabels:
              ingress: public
        ingressControllerService:
          enabled: true
          name: router-public-lb
          externalIPs:
            - 10.99.10.237
        ingressControllerSecret:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
