{{- if .Values.DataScienceCluster -}}{{- if .Values.DataScienceCluster.enabled -}}
{{- $ns := .Values.project.project.name | default "default-ods" -}}
{{- with .Values.DataScienceCluster }}
{{- $namespace := .namespace | default $ns -}}
{{- $name := .name | default "default-dsc" -}}
---
apiVersion: {{ .apiVersion | default "datasciencecluster.opendatahub.io/v2" }}
kind: DataScienceCluster
metadata:
  name: "{{ $name }}"
  {{- /* clusterScoped: true omits metadata.namespace (a DataScienceCluster is cluster scoped) */}}
  {{- if not .clusterScoped }}
  namespace: "{{- $namespace -}}"
  {{- end }}
  labels:
    {{- include "cluster-ods.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{ $name }}-dsc"
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "cluster-ods.annotations" $ | nindent 4 }}
    {{- toYaml (mergeOverwrite (dict "argocd.argoproj.io/sync-wave" "15") (.annotations | default dict)) | nindent 4 }}
spec:
  {{- .spec | nindent 2 }}
{{- end }}
{{- end -}}{{- end -}}
