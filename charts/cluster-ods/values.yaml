# Default values for cluster-ods.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organisational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: datascience
  # Version name of this application (default use Chart appVersion)
  version: "2.25.2"

# configuration of the rh-ods DataScienceCluster
DataScienceCluster:
  # Enable the creation of a DataScienceCluster
  enabled: true
  # Name of the cluster
  name: "default-dsc"
  # Namespace used for the DataScienceCluster (default is the project)
  namespace: "rhods-operator"
  # API version of the DataScienceCluster (RHOAI 3.x requires v2, use datasciencecluster.opendatahub.io/v1 for RHOAI 2.x)
  apiVersion: "datasciencecluster.opendatahub.io/v2"
  # Additional labels of the DataScienceCluster (map)
  labels: {}
  # Additional annotations of the DataScienceCluster (map, e.g. argocd sync-wave override)
  annotations: {}
  # Spec of the DataScienceCluster. The default components below are the ones of RHOAI 2.x: with the v2 API
  # (RHOAI 3.x) replace this spec with the components of your RHOAI release
  spec: |
    components:
      codeflare:
        managementState: Managed
      kserve:
        managementState: Managed
        nim:
          managementState: Managed
        rawDeploymentServiceConfig: Headless
        serving:
          ingressGateway:
            certificate:
              type: OpenshiftDefaultIngress
          managementState: Managed
          name: knative-serving
      modelregistry:
        managementState: Removed
        registriesNamespace: rhoai-model-registries
      trustyai:
        managementState: Managed
      ray:
        managementState: Managed
      kueue:
        managementState: Managed
      workbenches:
        managementState: Managed
      dashboard:
        managementState: Managed
      modelmeshserving:
        managementState: Managed
      datasciencepipelines:
        managementState: Managed
      trainingoperator:
        managementState: Managed

# Configuration of the rh-ods DSCInitialization (cluster scoped, created before the DataScienceCluster)
DSCInitialization:
  # Enable the creation of a DSCInitialization (the operator creates a default one when none exists)
  enabled: false
  # Name of the DSCInitialization
  name: "default-dsci"
  # API version of the DSCInitialization
  apiVersion: "dscinitialization.opendatahub.io/v2"
  # Additional labels of the DSCInitialization (map)
  labels: {}
  # Additional annotations of the DSCInitialization (map)
  annotations: {}
  # Namespace of the RHOAI applications (when set, override spec.applicationsNamespace)
  applicationsNamespace: ""
  # Free spec of the DSCInitialization (YAML string)
  spec: |
    monitoring:
      managementState: Managed
      namespace: redhat-ods-monitoring
    trustedCABundle:
      managementState: Managed

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project: 
  enabled: true
  context: 
    <<: *context
  project: 
    enabled: true
    hooked: false
    type: namespace
    name: "rhods-operator"
    display_name: "Startx OpenDataScience"
    requester: startx
    description: Startx OpenDataScience operator
  rbac: 
    enabled: true
    groups: 
    - id: devops-view
      name: devops
      role: view
    - id: ops-admin
      name: ops
      role: admin


# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operator:
  enabled: true
  context: 
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "rhods-operator"
    namespace: "rhods-operator"
    version: "2.25.2"
    operator: 
      channel: "stable"
      name: rhods-operator
      installPlanApproval: Manual
      # csv: rhods-operator
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: false
  operatorGroup:
    enabled: true
    hooked: false
    target: "all-ns"
    name: "rhods-operator"
    namespace: "rhods-operator"
    providedAPIs: "DSCInitialization.v1.dscinitialization.opendatahub.io,DSCInitialization.v2.dscinitialization.opendatahub.io,DataScienceCluster.v1.datasciencecluster.opendatahub.io,DataScienceCluster.v2.datasciencecluster.opendatahub.io,FeatureTracker.v1.features.opendatahub.io"
