{{- if .Values.communities.enabled -}}
{{- $namespace := .Values.project.project.name | default "metallb-system" -}}
{{- range .Values.communities.list }}
{{- $name := required "communities.list: every item needs a name" .name }}
---
apiVersion: metallb.io/v1beta1
kind: Community
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "cluster-metallb.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{- $name -}}-community"
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "cluster-metallb.annotations" $ | nindent 4 }}
    {{- if $.Values.communities.hooked }}
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "30"
    helm.sh/hook-delete-policy: hook-failed
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
    {{- end }}
    argocd.argoproj.io/sync-wave: "30"
spec:
  {{- include "cluster-metallb.spec" (dict "kind" "Community" "name" $name "spec" .spec "required" true) | nindent 2 }}
{{- end }}
{{- end -}}
