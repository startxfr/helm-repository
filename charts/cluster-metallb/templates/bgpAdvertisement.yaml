{{- if .Values.bgpAdvertisements.enabled -}}
{{- $namespace := .Values.project.project.name | default "metallb-system" -}}
{{- range .Values.bgpAdvertisements.list }}
{{- $name := required "bgpAdvertisements.list: every item needs a name" .name }}
---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "cluster-metallb.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{- $name -}}-bgpadvertisement"
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "cluster-metallb.annotations" $ | nindent 4 }}
    {{- if $.Values.bgpAdvertisements.hooked }}
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "40"
    helm.sh/hook-delete-policy: hook-failed
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
    {{- end }}
    argocd.argoproj.io/sync-wave: "40"
{{- if .spec }}
spec:
  {{- include "cluster-metallb.spec" (dict "kind" "BGPAdvertisement" "name" $name "spec" .spec) | nindent 2 }}
{{- else }}
spec: {}
{{- end }}
{{- end }}
{{- end -}}
