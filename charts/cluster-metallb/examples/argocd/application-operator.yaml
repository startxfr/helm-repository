# Deploys the MetalLB operator in metallb-system (AllNamespaces install mode, OperatorGroup without target).
# The Subscription uses installPlanApproval Manual: approve the InstallPlan to install the operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-metallb-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: metallb-system
    server: https://kubernetes.default.svc
  project: cluster-metallb
  source:
    chart: cluster-metallb
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: true
        metallb:
          enabled: false
        ipAddressPools:
          enabled: false
        l2Advertisements:
          enabled: false
        bgpPeers:
          enabled: false
        bgpAdvertisements:
          enabled: false
        bfdProfiles:
          enabled: false
        communities:
          enabled: false
        secrets:
          enabled: false
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
