# Default values for cluster-logging.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organisational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-logging
  # Version name of this application (default use Chart appVersion)
  version: "6.5.1"

# Default settings of the ExternalSecret objects rendered by this chart when a
# secret is sourced from an external store (`externalSecret.enabled: true`).
# Requires the External Secrets Operator and a SecretStore/ClusterSecretStore.
externalSecretDefaults:
  # API version of the ExternalSecret CRD (external-secrets.io/v1beta1 for ESO releases without the v1 API)
  apiVersion: external-secrets.io/v1
  # How often the Secret is refreshed from the external store
  refreshInterval: 1h
  # Store to read from (name is required as soon as a secret uses externalSecret)
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore

# configuration of the logging service (legacy generation, ignored when observability.enabled is true)
logging:
  # Enable the deployment of the logging service
  enabled: false
  # Enable the deployment of the logging service into infra nodes
  infra_enabled: false
  # Activate the manager as a helm hook
  hooked: false
  # The ApiVersion of the logging
  # apiVersion: "observability.openshift.io/v1"
  apiVersion: "logging.openshift.io/v1"
  # set the management state to use
  managementState: "Managed"
  # Section for external exposition of elasticsearch
  expose:
    # Enable creating the route
    enabled: false
    # CACertificate for the elasticsearch. Defined in a secret (see bellow)
    destinationCACert: |
      -----BEGIN CERTIFICATE-----
      place here your elasticsearch certificate. 
      You can get it with 
      oc extract secret/elasticsearch \
      -n openshift-logging --to=. --keys=admin-ca && \
      cat admin-ca
      -----END CERTIFICATE-----
  # configuration of the elasticsearch service
  elasticsearch:
    # Enable the deployment of the elasticsearch service
    enabled: false
    # number of elasticsearch instances
    replicas: 3
    # the redundancy policy applied to this elastic (could be ZeroRedundancy, SingleRedundancy, MultipleRedundancy and FullRedundancy)
    redundancyPolicy: SingleRedundancy
    # Resource spec for elasticsearch pods
    resources:
      limits:
        cpu: 1
        memory: 500Mi
      requests:
        cpu: 500m
        memory: 100Mi
    # configuration of the storage
    storage: 
      # name of the storageclass to use
      class: gp3-csi
      # the size of the storage to provision
      size: "200G"
  # configuration of the kibana service
  kibana:
    # Enable the deployment of the kibana service
    enabled: true
    # number of kibana instances
    replicas: 3
    # Resource spec for kibana pods
    resources:
      limits:
        cpu: 1
        memory: 500Mi
      requests:
        cpu: 500m
        memory: 100Mi
  # configuration of the curation service
  curation:
    # Enable the deployment of the curation service
    enabled: true
    # Configuration the schedulling of curator
    schedule: "30 3 * * *"
    # # Resource spec for curation pods
    # resources:
    #   requests:
    #     cpu: "100m"
  # configuration of the collector service
  collector:
    # Enable the deployment of the collector service
    enabled: true
    # Type of collector engine (must be vector or fluentd. default is vector)
    type: "vector"
    # # Resource spec for collector pods
    # resources:
    #   requests:
    #     cpu: "100m"

# configuration of the eventrouter service
eventrouter:
  # Enable the deployment of the eventrouter service
  enabled: false
  # number of eventrouter instances
  replicas: 1
  # Resource spec for eventrouter pods
  resources:
    limits:
      cpu: 400m
      memory: 512Mi
    requests:
      cpu: "100m"
      memory: 128Mi

# configuration of the logforwarder service (legacy generation, only the secret is used when observability.enabled is true)
logforwarder:
  # Enable the deployment of the logforwarder service
  enabled: false
  # configure the service account for the forwarder
  sa: 
    # Enable the deployment of the service account
    enabled: false
    # name of the service account
    name: "logging-admin"
  # The ApiVersion of the forwarder
  # apiVersion: "observability.openshift.io/v1"
  apiVersion: "logging.openshift.io/v1"
  # spec of the og forwarder
  spec: |
    pipelines: 
    - name: all-to-default
      inputRefs:
      - infrastructure
      - application
      - audit
      outputRefs:
      - default
  # Configuration of the secret for external logging stack
  secret:
    # Enable the creation of the external secret configuration
    enabled: false
    # Name of the secret (default is elk-secret)
    name: elasticsearch-external
    # CA Bundle that sign the certificate
    CABundle: |-
      ----BEGIN CERTIFICATE-----
      MIIEWjxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      -----END CERTIFICATE-----
      ----BEGIN CERTIFICATE-----
      MIIEWjxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      -----END CERTIFICATE-----
    # TLS certificate
    tlsCrt: |-
      ----BEGIN CERTIFICATE-----
      MIIEWjxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      -----END CERTIFICATE-----
    # Private key of the TLS certificate
    tlsKey: |-
      -----BEGIN RSA PRIVATE KEY-----
      MIIJKAyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
      yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
      -----END RSA PRIVATE KEY-----
    # Login to the external Elastic endpoint
    username: mypwd
    # Password to the external Elastic endpoint
    password: mypwd
    # Source this Secret from an external store instead of the values above:
    # renders an ExternalSecret producing the same Secret (keys of your choice)
    externalSecret:
      enabled: false
      # remoteRefs:
      #   username:
      #     key: ocp/logging/elasticsearch
      #     property: username
      #   password:
      #     key: ocp/logging/elasticsearch
      #     property: password
      # # ...or fetch every key of the external secret at once
      # dataFrom:
      #   - extract:
      #       key: ocp/logging/elasticsearch

# Configuration of the new logging generation (Logging 6.x, API observability.openshift.io): collector service
# account, ClusterLogForwarder and logging UIPlugin of the Cluster Observability Operator. It requires a
# Logging 6.x operator, a LokiStack (see the cluster-loki chart) and, for the UIPlugin, the Cluster
# Observability Operator (see operatorObservability)
observability:
  # Select the logging generation managed by this chart
  #   false : legacy generation (Logging 5.x) configured by the logging and logforwarder blocks
  #   true  : new generation (Logging 6.x) configured by this block. The ClusterLogging, its elasticsearch
  #           route, the ClusterLogForwarder of the logforwarder block and its service account are not
  #           deployed anymore (logforwarder.secret and eventrouter stay available)
  enabled: false
  # Activate the ClusterLogForwarder and the UIPlugin as helm hooks
  hooked: false
  # Service account used by the collector to read the logs and to write them into the LokiStack
  serviceAccount:
    # Enable the creation of the service account and of its cluster role bindings
    enabled: true
    # Name of the service account (used by the ClusterLogForwarder)
    name: logging-collector
    # Cluster roles, provided by the logging operator, bound to the service account
    #   collect-application-logs, collect-infrastructure-logs and collect-audit-logs : kind of logs the collector can read
    #   logging-collector-logs-writer : write the logs into a LokiStack
    clusterRoles:
      - collect-application-logs
      - collect-infrastructure-logs
      - logging-collector-logs-writer
      # - collect-audit-logs
  # Log forwarder (ClusterLogForwarder observability.openshift.io/v1), it deploys the collector on every node
  forwarder:
    # Enable the creation of the ClusterLogForwarder
    enabled: true
    # Name of the ClusterLogForwarder
    name: instance
    # Annotations added to the ClusterLogForwarder (ex: observability.openshift.io/log-level: debug)
    annotations: {}
    # Specification of the ClusterLogForwarder, rendered as is (spec.serviceAccount.name is set with
    # serviceAccount.name when it is not defined). The default forwards the application and infrastructure
    # logs to the LokiStack logging-loki. outputs and pipelines are lists, each one is replaced as a whole by
    # your values (the rendering fails when a pipeline references an output, an input or a filter that is not defined)
    spec:
      # managementState: Managed
      outputs:
        - name: lokistack-out
          type: lokiStack
          lokiStack:
            target:
              name: logging-loki
              namespace: openshift-logging
            authentication:
              token:
                from: serviceAccount
          tls:
            ca:
              key: service-ca.crt
              configMapName: openshift-service-ca.crt
      pipelines:
        - name: infra-app-logs
          inputRefs:
            - application
            - infrastructure
            # - audit
          outputRefs:
            - lokistack-out
      # # Resources and placement of the collector pods
      # collector:
      #   resources:
      #     requests:
      #       cpu: "100m"
      #   tolerations:
      #     - effect: NoSchedule
      #       key: node-role.kubernetes.io/infra
      #       operator: Exists
  # Logging view of the OpenShift console (Observe > Logs), UIPlugin of the Cluster Observability Operator
  uiplugin:
    # Enable the creation of the UIPlugin
    enabled: true
    # Specification of the UIPlugin, rendered as is (the name is always logging and spec.type is always Logging)
    spec:
      logging:
        # LokiStack displayed in the console (the plugin looks for it in the openshift-logging namespace)
        lokiStack:
          name: logging-loki
        # Maximum number of entries returned by a query
        logsLimit: 50
        # Maximum duration of a query
        timeout: 30s
        # Schema used to query the logs (viaq, otel or select to let the user choose in the console)
        schema: otel
      # # Placement of the console plugin pods
      # deployment:
      #   nodeSelector:
      #     node-role.kubernetes.io/infra: ''
      #   tolerations:
      #     - effect: NoSchedule
      #       key: node-role.kubernetes.io/infra
      #       operator: Exists

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    type: namespace
    name: "logging-operator"
    display_name: Operator LOGGING
    description: LOGGING operators configured by startx
  rbac: 
    enabled: false
    groups: 
    - id: devops-view
      name: devops
      role: view
    - id: ops-admin
      name: ops
      role: admin
  networkpolicy: 
    enabled: false
  limits: 
    enabled: false
  quotas: 
    enabled: false

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operator:
  enabled: false
  context: 
    <<: *context
  subscription:
    enabled: true
    name: "cluster-logging"
    namespace: "openshift-logging"
    version: "6.5.1"
    operator: 
      channel: "stable-6.5"
      name: cluster-logging
      installPlanApproval: Manual
      # csv: cluster-logging
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: true
  operatorGroup:
    enabled: true
    hooked: false
    name: "openshift-logging"
    namespace: "openshift-logging"
    providedAPIs: "ClusterLogForwarder.v1.logging.openshift.io,ClusterLogging.v1.logging.openshift.io,LogFileMetricExporter.v1alpha1.logging.openshift.io"


# Configuration of the elasticSearch operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operatorElastic:
  enabled: false
  context: 
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "elasticsearch-operator"
    namespace: "openshift-operators-redhat"
    version: "5.8.14"
    operator: 
      channel: "stable"
      name: elasticsearch-operator
      installPlanApproval: Manual
      # csv: elasticsearch-operator
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: true
  operatorGroup:
    enabled: false
    hooked: false
    target: "all-ns"
    name: "openshift-operators-redhat"
    namespace: "openshift-operators-redhat"
    providedAPIs: "Elasticsearch.v1.logging.openshift.io,Kibana.v1.logging.openshift.io,LogFileMetricExporter.v1alpha1.logging.openshift.io"

# Configuration of the loki operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operatorLoki:
  enabled: false
  context: 
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "loki-operator"
    namespace: "openshift-operators-redhat"
    version: "6.5.1"
    operator: 
      channel: "stable-6.5"
      name: loki-operator
      installPlanApproval: Manual
      # csv: loki-operator
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: true
  operatorGroup:
    enabled: false
    hooked: false
    target: "all-ns"
    name: "openshift-operators-redhat"
    namespace: "openshift-operators-redhat"
    providedAPIs: "AlertingRule.v1.loki.grafana.com,LokiStack.v1.loki.grafana.com,RecordingRule.v1.loki.grafana.com,RulerConfig.v1.loki.grafana.com"

# Configuration of the Cluster Observability Operator required by observability.uiplugin (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
# Enable it only when this operator is not already deployed in the cluster
operatorObservability:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "cluster-observability-operator"
    namespace: "openshift-cluster-observability-operator"
    version: "v1.5.5"
    operator:
      channel: "stable"
      name: cluster-observability-operator
      installPlanApproval: Manual
      # csv: cluster-observability-operator
      source:
        name: redhat-operators
        namespace: openshift-marketplace
      config:
        infra: true
  operatorGroup:
    enabled: true
    hooked: false
    target: "all-ns"
    name: "openshift-cluster-observability-operator"
    namespace: "openshift-cluster-observability-operator"
    providedAPIs: "AlertmanagerConfig.v1alpha1.monitoring.rhobs,MonitoringStack.v1alpha1.monitoring.rhobs,PodMonitor.v1.monitoring.rhobs,PrometheusRule.v1.monitoring.rhobs,ScrapeConfig.v1alpha1.monitoring.rhobs,ServiceMonitor.v1.monitoring.rhobs,ThanosQuerier.v1alpha1.monitoring.rhobs,UIPlugin.v1alpha1.observability.openshift.io"

# Namespace hosting the Cluster Observability Operator (the operator watches every namespace)
operatorObservabilityNamespace:
  # Enable the creation of the operator namespace, labelled openshift.io/cluster-monitoring. Keep it disabled
  # when the namespace already exists or is managed by another chart
  enabled: false
  # Name of the operator namespace (must match operatorObservability.subscription.namespace)
  name: openshift-cluster-observability-operator
