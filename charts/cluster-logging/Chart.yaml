apiVersion: v2
# Name of this Helm chart
name: cluster-logging
# Description of this Helm chart
description: Helm chart used to configure Logging (cluster-logging operator) at the cluster level
# Helm chart application
type: application
# Version of this helm chart (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release guidelines)
version: 21.3.361
# Version name of the logging operator (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release history)
appVersion: 6.5.1
# Icon of this helm-chart
icon: https://helm-repository.readthedocs.io/en/latest/img/cluster-logging.svg
# Kube minimum version
kubeVersion: ">=1.30.0-0"
# Keyword list for this chart
keywords: 
  - kubernetes
  - helm
  - startx
  - cluster-chart
  - cluster
  - infrastructure
  - logging
  - EFK
  - elastic
  - fluend
  - kibana
  - loki
  - vector
  - observability
  - uiplugin
# STARTX helm chart repository homepage
home: https://helm-repository.readthedocs.io/en/latest
# Sources and documentation for this chart
sources:
  - https://helm-repository.readthedocs.io/en/latest/charts/cluster-logging
  - https://github.com/startxfr/helm-repository/tree/master/charts/cluster-logging
# Main maintainer contact for this helm chart
maintainers: 
  - name: "STARTX"
    email: "dev@startx.fr"
    url: "https://www.startx.fr"

dependencies:
  - name: project
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.222"
    alias: project
    condition: project.enabled
  - name: operator
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.222"
    alias: operator
    condition: operator.enabled
  - name: operator
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.222"
    alias: operatorElastic
    condition: operatorElastic.enabled
  - name: operator
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.222"
    alias: operatorLoki
    condition: operatorLoki.enabled
  - name: operator
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.222"
    alias: operatorObservability
    condition: operatorObservability.enabled

annotations:
  # category associated to this package
  category: cluster
  # Artifacthub category associated to this package
  artifacthub.io/category: integration-delivery
  # Artifacthub license
  artifacthub.io/license: "GPL-3.0-or-later"
  # Artifacthub is this release a pre-release
  artifacthub.io/prerelease: "true"
  # Artifacthub is an operator chart
  artifacthub.io/operator: "true"
  # Artifacthub operator capabilities
  artifacthub.io/operatorCapabilities: "Seamless Upgrades"
  # Artifacthub chart recommandations
  startx.io/recommendations: |
    - name: Startx basic chart - Project
      url: https://helm-repository.readthedocs.io/en/latest/charts/project
    - name: Startx basic chart - Operator
      url: https://helm-repository.readthedocs.io/en/latest/charts/operator
  # Artifacthub signing keys
  artifacthub.io/signKey: |
    fingerprint: FAC998719FEFFB2E03E119EE0F36B25015D3A34D
    url: https://helm-repository.readthedocs.io/en/latest/pgp_keys.asc
  # Artifacthub changes logs
  artifacthub.io/changes: |
    - kind: added
      description: "[cluster-logging] Add the Logging 6 generation (ClusterLogForwarder observability.openshift.io/v1, collector service account and logging UIPlugin) selected with observability.enabled"
    - kind: added
      description: "[cluster-logging] Add the optional deployment of the Cluster Observability Operator (operatorObservability)"
  artifacthub.io/containsSecurityUpdates: "false"