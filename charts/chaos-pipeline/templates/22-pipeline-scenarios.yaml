{{- if .Values.pipeline.enabled -}}
{{- $namespace := .Values.project.project.name -}}
{{- $p := .Values.pipeline -}}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: chaos-pipeline-scenarios
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "chaos-pipeline-scenarios"
    {{- include "chaos-pipeline.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-pipeline.annotations" $ | nindent 4 }}
data:
  README: "krkn scenarios of the chaos pipelines, one key per scenario"
  {{- range $group := list ($p.infra | default dict) ($p.application | default dict) }}
  {{- range $name := keys ($group.scenarios | default dict) | sortAlpha }}
  {{- $s := index $group.scenarios $name }}
  {{- if and $s.enabled $s.content (ne ($s.engine | default "core") "hub") }}
  {{ $name }}.yaml: |
    {{- if kindIs "string" $s.content }}
    {{- $s.content | nindent 4 }}
    {{- else }}
    {{- toYaml $s.content | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end -}}
