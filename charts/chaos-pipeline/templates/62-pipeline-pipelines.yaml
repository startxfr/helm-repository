{{- if .Values.pipeline.enabled -}}
{{- $namespace := .Values.project.project.name -}}
{{- $p := .Values.pipeline -}}
{{- $cerberus := $p.cerberus | default dict -}}
{{- $hubRepository := $p.images.hub.repository -}}
{{- $clusterOperators := ($p.postCheck | default dict).clusterOperators | default dict -}}
{{- range $pipelineName, $group := dict "chaos-infra" ($p.infra | default dict) "chaos-application" ($p.application | default dict) }}
{{- if $group.enabled }}
{{- $application := eq $pipelineName "chaos-application" }}
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: {{ $pipelineName }}
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "{{ $pipelineName }}-pipeline"
    {{- include "chaos-pipeline.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-pipeline.annotations" $ | nindent 4 }}
    tekton.dev/displayName: {{ ternary "Application chaos" "Infrastructure chaos" $application | quote }}
spec:
  description: >-
    {{ ternary "Chaos testing of an application stack" "Chaos testing of the cluster infrastructure" $application }}:
    cerberus gate, krkn scenarios run one after the other, final cerberus and ClusterOperator checks.
    Start it with a PipelineRun using the chaos-pipeline service account. Do not run two chaos PipelineRuns at the
    same time: each one would read the failures injected by the other.
  params:
    - name: scenarios
      type: array
      description: >-
        Names of the scenarios to run, among the enabled scenarios of this pipeline
        ({{ include "chaos-pipeline.scenarioNames" $group.scenarios | fromJsonArray | join ", " }}).
        A scenario that is not named is skipped: an empty list runs no scenario
      default: {{ toJson ($group.defaultScenarios | default list) }}
    - name: recovery-time
      type: string
      description: Time given to a target to recover, value of the ${RECOVERY_TIME} placeholder of the scenarios (in seconds)
      default: {{ $group.recoveryTime | default 120 | quote }}
    - name: node-selector
      type: string
      description: Label selector of the nodes targeted by the node level scenarios, value of the ${NODE_SELECTOR} placeholder
      default: {{ $p.nodeSelector | default "node-role.kubernetes.io/worker=" | quote }}
    - name: workload-namespace
      type: string
      description: Namespace of the krkn helper pods of the node level scenarios, value of the ${WORKLOAD_NAMESPACE} placeholder
      default: {{ $p.workloadNamespace | default "default" | quote }}
    - name: cerberus-enabled
      type: string
      description: Gate the pipeline with the cerberus signal (true or false)
      default: {{ ternary "true" "false" (default false $cerberus.enabled) | quote }}
    - name: cerberus-url
      type: string
      description: URL of the cerberus signal
      default: {{ $cerberus.url | default "" | quote }}
    - name: cerberus-timeout
      type: string
      description: Maximum time to wait for a healthy cerberus signal (in seconds)
      default: {{ $cerberus.timeout | default 300 | quote }}
    - name: health-check-url
      type: string
      description: HTTP endpoint checked by krkn before and after each scenario (empty to disable)
      default: {{ $group.healthCheckUrl | default "" | quote }}
    - name: clusteroperator-check
      type: string
      description: Check at the end of the run that every ClusterOperator is available and not degraded (true or false)
      default: {{ ternary "true" "false" (default false $clusterOperators.enabled) | quote }}
    - name: clusteroperator-ignore
      type: string
      description: Names of the ClusterOperators left out of the final check, separated by commas
      default: {{ $clusterOperators.ignore | default list | join "," | quote }}
    - name: clusteroperator-timeout
      type: string
      description: Maximum time to wait for the ClusterOperators to be healthy (in seconds)
      default: {{ $clusterOperators.timeout | default 600 | quote }}
    {{- if $application }}
    - name: target-namespace
      type: string
      description: Namespace of the application under chaos, value of the ${TARGET_NAMESPACE} placeholder of the scenarios
      default: {{ $group.targetNamespace | default "" | quote }}
    - name: label-selector
      type: string
      description: Label selector of the application pods, value of the ${LABEL_SELECTOR} placeholder of the scenarios
      default: {{ $group.labelSelector | default "" | quote }}
    {{- end }}
  tasks:
    - name: cerberus-gate
      when:
        - input: "$(params.cerberus-enabled)"
          operator: in
          values: ["true"]
      taskRef:
        kind: Task
        name: cerberus-check
      params:
        - name: cerberus-url
          value: "$(params.cerberus-url)"
        - name: timeout
          value: "$(params.cerberus-timeout)"
    {{- include "chaos-pipeline.scenarioTasks" (dict "scenarios" $group.scenarios "first" "cerberus-gate" "application" $application "hubRepository" $hubRepository) | nindent 4 }}
  finally:
    - name: cerberus-final-check
      when:
        - input: "$(params.cerberus-enabled)"
          operator: in
          values: ["true"]
      taskRef:
        kind: Task
        name: cerberus-check
      params:
        - name: cerberus-url
          value: "$(params.cerberus-url)"
        - name: timeout
          value: "$(params.cerberus-timeout)"
    - name: clusteroperator-final-check
      when:
        - input: "$(params.clusteroperator-check)"
          operator: in
          values: ["true"]
      taskRef:
        kind: Task
        name: clusteroperator-check
      params:
        - name: ignore
          value: "$(params.clusteroperator-ignore)"
        - name: timeout
          value: "$(params.clusteroperator-timeout)"
{{- end }}
{{- end }}
{{- end -}}
