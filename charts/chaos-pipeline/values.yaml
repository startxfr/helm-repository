# Default values for chaos-pipeline.

# # Use it to Overwrite the helm-chart name
#nameOverride: chaos-pipeline
# # Use it to Overwrite the helm-chart version
#versionOverride: 0.0.1

# Application chaos context
context:  &context
  # Name of the global scope for this application (organizational tenant)
  scope: companyname
  # Name of the cluster running this application (platform tenant)
  cluster: clustername
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: dev
  # Component name of this application (logical tenant)
  component: chaos
  # Application name (functional tenant, default use Chart name)
  app: pipeline
  # Version name of this application (default use Chart appVersion)
  version: "5.2.15"

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    type: namespace
    name: chaos-pipeline
    display_name: Chaos - Pipeline
    description: Tekton chaos pipelines of the chaos test suite

# Configuration of the Tekton chaos tasks and pipelines (requires OpenShift Pipelines or Tekton Pipelines v1)
pipeline: 
  # Deploy the chaos tasks and pipelines. No PipelineRun is created: nothing runs until you start one
  enabled: false
  # Container images used by the tasks
  images:
    # krkn image, used by the krkn-run task
    krkn:
      # Image repository
      repository: quay.io/krkn-chaos/krkn
      # Image tag, used when no digest is set
      tag: v5.2.15
      # Image digest (takes precedence over the tag)
      digest: sha256:43b3efda660477519594af8b48d16d8225b4e9e28824293f1b9a838a88c8d267
      # Image pull policy
      pullPolicy: IfNotPresent
    # krkn-hub images, used by the krkn-hub-scenario task (one tag per scenario, rolling tags)
    hub:
      # Image repository
      repository: quay.io/krkn-chaos/krkn-hub
      # Image pull policy
      pullPolicy: Always
    # Image with curl, used by the cerberus-check task
    check:
      # Image repository
      repository: registry.access.redhat.com/ubi9/ubi-minimal
      # Image tag, used when no digest is set
      tag: "9.9"
      # Image digest (takes precedence over the tag)
      digest: sha256:08d4c70f1baf6537a0728656cf7942d561e74a35916509d205b6519861266352
      # Image pull policy
      pullPolicy: IfNotPresent
  # Run the krkn steps as privileged (binds the service account to the privileged SCC). Not required by default
  privileged: false
  # Give the chaos-pipeline service account the privileged SCC in privilegedNamespaces (auto, true or false)
  # The node level scenarios (hog, network chaos, time) start privileged helper pods on the target nodes
  # - auto: granted when an enabled scenario needs it
  privilegedWorkloads: auto
  # Namespaces where krkn starts its helper pods (key namespace of the scenarios; time scenarios always use default)
  privilegedNamespaces:
    - default
  # Label selector of the nodes targeted by the node level scenarios (default of the node-selector pipeline parameter,
  # value of the ${NODE_SELECTOR} placeholder of the scenarios). Use a dedicated label to keep some nodes out of the chaos
  nodeSelector: "node-role.kubernetes.io/worker="
  # Namespace where krkn starts the helper pods of the node level scenarios (default of the workload-namespace pipeline
  # parameter, value of the ${WORKLOAD_NAMESPACE} placeholder). Added to privilegedNamespaces. Time scenarios always use default
  workloadNamespace: default
  # Fail a scenario when a critical alert is firing after the chaos. Needs the right to create a token for the
  # prometheus-k8s service account of openshift-monitoring (add it with rbac.extraRules or rbac.clusterAdmin):
  # without it krkn silently skips the check
  checkCriticalAlerts: false
  # HTTP health check run by krkn before and after each scenario, on the health-check-url pipeline parameter
  healthCheck:
    # Check interval (in seconds)
    interval: 2
    # Verify the TLS certificate of the endpoint (set false for a self-signed route)
    verify: true
    # Name of an existing Secret with the optional keys bearer-token and auth ("username,password")
    # Avoid the characters " and \ in these values
    existingSecret: ""
  # Verify the signature of the workload images started by krkn
  imageSignatureVerification: true
  # Resources requests and limits of the krkn steps
  resources: {}
  # Resources requests and limits of the cerberus-check step
  checkResources: {}
  # Access rights of the chaos-pipeline service account, used by the PipelineRuns
  rbac:
    # Bind the service account to cluster-admin instead of the chaos ClusterRole of this chart
    clusterAdmin: false
    # Rules added to the chaos ClusterRole of this chart
    extraRules: []
  # Cloud provider access, used by the node and zone scenarios
  cloud:
    # Name of an existing Secret whose keys are exposed as environment variables (ex: AWS_ACCESS_KEY_ID,
    # AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION). See https://krkn-chaos.dev/docs/scenarios/cloud_setup/
    existingSecret: ""
  # Cerberus go/no-go signal (see https://helm-repository.readthedocs.io/en/latest/charts/chaos-cerberus)
  # These values are the defaults of the pipeline parameters: a PipelineRun can override them
  cerberus:
    # Gate the pipelines with the cerberus signal (before the first scenario, after each one and at the end)
    enabled: true
    # URL of the cerberus signal
    url: http://cerberus.chaos-cerberus.svc.cluster.local:8080
    # Maximum time to wait for a healthy signal (in seconds)
    timeout: 300
  # Checks run at the end of every pipeline run, after the scenarios (finally tasks)
  postCheck:
    # Check that every OpenShift ClusterOperator is available and not degraded. A failed check fails the PipelineRun
    # These values are the defaults of the clusteroperator-* pipeline parameters: a PipelineRun can override them
    clusterOperators:
      # Run the check at the end of the pipelines
      enabled: false
      # Names of the ClusterOperators left out of the check
      ignore: []
      # Maximum time to wait for the ClusterOperators to be healthy (in seconds)
      timeout: 600
  # Pipeline chaos-infra: chaos testing of the cluster infrastructure
  # Each enabled scenario is one task, run in alphabetical order of its name. A scenario has:
  # - enabled: add this scenario to the pipeline
  # - engine: core (krkn image, default) or hub (krkn-hub image)
  # - type and content: krkn scenario type and definition (core engine)
  # - tag, digest and env: krkn-hub image tag, digest and environment variables (hub engine)
  # - waitDuration: time to wait after the scenario, in seconds (core engine, default 30)
  # - recoveryTime: value of ${RECOVERY_TIME} for this scenario (default, the recovery-time pipeline parameter)
  # - timeout: timeout of the task (default 1h0m0s)
  infra:
    # Deploy the chaos-infra pipeline
    enabled: true
    # Scenarios run when a PipelineRun does not set the scenarios parameter (names of enabled scenarios)
    # Empty by default: such a run executes no scenario. A PipelineRun names the scenarios it wants
    defaultScenarios: []
    # Default HTTP endpoint checked by krkn before and after each scenario (empty to disable)
    healthCheckUrl: ""
    # Default time given to a target to recover, in seconds (pipeline parameter recovery-time)
    recoveryTime: 180
    # Scenarios of the pipeline, ordered by blast radius: 1x platform pods, 2x node pressure, 3x node reboot
    scenarios:
      # Kill one prometheus pod of the cluster monitoring stack
      10-pods-monitoring:
        enabled: true
        type: pod_disruption_scenarios
        content:
          - id: kill-pods
            config:
              namespace_pattern: ^openshift-monitoring$
              label_selector: app.kubernetes.io/name=prometheus
              kill: 1
              krkn_pod_recovery_time: ${RECOVERY_TIME}
      # Kill one router pod of the default ingress controller
      11-pods-ingress:
        enabled: true
        type: pod_disruption_scenarios
        content:
          - id: kill-pods
            config:
              namespace_pattern: ^openshift-ingress$
              label_selector: ingresscontroller.operator.openshift.io/deployment-ingresscontroller=default
              kill: 1
              krkn_pod_recovery_time: ${RECOVERY_TIME}
      # Kill one pod of the openshift API server
      12-pods-apiserver:
        enabled: true
        type: pod_disruption_scenarios
        content:
          - id: kill-pods
            config:
              namespace_pattern: ^openshift-apiserver$
              label_selector: apiserver=true
              kill: 1
              krkn_pod_recovery_time: ${RECOVERY_TIME}
      # CPU pressure on one worker node
      20-hog-cpu-worker:
        enabled: false
        type: hog_scenarios
        content:
          duration: 60
          workers: ''
          hog-type: cpu
          image: quay.io/krkn-chaos/krkn-hub-multiarch:workload-krkn-hog
          namespace: ${WORKLOAD_NAMESPACE}
          cpu-load-percentage: 80
          cpu-method: all
          node-selector: "${NODE_SELECTOR}"
          number-of-nodes: 1
          taints: []
      # Memory pressure on one worker node
      21-hog-memory-worker:
        enabled: false
        type: hog_scenarios
        content:
          duration: 60
          workers: ''
          hog-type: memory
          image: quay.io/krkn-chaos/krkn-hub-multiarch:workload-krkn-hog
          namespace: ${WORKLOAD_NAMESPACE}
          memory-vm-bytes: 80%
          node-selector: "${NODE_SELECTOR}"
          number-of-nodes: 1
          taints: []
      # Network latency and packet loss on one worker node
      22-network-latency-worker:
        enabled: false
        type: network_chaos_ng_scenarios
        content:
          - id: node_network_chaos
            image: quay.io/krkn-chaos/krkn-hub-multiarch:workload-krkn-network-chaos
            wait_duration: 1
            test_duration: 60
            label_selector: "${NODE_SELECTOR}"
            service_account: ""
            taints: []
            namespace: ${WORKLOAD_NAMESPACE}
            instance_count: 1
            target: ""
            execution: serial
            interfaces: []
            ingress: true
            egress: true
            latency: 50ms
            loss: 2
            bandwidth: 1gbit
            force: false
      # Reboot one worker node (set cloud_type to your provider and give its credentials with pipeline.cloud.existingSecret)
      30-node-reboot-worker:
        enabled: false
        type: node_scenarios
        timeout: 2h0m0s
        content:
          node_scenarios:
            - actions:
                - node_reboot_scenario
              node_name:
              label_selector: node-role.kubernetes.io/worker
              instance_count: 1
              runs: 1
              timeout: 600
              cloud_type: aws
              kube_check: true
  # Pipeline chaos-application: chaos testing of an application stack
  # Same scenario format as infra. In a scenario content, ${TARGET_NAMESPACE}, ${LABEL_SELECTOR} and ${RECOVERY_TIME}
  # are replaced by the target-namespace, label-selector and recovery-time parameters of the pipeline.
  # A scenario can also name its own target in its content: a run then picks scenarios with the scenarios parameter
  application:
    # Deploy the chaos-application pipeline
    enabled: true
    # Default namespace of the application under chaos (pipeline parameter target-namespace)
    targetNamespace: ""
    # Default label selector of the application pods (pipeline parameter label-selector, empty for every pod)
    labelSelector: ""
    # Scenarios run when a PipelineRun does not set the scenarios parameter (names of enabled scenarios)
    # Empty by default: such a run executes no scenario. A PipelineRun names the scenarios it wants
    defaultScenarios: []
    # Default HTTP endpoint checked by krkn before and after each scenario (empty to disable)
    healthCheckUrl: ""
    # Default time given to a target to recover, in seconds (pipeline parameter recovery-time)
    recoveryTime: 120
    # Scenarios of the pipeline
    scenarios:
      # Kill one pod of the application
      10-pods:
        enabled: true
        type: pod_disruption_scenarios
        content:
          - id: kill-pods
            config:
              namespace_pattern: ^${TARGET_NAMESPACE}$
              label_selector: "${LABEL_SELECTOR}"
              name_pattern: .*
              kill: 1
              krkn_pod_recovery_time: ${RECOVERY_TIME}
      # Kill the main process of one container of the application
      20-container:
        enabled: true
        type: container_scenarios
        content:
          scenarios:
            - name: kill application container
              namespace: ${TARGET_NAMESPACE}
              label_selector: "${LABEL_SELECTOR}"
              container_name: ""
              action: 1
              count: 1
              expected_recovery_time: ${RECOVERY_TIME}
      # Delete objects of the application namespace
      30-service-disruption:
        enabled: false
        type: service_disruption_scenarios
        content:
          scenarios:
            - namespace: "^${TARGET_NAMESPACE}$"
              delete_count: 1
              runs: 1
              sleep: 15
              wait_time: 300
