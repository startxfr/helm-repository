# Start one run of the infrastructure chaos pipeline:
#   oc create -n chaos-pipeline -f pipelinerun-infra.yaml
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: chaos-infra-
spec:
  pipelineRef:
    name: chaos-infra
  taskRunTemplate:
    serviceAccountName: chaos-pipeline
  timeouts:
    pipeline: 3h0m0s
    # Time kept for the final checks (cerberus signal, ClusterOperators), taken from the pipeline timeout:
    # the gate and the scenarios have 2h40m
    finally: 20m0s
  params:
    # Scenarios of this run, here the platform pod scenarios (without this parameter no scenario runs)
    - name: scenarios
      value: ["10-pods-monitoring", "11-pods-ingress", "12-pods-apiserver"]
    - name: cerberus-enabled
      value: "true"
    - name: cerberus-url
      value: http://cerberus.chaos-cerberus.svc.cluster.local:8080
    # Check at the end that every ClusterOperator is available and not degraded (OpenShift)
    - name: clusteroperator-check
      value: "true"
