apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-pipeline-instance
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: chaos-pipeline
    server: https://kubernetes.default.svc
  project: chaos-pipeline
  source:
    chart: chaos-pipeline
    helm:
      values: |
        project:
          enabled: false
        pipeline:
          enabled: true
          cerberus:
            enabled: true
            url: http://cerberus.chaos-cerberus.svc.cluster.local:8080
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  # Syncing only installs the tasks and pipelines: no chaos runs until a PipelineRun is created
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
