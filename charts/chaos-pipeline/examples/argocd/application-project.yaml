apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-pipeline-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  # No finalizer on project wave — avoids deadlock when namespace is slow to terminate
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: chaos-pipeline
  source:
    chart: chaos-pipeline
    helm:
      values: |
        project:
          enabled: true
        pipeline:
          enabled: false
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
