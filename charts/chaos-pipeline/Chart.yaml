apiVersion: v2
# Name of this Helm chart
name: chaos-pipeline
# Description of this Helm chart
description: >-
  Helm chart used to deploy Tekton chaos testing pipelines on Openshift or Kubernetes cluster. 
  The pipelines run krkn (kraken) scenarios against the cluster infrastructure or an application, 
  gated by the cerberus health signal. This chart is part of the startx chaos helm chart suite.
# Helm chart application
type: application
# Version of this helm chart (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release guidelines)
version: 21.3.398
# Version name of this application (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release history)
appVersion: "5.2.15"
# Icon of this helm-chart
icon: https://helm-repository.readthedocs.io/en/latest/img/chaos-pipeline.svg
# Kube minimum version
kubeVersion: ">=1.30.0-0"
# Keyword list for this chart
keywords: 
  - kubernetes
  - openshift
  - helm
  - startx
  - chaos testing
  - test
  - tekton
  - pipeline
  - krkn
  - kraken
  - cerberus
# STARTX helm chart repository homepage
home: https://helm-repository.readthedocs.io/en/latest
# Sources and documentation for this chart
sources:
  - https://helm-repository.readthedocs.io/en/latest/charts/chaos-pipeline
  - https://github.com/startxfr/helm-repository/tree/master/charts/chaos-pipeline
  - https://github.com/krkn-chaos/krkn
  - https://github.com/krkn-chaos/krkn-hub
# Main maintainer contact for this helm chart
maintainers: 
  - name: "STARTX"
    email: "dev@startx.fr"
    url: "https://www.startx.fr"

dependencies:
  - name: project
    repository: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/21
    version: "21.3.398"
    alias: project
    condition: project.enabled

annotations:
  # category associated to this package
  category: chaos
  # Artifacthub category associated to this package
  artifacthub.io/category: integration-delivery
  # Artifacthub license
  artifacthub.io/license: "GPL-3.0-or-later"
  # Artifacthub is this release a pre-release
  artifacthub.io/prerelease: "true"
  # Artifacthub is an operator chart
  artifacthub.io/operator: "false"
  # Artifacthub chart recommendations
  startx.io/recommendations: |
    - name: Startx basic chart - Project
      url: https://helm-repository.readthedocs.io/en/latest/charts/project
    - name: Startx chaos chart - Cerberus
      url: https://helm-repository.readthedocs.io/en/latest/charts/chaos-cerberus
    - name: Startx cluster chart - Pipeline
      url: https://helm-repository.readthedocs.io/en/latest/charts/cluster-pipeline
  # Artifacthub signing keys
  artifacthub.io/signKey: |
    fingerprint: FAC998719FEFFB2E03E119EE0F36B25015D3A34D
    url: https://helm-repository.readthedocs.io/en/latest/pgp_keys.asc
  # Artifacthub changes logs
  artifacthub.io/changes: |
    - kind: changed
      description: "The scenarios pipeline parameter is empty by default: a PipelineRun that does not name scenarios runs none (was every enabled scenario); defaultScenarios restores a default list"
    - kind: added
      description: "Optional final check of the OpenShift ClusterOperators (task clusteroperator-check, pipeline.postCheck.clusterOperators, off by default)"
  # Artifacthub images used by this chart
  artifacthub.io/images: |
    - name: krkn
      image: quay.io/krkn-chaos/krkn@sha256:43b3efda660477519594af8b48d16d8225b4e9e28824293f1b9a838a88c8d267
    - name: ubi-minimal
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:08d4c70f1baf6537a0728656cf7942d561e74a35916509d205b6519861266352
  artifacthub.io/containsSecurityUpdates: "false"