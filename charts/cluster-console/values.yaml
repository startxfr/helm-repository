# Default values for cluster-console.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organizational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-console
  # Version name of this application (default use Chart appVersion)
  version: "4.21.19"

# configuration of the console service
console:
  # Enable the configuration of the console service
  enabled: false
  # namespace were to deploy the console artifacts
  namespace: openshift-config
  # The state of the openshift cluster console operator
  state: Managed
  # configuration of the console templates
  customize:
    # Name of the console
    name: Example Console
    # Configure the login template
    logo: 
      # Name of the logo configMap
      name: default-logo
      # the logo file format (default is svg)
      format: svg 
      # name of the logo template file (in webtpl)
      tplFile: webtpl/default-logo.svg 
      # The template mode (could be file or embed. default is file)
      mode: file
      # name of the template file (in webtpl)
      tplContent: |-
        <?xml><svg></svg>
      # Create sub-resource custom-logo in ns openshift-console
      manageSubresource: true
    # Logos per theme (OpenShift 4.19+): masthead logo for the light and dark themes and favicon. Replaces the
    # single logo above (customLogoFile, deprecated) which is not rendered when logos.enabled is true.
    # Each logo is a file of the chart (file), an inline SVG text (content) or an inline base64 image (base64)
    logos:
      # Enable the per-theme logos
      enabled: false
      # Name of the ConfigMap (namespace openshift-config) holding every logo file
      configMap: console-logos
      # Masthead logo (top bar and About dialog), one entry per theme
      masthead:
        # Logo displayed with the light theme
        light:
          # File of the chart: svg, png, jpg, gif or webp (the ConfigMap key is the file name)
          file: webtpl/default-logo.svg
          # Inline SVG content (takes precedence over file, the ConfigMap key is then <type>-<theme>.svg)
          content: ""
          # Inline base64 content of a binary image (takes precedence over file, the ConfigMap key is then <type>-<theme>.png)
          base64: ""
          # ConfigMap key of this logo, with its extension (empty: the file name, <type>-<theme>.svg for content or <type>-<theme>.png for base64)
          key: ""
        # Logo displayed with the dark theme
        dark:
          file: webtpl/default-logo.svg
          content: ""
          base64: ""
          key: ""
      # Favicon (browser tab icon), one entry per theme. Empty entries keep the OpenShift favicon
      favicon:
        # Favicon displayed with the light theme
        light:
          file: ""
          content: ""
          base64: ""
          key: ""
        # Favicon displayed with the dark theme
        dark:
          file: ""
          content: ""
          base64: ""
          key: ""
    # Console capabilities (OpenShift 4.19+), each set to Enabled or Disabled: LightspeedButton,
    # GettingStartedBanner (home page banner), GuidedTour (tour shown at the first login)
    capabilities: {}
    # Base URL of the documentation links of the console (empty keeps the OpenShift documentation)
    documentationBaseURL: ""
    # Additional customization settings added as-is to spec.customization: perspectives, developerCatalog,
    # projectAccess, quickStarts, addPage... (keys managed by this chart must not be repeated)
    extraCustomization: {}
  # Console plugins to enable (spec.plugins). Caution: this list replaces the plugins enabled by hand or by
  # other operators (OpenShift Virtualization, NMState, GitOps...). Empty leaves the list untouched
  plugins: []
  # configuration of the console links
  links:
    # name of the console link
  - name: startx-website-ns-dashboard
    # spec of the console link
    spec: |
      href: 'https://www.startx.fr'
      location: NamespaceDashboard
      text: STARTX website
  # configuration of the console links
  logLinks:
    # name of the console link
  - name: startx-externallog
    # spec of the console link
    spec: |
      hrefTemplate: >-
        https://example.com/logs?resourceName=${resourceName}&containerName=${containerName}&resourceNamespace=${resourceNamespace}&podLabels=${podLabels}
      text: Show in STARTX central logs
  # configuration of the console links
  notifications:
    # name of the console link
  - name: example-notification-top
    # spec of the console link
    spec: |
      backgroundColor: 'green'
      color: '#fff'
      location: BannerTop 
      text: Top banner example deployed with helm chart startx/cluster-console


# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
webTerminal:
  enabled: false
  context: 
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "web-terminal"
    namespace: "openshift-operators"
    version: "v1.13.0"
    operator: 
      channel: fast
      name: web-terminal
      installPlanApproval: Manual
      csv: web-terminal
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: false
  operatorGroup:
    enabled: false
    hooked: false
    name: "global-operators"
    namespace: "openshift-operators"
    providedAPIs: ""