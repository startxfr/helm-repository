# Default values for cluster-istio.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organizational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-istio
  # Version name of this application (default use Chart appVersion)
  version: "2.6.17"

# configuration of the istio service
istio:
  # Enable the deployment of the istio service
  enabled: false
  # Activate the manager as a helm hook
  hooked: false
  # Place the istio controlePlane onto infra node
  infra_enabled: false
  # Enable the deployment of the istio ServiceMeshControlPlane
  enabledControlPlane: true
  # Name of the istio service
  name: default
  # # version of the istio serviceMeshMember (default is v2.1)
  # version: "v2.2"
  # deploy a list of report resources
  members:
    # Enable the deployment of MemberRoll
    enabled: false
    # lst of various members roll
    list: 
      # Name of the member namespace
    - namespace: default
      # Name of the control plane to register
      controlePlane: default
      # Namespace where the control plane is deployed
      controlePlaneNS: default-istio

# Sail operator resources (Service Mesh 3, sailoperator.io). Alternative to the istio ServiceMeshControlPlane (maistra.io)
sail:
  # Enable the deployment of the Sail resources
  enabled: false
  # IstioCNI resources (cluster scoped, applied before the Istio resources)
  istioCNI:
    # Enable the IstioCNI resources
    enabled: false
    # List of IstioCNI resources
    list:
      # Name of the IstioCNI (the Sail operator expects default)
    - name: default
      # # API version (default is sailoperator.io/v1)
      # apiVersion: sailoperator.io/v1
      # # Istio version (override spec.version)
      # version: v1.24.3
      # # Namespace where the CNI is installed (override spec.namespace)
      # namespace: istio-cni
      # # Additional labels and annotations (maps, annotations override the default sync-wave 20)
      # labels: {}
      # annotations: {}
      # Free spec of the IstioCNI (YAML string)
      spec: |
        namespace: istio-cni
  # Istio resources (cluster scoped control planes)
  istio:
    # Enable the Istio resources
    enabled: false
    # List of Istio resources
    list:
      # Name of the Istio control plane
    - name: default
      # # API version (default is sailoperator.io/v1)
      # apiVersion: sailoperator.io/v1
      # # Istio version (override spec.version)
      # version: v1.24.3
      # # Namespace of the control plane (override spec.namespace)
      # namespace: istio-system
      # # Additional labels and annotations (maps, annotations override the default sync-wave 25)
      # labels: {}
      # annotations: {}
      # Free spec of the Istio (YAML string)
      spec: |
        namespace: istio-system
        updateStrategy:
          type: InPlace
  # Telemetry resources (telemetry.istio.io)
  telemetry:
    # Enable the Telemetry resources
    enabled: false
    # List of Telemetry resources
    list:
      # Name of the Telemetry
    - name: default
      # # Namespace of the Telemetry (default is the project name)
      # namespace: istio-system
      # # Additional labels and annotations (maps, annotations override the default sync-wave 30)
      # labels: {}
      # annotations: {}
      # Free spec of the Telemetry (YAML string)
      spec: |
        tracing:
          - providers:
              - name: jaeger
            randomSamplingPercentage: 10

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    type: namespace
    name: "default-istio"
    display_name: ISTIO Example
    description: ISTIO System running tracing, monitoring, management and routing tools example from startx
  rbac: 
    enabled: false
  networkpolicy: 
    enabled: false
  limits: 
    enabled: false
  quotas: 
    enabled: false

# Configuration of the projectOperator (see https://helm-repository.readthedocs.io/en/latest/charts/project)
projectOperator: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    type: namespace
    name: "istio-operators"
    display_name: Operator ISTIO
    description: ISTIO operators configured by startx
  rbac: 
    enabled: false
  networkpolicy: 
    enabled: false
  limits: 
    enabled: false
  quotas: 
    enabled: false
  serviceAccounts:
    enabled: false
  dockercfg:
    enabled: false

# Configuration of the elasticSearch operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operatorElastic:
  enabled: false
  context: 
    <<: *context
    version: "5.8.19"
  subscription:
    enabled: true
    name: "elasticsearch-operator"
    namespace: "openshift-operators-redhat"
    version: "5.8.19"
    operator: 
      channel: "stable"
      name: elasticsearch-operator
      installPlanApproval: Manual
      # csv: elasticsearch-operator
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: true
  operatorGroup:
    enabled: false

# Configuration of the loki operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operatorLoki:
  enabled: false
  context: 
    <<: *context
    version: "6.4.2"
  subscription:
    enabled: true
    hooked: false
    name: "loki-operator"
    namespace: "openshift-operators-redhat"
    version: "6.4.2"
    operator: 
      channel: "stable-6.4"
      name: loki-operator
      installPlanApproval: Manual
      # csv: loki-operator
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: true
  operatorGroup:
    enabled: false
    hooked: false
    target: "all-ns"
    name: "openshift-operators-redhat"
    namespace: "openshift-operators-redhat"
    providedAPIs: "AlertingRule.v1.loki.grafana.com,LokiStack.v1.loki.grafana.com,RecordingRule.v1.loki.grafana.com,RulerConfig.v1.loki.grafana.com"

# Configuration of the kiali operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operatorKiali:
  enabled: false
  context: 
    <<: *context
    version: "2.22.5"
  subscription:
    enabled: true
    name: "kiali-ossm"
    namespace: "openshift-operators"
    version: "v2.22.5"
    operator: 
      channel: "stable"
      name: kiali-ossm
      installPlanApproval: Manual
      # csv: kiali-operator
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: true
  operatorGroup:
    enabled: false

# Configuration of the jaeger operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operatorJaeger:
  enabled: false
  context: 
    <<: *context
    version: "1.65.0"
  subscription:
    enabled: true
    name: "jaeger-product"
    namespace: "openshift-distributed-tracing"
    version: "v1.65.0-1"
    operator: 
      channel: "stable"
      name: jaeger-product
      installPlanApproval: Manual
      csv: jaeger-operator
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: true
  operatorGroup:
    enabled: false

# Configuration of the istio operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operatorIstio:
  enabled: false
  context: 
    <<: *context
    version: "2.6.17"
  subscription: 
    enabled: true
    name: "servicemeshoperator"
    namespace: "istio-operators"
    version: "v2.6.17-0"
    operator: 
      channel: "stable"
      name: servicemeshoperator
      installPlanApproval: Manual
      # csv: servicemeshoperator
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: true
  operatorGroup:
    enabled: true
    name: "istio-operators"
    namespace: "istio-operators"
    providedAPIs: "ServiceMeshControlPlane.v2.maistra.io,ServiceMeshMember.v2.maistra.io,ServiceMeshMemberRoll.v2.maistra.io"

# Configuration of the Sail operator, Service Mesh 3 (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
# Installs the operator that serves the sail values (sailoperator.io Istio and IstioCNI). AllNamespaces install mode in
# the global openshift-operators namespace, so no OperatorGroup is created. Check the package and channel of your
# cluster with: oc get packagemanifest servicemeshoperator3 -n openshift-marketplace
operatorSail:
  enabled: false
  context: 
    <<: *context
    version: "3.1.0"
  subscription:
    enabled: true
    hooked: false
    name: "servicemeshoperator3"
    namespace: "openshift-operators"
    version: "v3.1.0"
    operator: 
      channel: "stable"
      name: servicemeshoperator3
      installPlanApproval: Manual
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: false
  operatorGroup:
    enabled: false
