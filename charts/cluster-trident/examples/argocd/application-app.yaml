apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-trident-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-trident
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-trident
    targetRevision: 21.3.278
    helm:
      valueFiles:
        - values-startx.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: false
        orchestrator:
          enabled: true
        backends:
          enabled: true
        storageClasses:
          enabled: true
        volumeSnapshotClasses:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: trident
  ignoreDifferences:
    - group: trident.netapp.io
      kind: TridentOrchestrator
      jsonPointers:
        - /metadata/finalizers
    - group: trident.netapp.io
      kind: TridentBackendConfig
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
