apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-trident-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cluster-trident
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-trident
    targetRevision: 21.3.278
    helm:
      valueFiles:
        - values-startx.yaml
      values: |
        project:
          enabled: true
        operator:
          enabled: false
        orchestrator:
          enabled: false
        backends:
          enabled: false
        storageClasses:
          enabled: false
        volumeSnapshotClasses:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: trident
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      name: default
      jsonPointers:
        - /imagePullSecrets
        - /secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
