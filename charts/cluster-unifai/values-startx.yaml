# STARTX values for cluster-unifai : namespace unifai workloads under "startx-unifai"

context: &context
  scope: startx
  cluster: default
  environment: infra
  component: unifai
  app: startx-unifai
  version: "1.16.0"

project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "startx-unifai"
    display_name: UnifAI
    description: UnifAI multi-agent AI platform configured by STARTX
    additionalLabels:
      openshift.io/cluster-monitoring: "true"
