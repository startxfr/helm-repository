{{- if .Values.unifai.enabled -}}
{{- if .Values.unifai.rag.enabled -}}
{{- $namespace := include "cluster-unifai.namespace" . -}}
{{- $appName := include "cluster-unifai.appName" . -}}
{{- $name := printf "%s-rag" $appName -}}
{{- $comp := .Values.unifai.rag -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "cluster-unifai.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
  annotations:
    {{- include "cluster-unifai.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: {{ $comp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "cluster-unifai.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- if $comp.pullSecret }}
      imagePullSecrets:
        - name: {{ $comp.pullSecret }}
      {{- end }}
      containers:
        - name: rag
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag }}"
          imagePullPolicy: {{ $comp.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: ROLE
              value: "flask"
          ports:
            - name: http
              containerPort: {{ $comp.port }}
          envFrom:
            - configMapRef:
                name: "{{ $appName }}-shared-config"
            - secretRef:
                name: "{{ $appName }}-shared-secret"
          resources:
            {{- toYaml ($comp.resources | default dict) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "cluster-unifai.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
  annotations:
    {{- include "cluster-unifai.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $comp.port }}
      targetPort: http
{{- if $comp.celery.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $name }}-celery-worker"
  namespace: {{ $namespace }}
  labels:
    {{- include "cluster-unifai.labels" . | nindent 4 }}
    app.kubernetes.io/name: "{{ $name }}-celery-worker"
  annotations:
    {{- include "cluster-unifai.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: {{ $comp.celery.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ $name }}-celery-worker"
  template:
    metadata:
      labels:
        {{- include "cluster-unifai.labels" . | nindent 8 }}
        app.kubernetes.io/name: "{{ $name }}-celery-worker"
    spec:
      {{- if $comp.pullSecret }}
      imagePullSecrets:
        - name: {{ $comp.pullSecret }}
      {{- end }}
      containers:
        - name: celery-worker
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag }}"
          imagePullPolicy: {{ $comp.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: ROLE
              value: "celery"
            - name: CELERY_QUEUES
              value: {{ $comp.celery.worker.queues | quote }}
          envFrom:
            - configMapRef:
                name: "{{ $appName }}-shared-config"
            - secretRef:
                name: "{{ $appName }}-shared-secret"
          resources:
            {{- toYaml ($comp.celery.worker.resources | default dict) | nindent 12 }}
{{- end }}
{{- if $comp.celery.beat.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $name }}-celery-beat"
  namespace: {{ $namespace }}
  labels:
    {{- include "cluster-unifai.labels" . | nindent 4 }}
    app.kubernetes.io/name: "{{ $name }}-celery-beat"
  annotations:
    {{- include "cluster-unifai.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ $name }}-celery-beat"
  template:
    metadata:
      labels:
        {{- include "cluster-unifai.labels" . | nindent 8 }}
        app.kubernetes.io/name: "{{ $name }}-celery-beat"
    spec:
      {{- if $comp.pullSecret }}
      imagePullSecrets:
        - name: {{ $comp.pullSecret }}
      {{- end }}
      containers:
        - name: celery-beat
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag }}"
          imagePullPolicy: {{ $comp.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: ROLE
              value: "celery-beat"
          envFrom:
            - configMapRef:
                name: "{{ $appName }}-shared-config"
            - secretRef:
                name: "{{ $appName }}-shared-secret"
          resources:
            {{- toYaml ($comp.celery.beat.resources | default dict) | nindent 12 }}
{{- end }}
{{- end }}
{{- end -}}
