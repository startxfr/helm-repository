{{- if .Values.unifai.enabled -}}
{{- if .Values.unifai.multiagent.enabled -}}
{{- $namespace := include "cluster-unifai.namespace" . -}}
{{- $appName := include "cluster-unifai.appName" . -}}
{{- $name := printf "%s-multiagent" $appName -}}
{{- $comp := .Values.unifai.multiagent -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "cluster-unifai.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
  annotations:
    {{- include "cluster-unifai.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: {{ $comp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "cluster-unifai.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- if $comp.pullSecret }}
      imagePullSecrets:
        - name: {{ $comp.pullSecret }}
      {{- end }}
      containers:
        - name: multiagent
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag }}"
          imagePullPolicy: {{ $comp.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ $comp.port }}
          envFrom:
            - configMapRef:
                name: "{{ $appName }}-shared-config"
            - secretRef:
                name: "{{ $appName }}-shared-secret"
          resources:
            {{- toYaml ($comp.resources | default dict) | nindent 12 }}
          {{- if .Values.unifai.blueprints }}
          volumeMounts:
            {{- range .Values.unifai.blueprints }}
            - name: "blueprint-{{ .name }}"
              mountPath: "/app/multi-agent/lib/mas/blueprints/{{ .name }}.yaml"
              subPath: "{{ .name }}.yaml"
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if .Values.unifai.blueprints }}
      volumes:
        {{- range .Values.unifai.blueprints }}
        - name: "blueprint-{{ .name }}"
          configMap:
            name: "{{ $appName }}-blueprint-{{ .name }}"
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "cluster-unifai.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
  annotations:
    {{- include "cluster-unifai.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $comp.port }}
      targetPort: http
{{- if $comp.route.enabled }}
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "cluster-unifai.labels" . | nindent 4 }}
  annotations:
    {{- include "cluster-unifai.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "50"
spec:
  {{- if $comp.route.hostname }}
  host: {{ $comp.route.hostname }}
  {{- end }}
  to:
    kind: Service
    name: {{ $name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
{{- if $comp.temporalWorker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $name }}-temporal-worker"
  namespace: {{ $namespace }}
  labels:
    {{- include "cluster-unifai.labels" . | nindent 4 }}
    app.kubernetes.io/name: "{{ $name }}-temporal-worker"
  annotations:
    {{- include "cluster-unifai.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: {{ $comp.temporalWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ $name }}-temporal-worker"
  template:
    metadata:
      labels:
        {{- include "cluster-unifai.labels" . | nindent 8 }}
        app.kubernetes.io/name: "{{ $name }}-temporal-worker"
    spec:
      {{- if $comp.pullSecret }}
      imagePullSecrets:
        - name: {{ $comp.pullSecret }}
      {{- end }}
      containers:
        - name: temporal-worker
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag }}"
          imagePullPolicy: {{ $comp.image.pullPolicy | default "IfNotPresent" }}
          command: ["python", "-m", "lib.mas.temporal_worker"]
          envFrom:
            - configMapRef:
                name: "{{ $appName }}-shared-config"
            - secretRef:
                name: "{{ $appName }}-shared-secret"
          resources:
            {{- toYaml ($comp.temporalWorker.resources | default dict) | nindent 12 }}
{{- end }}
{{- end }}
{{- end -}}
