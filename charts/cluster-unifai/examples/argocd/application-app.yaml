apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-unifai-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: startx-unifai
    server: https://kubernetes.default.svc
  project: cluster-unifai
  source:
    chart: cluster-unifai
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        # All component aliases default to enabled: true already (except
        # multiagent_temporal_worker and temporal, opt-in only) - nothing to set here
        # unless you want to disable a specific component for this deployment.
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    targetRevision: 21.3.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
