# Default values for cluster-3scale.

# Application deployment context
context: &context
  # Name of the global scope for this application (organisational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-3scale
  # Version name of this application (default use Chart appVersion)
  version: "0.13.3"

# Deploy an API manager
manager:
  # Enable the configuration of the API manager
  enabled: true
  # Activate the manager as a helm hook
  hooked: false
  # StorageClass for system fileStorage PVC (must be a RWX / CephFS class)
  fileStorageClass: "startx-odf-cephfs"

# External components for 3scale APIManager (required for threescale-2.16+)
# Enable this when deploying clusterRedis and/or clusterCrunchy dependencies
externalComponents:
  # Master switch — sets spec.externalComponents in APIManager and creates connection secrets
  enabled: false
  redis:
    # Set true to use an external Redis (backend-redis + system-redis secrets)
    enabled: false
    # FQDN of the Redis leader service
    host: "default-redis-leader.default.svc.cluster.local"
    port: "6379"
    password: ""
    # Redis DB indexes (0=backend-storage, 1=system, 2=backend-queues)
    backendStorageDb: "0"
    systemDb: "1"
    backendQueuesDb: "2"
  database:
    # Set true to use an external PostgreSQL for system-database secret
    enabled: false
    host: "default-db-primary.default.svc.cluster.local"
    port: "5432"
    name: "3scale"
    user: "3scale"
    password: "changeme"
  zync:
    # PostgreSQL for zync secret (defaults to same host as database if not overridden)
    host: ""
    port: "5432"
    name: "zync"
    user: "zync"
    password: "changeme"
    secretKeyBase: "changeme_zync_secret_key_base_min_30_chars"

# Optional: deploy a Redis cluster as a sub-dependency (Opstree operator required)
clusterRedis:
  enabled: false
  context:
    scope: myscope
    cluster: default
    environment: myenv
    component: redis
    app: default-redis
    version: "0.15.1"
  project:
    enabled: false
  operator:
    enabled: false
  cluster:
    enabled: false
    list: []

# Optional: deploy a CrunchyDB PostgreSQL cluster as a sub-dependency
clusterCrunchy:
  enabled: false
  context:
    scope: myscope
    cluster: default
    environment: myenv
    component: crunchy
    app: default-crunchy
    version: "5.8.7"
  project:
    enabled: false
    project:
      name: "startx-crunchy"
  operator:
    enabled: false
  cluster:
    enabled: false
    list: []


# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    type: namespace
    name: startx-3scale
    display_name: 3SCALE API Manager
    description: 3Scale enterprise api-management & control plane example from STARTX
  rbac: 
    enabled: false
  networkpolicy: 
    enabled: false
  limits: 
    enabled: false
  quotas: 
    enabled: false
  serviceAccounts:
    enabled: false
    list: 
      - name: default
        imagePullSecrets: 
          - name: registrycreds-rhn
  dockercfg:
    enabled: false
    list: 
      - name: registrycreds-rhn
        registry: registry.redhat.io
        username: myuser
        password: mypass
        email: "my@example.com"

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operator:
  enabled: false
  context: 
    <<: *context
  subscription:
    enabled: true
    name: "3scale-operator"
    namespace: "openshift-operators"
    version: "v0.13.3"
    operator: 
      channel: threescale-2.16
      name: 3scale-operator
      installPlanApproval: Automatic
      # csv: 3scale-operator
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: false
  operatorGroup:
    enabled: false
    target: "all-ns"
    name: "startx-3scale"
    namespace: "openshift-operators"
    providedAPIs: "APIManager.v1alpha1.apps.3scale.net,APIManagerBackup.v1alpha1.apps.3scale.net,APIManagerRestore.v1alpha1.apps.3scale.net,ActiveDoc.v1beta1.capabilities.3scale.net,Backend.v1beta1.capabilities.3scale.net,CustomPolicyDefinition.v1beta1.capabilities.3scale.net,DeveloperAccount.v1beta1.capabilities.3scale.net,DeveloperUser.v1beta1.capabilities.3scale.net,OpenAPI.v1beta1.capabilities.3scale.net,Product.v1beta1.capabilities.3scale.net,ProxyConfigPromote.v1beta1.capabilities.3scale.net"
