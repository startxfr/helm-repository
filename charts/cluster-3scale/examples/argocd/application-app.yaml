# Wave 10 — apps: Redis cluster + PostgreSQL cluster + 3scale APIManager + secrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-3scale-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-3scale
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-3scale
    targetRevision: 21.3.199
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: false
        manager:
          enabled: true
        externalComponents:
          enabled: true
          redis:
            enabled: true
          database:
            enabled: true
        clusterRedis:
          enabled: true
          project:
            enabled: false
          operator:
            enabled: false
          cluster:
            enabled: true
        clusterCrunchy:
          enabled: true
          project:
            enabled: false
          operator:
            enabled: false
          cluster:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: startx-3scale
  ignoreDifferences:
    - group: apps.3scale.net
      kind: APIManager
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
