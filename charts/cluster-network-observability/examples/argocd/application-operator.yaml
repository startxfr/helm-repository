apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-network-observability-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: openshift-netobserv-operator
    server: https://kubernetes.default.svc
  project: cluster-network-observability
  source:
    chart: cluster-network-observability
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: true
        flowcollector:
          enabled: false
        flowMetrics:
          enabled: false
        lokiRbac:
          enabled: false
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
