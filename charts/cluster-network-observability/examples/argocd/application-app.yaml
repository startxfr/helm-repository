apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-network-observability-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: netobserv
    server: https://kubernetes.default.svc
  project: cluster-network-observability
  source:
    chart: cluster-network-observability
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: false
        flowcollector:
          enabled: true
        flowMetrics:
          enabled: false
        lokiRbac:
          enabled: false
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    targetRevision: 21.3.321
  ignoreDifferences:
    - group: flows.netobserv.io
      kind: FlowCollector
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
