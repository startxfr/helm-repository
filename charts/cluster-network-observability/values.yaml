# Default values for cluster-network-observability.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organizational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-netobserv
  # Version name of this application (default use Chart appVersion)
  version: "2.0.0"

# Deploy the FlowCollector CR driving the Network Observability operator (eBPF agents, flow processor, console plugin)
flowcollector:
  # Enable the creation of the FlowCollector CR (cluster-scoped, a single FlowCollector is allowed per cluster)
  enabled: false
  # Activate the resource as a helm hook
  hooked: false
  # Name of the FlowCollector (must be "cluster" for the operator to reconcile it)
  name: cluster
  # Namespace where the operator deploys the netobserv components (flow processor, console plugin). The operator creates
  # it when it does not exist and runs the eBPF agents in the <namespace>-privileged namespace. Immutable once created
  namespace: netobserv
  # Flow processing deployment model. Service (operator default) runs the processor behind a Service backed by a scalable
  # Deployment, Direct pairs a processor DaemonSet with the agents through the host network (small clusters below 15 nodes
  # only), Kafka sends the flows to a Kafka topic consumed by the processor (large clusters, see the kafka block)
  deploymentModel: Service
  # Place the flow processor and the console plugin on the infra nodes (nodeSelector and tolerations). The eBPF agents
  # are never constrained (the DaemonSet must run on every node and tolerates every taint by default) and the processor
  # is not constrained either when deploymentModel is Direct (it then runs as a DaemonSet paired with the agents)
  infra_enabled: false
  # Network policies protecting the netobserv namespaces (spec.networkPolicy)
  networkPolicy:
    # Deploy the network policies isolating the netobserv components (enabled by default by the operator on OVN-Kubernetes)
    enabled: true
    # Additional namespaces allowed to connect to the netobserv namespace (raw list of namespace names)
    additionalNamespaces: []
  # Configuration of the eBPF agents (spec.agent.ebpf)
  agent:
    # Sampling interval of the eBPF probe (50 means one packet out of 50 is sampled, 1 means every packet is sampled)
    sampling: 50
    # Run the eBPF agent pods as privileged. Required by the PacketDrop, NetworkEvents and UDNMapping features and to
    # capture SR-IOV secondary interfaces, otherwise the agent only gets the BPF, PERFMON and NET_ADMIN capabilities
    privileged: false
    # Additional eBPF features to enable among PacketDrop (privileged), DNSTracking, FlowRTT, NetworkEvents (privileged,
    # OVN-Kubernetes observability), PacketTranslation, EbpfManager (requires the eBPF Manager operator), UDNMapping
    # (privileged), IPSec and TLSTracking. Every feature increases the CPU, memory and storage footprint
    features: []
    # features: [DNSTracking, FlowRTT, PacketDrop]
    # Compute resources of the eBPF agent container (raw map, empty keeps the operator default of 800Mi memory limit)
    resources: {}
    # limits:
    #   memory: 1600Mi
    # requests:
    #   cpu: 100m
    #   memory: 50Mi
  # Configuration of the flow processor flowlogs-pipeline (spec.processor)
  processor:
    # Record types to generate: Flows (regular flows), Conversations, EndedConversations or All
    logTypes: Flows
    # Number of processor replicas in the Service and Kafka deployment models (0 keeps the operator default of 3,
    # ignored in the Direct deployment model)
    consumerReplicas: 0
    # Prometheus metrics generated by the processor (spec.processor.metrics)
    metrics:
      # Metrics to generate, named without the netobserv_ prefix (raw list, empty keeps the operator default list)
      includeList: []
      # includeList: [namespace_flows_total, node_ingress_bytes_total, node_egress_bytes_total, workload_ingress_bytes_total, workload_egress_bytes_total]
    # Compute resources of the processor container (raw map, empty keeps the operator default of 800Mi memory limit)
    resources: {}
    # limits:
    #   memory: 800Mi
    # requests:
    #   cpu: 100m
    #   memory: 100Mi
  # Storage of the raw flows in Loki (spec.loki)
  loki:
    # Store the flows in Loki. When disabled only the Prometheus metrics are kept and the console plugin loses the raw
    # flows table and the per-pod details
    enabled: false
    # Loki installation mode: LokiStack (Loki operator), Monolithic, Microservices or Manual (see extraSpec for their URLs)
    mode: LokiStack
    # Reference of the LokiStack CR used by the LokiStack mode. Deploy it with the cluster-loki chart using
    # tenants.mode openshift-network (a LokiStack must not be shared with the OpenShift Logging stack)
    lokiStack:
      # Name of the LokiStack CR
      name: loki
      # Namespace of the LokiStack CR (default is the flowcollector namespace, see lokiRbac when it differs)
      namespace: netobserv
    # Additional spec.loki fields appended as is (raw map): monolithic, microservices or manual URLs, timeouts, batch sizes
    extraSpec: {}
    # readTimeout: 30s
    # writeTimeout: 10s
    # writeBatchWait: 1s
  # OpenShift console plugin (spec.consolePlugin)
  consolePlugin:
    # Deploy the Network Traffic console plugin (requires Loki or the Prometheus metrics)
    enabled: true
    # Quick filter presets displayed in the console plugin (raw list of name, filter and default, empty keeps the operator defaults)
    quickFilters: []
    # - name: Applications
    #   default: true
    #   filter:
    #     flow_layer: '"app"'
    # - name: Infrastructure
    #   filter:
    #     flow_layer: '"infra"'
  # Kafka connection used when deploymentModel is Kafka (raw map rendered as spec.kafka: address, topic, tls, sasl).
  # The Kafka cluster and the topic must exist (deploy them with the cluster-kafka chart)
  kafka: {}
  # address: kafka-cluster-kafka-bootstrap.netobserv:9093
  # topic: network-flows
  # tls:
  #   enable: true
  #   caCert:
  #     type: secret
  #     name: kafka-cluster-cluster-ca-cert
  #     certFile: ca.crt
  # Exporters receiving a copy of the enriched flows (raw list rendered as spec.exporters: Kafka, IPFIX or OpenTelemetry)
  exporters: []
  # - type: Kafka
  #   kafka:
  #     address: kafka-cluster-kafka-bootstrap.netobserv:9092
  #     topic: netobserv-flows-export
  # - type: OpenTelemetry
  #   openTelemetry:
  #     targetHost: otel-collector.openshift-opentelemetry.svc
  #     targetPort: 4317
  #     protocol: grpc
  #     logs:
  #       enable: true
  # Additional FlowCollector spec fields appended as is at the end of the spec (raw map). Never repeat a field managed by
  # the values above (namespace, deploymentModel, networkPolicy, agent, processor, loki, consolePlugin, kafka, exporters)
  extraSpec: {}
  # prometheus:
  #   querier:
  #     mode: Manual
  #     manual:
  #       url: http://prometheus.netobserv.svc:9090

# Deploy FlowMetric CRs generating custom Prometheus metrics from the flow fields
flowMetrics:
  # Enable the creation of the FlowMetric CRs
  enabled: false
  # Activate the resources as helm hooks
  hooked: false
  # List of the FlowMetric CRs to create (they must live in the flowcollector namespace to be picked up by the processor)
  list: []
  #   # Name of the FlowMetric
  # - name: cluster-external-ingress-traffic
  #   # Namespace of the FlowMetric (default is the flowcollector namespace)
  #   namespace: netobserv
  #   # Raw spec of the FlowMetric (metricName is prefixed with netobserv_ in Prometheus, labels drive the cardinality)
  #   spec: |
  #     metricName: cluster_external_ingress_bytes_total
  #     type: Counter
  #     valueField: Bytes
  #     direction: Ingress
  #     labels: [DstK8S_HostName, DstK8S_Namespace, DstK8S_OwnerName, DstK8S_OwnerType]
  #     filters:
  #       - field: SrcSubnetLabel
  #         matchType: Absence

# RoleBindings letting the operator read the LokiStack certificates when the LokiStack lives in another namespace than the
# flowcollector namespace (secret-watcher in the LokiStack namespace, secret-creator in the flowcollector namespace). Not
# needed when both share the same namespace. The flowcollector namespace must exist (the operator creates it once the
# FlowCollector is reconciled, so with Helm enable this block on a second upgrade)
lokiRbac:
  # Enable the creation of the RoleBindings
  enabled: false
  # Namespace hosting the Network Observability operator (operator.subscription.namespace)
  operatorNamespace: openshift-netobserv-operator
  # Service account of the operator controller manager
  serviceAccount: netobserv-controller-manager

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "openshift-netobserv-operator"
    display_name: Operator Network Observability
    description: Network Observability operator configured by STARTX

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "netobserv-operator"
    namespace: "openshift-netobserv-operator"
    version: "2.0.0"
    operator:
      channel: "stable"
      name: netobserv-operator
      installPlanApproval: Manual
      # csv: network-observability-operator
      source:
        name: redhat-operators
        namespace: openshift-marketplace
      config:
        infra: false
  operatorGroup:
    enabled: true
    hooked: false
    target: "all-ns"
    name: "openshift-netobserv-operator"
    namespace: "openshift-netobserv-operator"
    providedAPIs: "FlowCollector.v1beta2.flows.netobserv.io,FlowMetric.v1alpha1.flows.netobserv.io"
