# Instance. Delete it, and wait for it to be gone, before deleting the -project Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-monkey-instance
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: chaos-monkey
    server: https://kubernetes.default.svc
  project: chaos-monkey
  source:
    chart: chaos-monkey
    helm:
      values: |
        project:
          enabled: false
        monkey:
          enabled: true
          config:
            # log the kills without doing them ; set to false once the schedule is validated
            dryRun: true
            timeZone: Europe/Paris
            startHour: 9
            endHour: 17
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
