# Namespace of the chart. No finalizer : a namespace can be slow to terminate. Delete it last.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-monkey-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: chaos-monkey
  source:
    chart: chaos-monkey
    helm:
      values: |
        project:
          enabled: true
        monkey:
          enabled: false
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
