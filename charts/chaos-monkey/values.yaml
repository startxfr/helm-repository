# Default values for chaos-monkey.

# # Use it to Overwrite the helm-chart name
#nameOverride: chaos-monkey
# # Use it to Overwrite the helm-chart version
#versionOverride: 0.0.1

# Application chaos context
context:  &context
# Name of the global scope for this application (organizational tenant)
 scope: companyname
# Name of the cluster running this application (platform tenant)
 cluster: clustername
# Name of the environment for this application (ex: dev, factory, preprod or prod)
 environment: dev
# Component name of this application (logical tenant)
 component: chaos
# Application name (functional tenant, default use Chart name)
 app: kube-monkey
# Version name of this application (default use Chart appVersion)
 version: "1.5.2"

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    type: namespace
    name: chaos-monkey
    display_name: Chaos - Monkey
    description: Kubernetes chaos monkey in STARTX Chaos test suite

# Configuration of the kubemonkey deployment (see https://github.com/asobti/kube-monkey)
monkey:
  enabled: false
  # Grant a privileged SecurityContextConstraints (privileged-monkey) to the kube-monkey service account.
  # Not needed by kube-monkey: keep it false unless the pod cannot start with the restricted one.
  privileged: false
  nameOverride: monkey
  fullnameOverride: example-monkey
  replicaCount: 1
  rbac:
    enabled: true
  image:
    repository: ayushsobti/kube-monkey
    tag: v0.5.2
    pullPolicy: IfNotPresent
  config:
    dryRun: false
    runHour: 8
    startHour: 10
    endHour: 16
    blacklistedNamespaces: [ "kube-system", "openshift-*" ]
    whitelistedNamespaces: [ "default", "demo-*", "example-*" ]
    timeZone: Europe/Paris
  args:
    logLevel: 5
    logDir: /var/log/kube-monkey
  # Writable volume for the log directory (the container runs with an arbitrary user)
  additionalVolumes:
    - name: log
      emptyDir: {}
  additionalVolumeMounts:
    - name: log
      mountPath: /var/log/kube-monkey
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
