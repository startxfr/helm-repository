{{- /* privileged SCC for kube-monkey: only on request (monkey.privileged) ; the rights kube-monkey needs come from the ClusterRole of the upstream chart */ -}}
{{- if and .Values.monkey.enabled .Values.monkey.privileged -}}
{{- $appName := include "startx.appName" . -}}
{{- $namespace := .Values.project.project.name -}}
{{- /* service account of the kube-monkey chart: serviceAccount.name, else its fullname (same rule as the upstream kubemonkey.fullname helper) */ -}}
{{- $name := .Values.monkey.nameOverride | default "monkey" -}}
{{- $fullname := .Values.monkey.fullnameOverride | default (ternary .Release.Name (printf "%s-%s" .Release.Name $name) (contains $name .Release.Name)) | trunc 63 | trimSuffix "-" -}}
{{- $sa := (.Values.monkey.serviceAccount).name | default $fullname -}}
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints 
metadata:
  name: privileged-monkey
  labels:
    app.kubernetes.io/name: "privileged-monkey-scc"
    {{- include "chaos-monkey.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-monkey.annotations" $ | nindent 4 }}
    kubernetes.io/description: 'allows privileged access to host'
    release.openshift.io/create-only: "true"
users:
- system:serviceaccount:{{- $namespace -}}:{{ $sa }}
allowHostPorts: true
priority: null
requiredDropCapabilities: null
allowPrivilegedContainer: true
runAsUser:
  type: RunAsAny
allowHostDirVolumePlugin: true
seccompProfiles:
  - '*'
allowHostIPC: true
seLinuxContext:
  type: RunAsAny
readOnlyRootFilesystem: false
fsGroup:
  type: RunAsAny
defaultAddCapabilities: null
allowedUnsafeSysctls:
  - '*'
supplementalGroups:
  type: RunAsAny
volumes:
  - '*'
allowHostPID: true
allowHostNetwork: true
allowPrivilegeEscalation: true
allowedCapabilities:
  - '*'
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: privileged-monkey-scc-role
  namespace: {{ $namespace | default "default" | quote }}
  labels:
    app.kubernetes.io/name: "privileged-monkey-scc-role"
    {{- include "chaos-monkey.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-monkey.annotations" $ | nindent 4 }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged-monkey"]
    verbs: ["use"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: privileged-monkey-scc-rb
  namespace: {{ $namespace | default "default" | quote }}
  labels:
    app.kubernetes.io/name: "privileged-monkey-scc-rb"
    {{- include "chaos-monkey.labels" $ | nindent 4 }}
  annotations:
    {{- include "chaos-monkey.annotations" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
roleRef:
  kind: Role
  name: privileged-monkey-scc-role
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
