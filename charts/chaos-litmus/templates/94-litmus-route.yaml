{{- if .Values.litmus.enabled -}}{{- if .Values.litmus.expose -}}
{{- $appName := include "startx.appName" . -}}
{{- $namespace := .Values.project.project.name -}}
{{- /* fullname of the upstream litmus chart (same rule as its litmus-portal.fullname helper) */ -}}
{{- $name := .Values.litmus.nameOverride | default "litmus" -}}
{{- $fullname := .Values.litmus.fullnameOverride | default (ternary .Release.Name (printf "%s-%s" .Release.Name $name) (contains $name .Release.Name)) | trunc 63 | trimSuffix "-" -}}
apiVersion: "route.openshift.io/v1"
kind: Route
metadata:
  name: "frontend"
  namespace: "{{- $namespace -}}"
  labels:
    app.kubernetes.io/name: "ui-route"
    {{- include "chaos-litmus.labels" . | nindent 4 }}
    app: "frontend-litmus"
  annotations:
    {{- include "chaos-litmus.annotations" . | nindent 4 }}
    haproxy.router.openshift.io/balance: roundrobin
    haproxy.router.openshift.io/disable_cookies: "true"
    template.openshift.io/expose-uri: "http://{.spec.host}{.spec.path}"
    argocd.argoproj.io/sync-wave: "40"
spec:
  to:
    kind: Service
    name: {{ $fullname }}-frontend-service
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
{{- end -}}{{- end -}}
