apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-vault-config-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-vault-config
  source:
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    chart: cluster-vault-config
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: true
          operatorGroup:
            enabled: false
          subscription:
            namespace: "openshift-operators"
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
