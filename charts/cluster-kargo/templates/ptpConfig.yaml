{{- if .Values.kargo.enabled -}}
{{- $namespace := .Values.project.project.name | default "openshift-kargo" -}}
{{- $spec := .Values.kargo.spec | default "{}" -}}
apiVersion: kargo.openshift.io/v1
kind: kargoConfig
metadata:
  name: {{ .Values.kargo.name | default "quote" | quote }}
  namespace: "{{- $namespace -}}"
  labels:
    {{- include "cluster-kargo.labels" . | nindent 4 }}
    app.kubernetes.io/name: "{{- .Values.kargo.name | default "quote" -}}-kargoconfig"
  annotations:
    {{- include "cluster-kargo.annotations" . | nindent 4 }}
    {{- if .Values.kargo.hooked }}
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: hook-failed
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
    {{- end }}
    argocd.argoproj.io/sync-wave: "10"
spec:
  {{- $spec | nindent 2 }}
{{- end -}}