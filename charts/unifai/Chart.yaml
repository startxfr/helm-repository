apiVersion: v2
# Name of this Helm chart
name: unifai
# Description of this Helm chart
description: Deploy the UnifAI multi-agent AI platform on OpenShift or Kubernetes, by installing the UnifAI operator and a UnifaiStack resource
# Helm chart application
type: application
# Version of this helm chart
version: 21.3.418
# Version of the UnifAI release deployed by this chart (operator and application images)
appVersion: "0.1.78"
# Icon of this helm-chart
icon: https://helm-repository.readthedocs.io/en/latest/img/unifai.svg
# Kube minimum version
kubeVersion: ">=1.30.0-0"
# Keyword list for this chart
keywords:
  - kubernetes
  - helm
  - startx
  - basic-chart
  - unifai
  - ai
  - multi-agent
  - rag
  - operator
# Documentation homepage of this chart
home: https://helm-repository.readthedocs.io/en/latest/charts/unifai
# Sources and documentation for this chart
sources:
  - https://github.com/startxfr/UnifAI
  - https://github.com/redhat-community-ai-tools/UnifAI
  - https://github.com/startxfr/helm-repository/tree/master/charts/unifai
# Main maintainer contact for this helm chart
maintainers:
  - name: "STARTX"
    email: "dev@startx.fr"
    url: "https://www.startx.fr"

dependencies:
  - name: project
    repository: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/21
    version: "21.3.416"
    alias: project
    condition: project.enabled

annotations:
  # category associated to this package
  category: basic
  # Artifacthub category associated to this package
  artifacthub.io/category: ai-machine-learning
  # Artifacthub license
  artifacthub.io/license: "GPL-3.0-or-later"
  # Artifacthub is this release a pre-release
  artifacthub.io/prerelease: "true"
  # Artifacthub is an operator chart
  artifacthub.io/operator: "true"
  # Artifacthub signing keys
  artifacthub.io/signKey: |
    fingerprint: FAC998719FEFFB2E03E119EE0F36B25015D3A34D
    url: https://helm-repository.readthedocs.io/en/latest/pgp_keys.asc
  # Artifacthub changes logs (could be added, changed, deprecated, removed, fixed and security)
  artifacthub.io/changes: |
    - kind: changed
      description: "UnifAI v0.1.77 -> v0.1.78 (images pinned by digest), no CRD, RBAC or default change"
  # Is this release contain security updates
  artifacthub.io/containsSecurityUpdates: "false"
  # Images deployed by this chart
  artifacthub.io/images: |
    - name: unifai-operator
      image: quay.io/zuno/unifai-operator@sha256:f85a83bb59bf6838e11fbb3cdd6b74e7c103130601b12445f58efb06795eb396
  # Custom resource definitions installed by this chart
  artifacthub.io/crds: |
    - kind: UnifaiStack
      version: v1alpha1
      name: unifaistacks.unifai.startx.fr
      displayName: UnifAI stack
      description: A complete UnifAI platform deployed in one namespace
