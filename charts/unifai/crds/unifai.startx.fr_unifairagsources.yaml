---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: unifairagsources.unifai.startx.fr
spec:
  group: unifai.startx.fr
  names:
    categories:
    - unifai
    kind: UnifaiRAGSource
    listKind: UnifaiRAGSourceList
    plural: unifairagsources
    shortNames:
    - uragsrc
    singular: unifairagsource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.pages
      name: Pages
      type: integer
    - jsonPath: .status.ingestedClassification
      name: Classification
      priority: 1
      type: string
    - jsonPath: .status.lastSyncTime
      name: LastSync
      type: date
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UnifaiRAGSource keeps a RAG source (e.g. a Confluence space)
          ingested and incrementally re-synced.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              UnifaiRAGSourceSpec is a RAG source kept in sync on a schedule. Credentials are stack-wide
              (UnifaiStack.spec.rag.confluence).
            properties:
              aclGroups:
                description: OIDC groups allowed to retrieve a shared source.
                items:
                  type: string
                type: array
              classification:
                description: |-
                  Classification (C1 to C4) of the content the source brings in. The RAG service writes it on every chunk and returns
                  it in the search results, so a consumer can raise the data level of a turn. Unset = chunks carry none (a consumer
                  that fails closed treats them as C2). Changing it embeds every page again at the next sync.
                enum:
                - C1
                - C2
                - C3
                - C4
                type: string
              confluence:
                description: 'RAGConfluenceSource scopes a Confluence source: one
                  space, optionally narrowed to the subtree under a root page.'
                properties:
                  baseUrl:
                    description: Site URL, e.g. https://example.atlassian.net (Cloud)
                      or https://confluence.example.com (Data Center).
                    pattern: ^https?://
                    type: string
                  excludeLabels:
                    description: Pages carrying one of these labels are skipped.
                    items:
                      type: string
                    type: array
                  rootTitle:
                    description: Title of the root page whose subtree is ingested
                      (the page included); empty = the whole space.
                    type: string
                  spaceKey:
                    type: string
                required:
                - baseUrl
                - spaceKey
                type: object
              git:
                description: |-
                  RAGGitSource scopes a git source: the AsciiDoc, Markdown and text files of a public GitHub repository at a ref, read
                  without credentials from the repository archive. AsciiDoc include:: of files of the same repository are resolved, so an
                  assembly reads as one document. A sync whose ref still points at the commit of the last one downloads nothing.
                properties:
                  attributeFiles:
                    description: |-
                      Repository files whose attribute definitions apply to every document (the common attributes a documentation set
                      pulls in, e.g. _attributes/common-attributes.adoc).
                    items:
                      type: string
                    maxItems: 10
                    type: array
                  attributes:
                    additionalProperties:
                      type: string
                    description: |-
                      AsciiDoc attributes given by the source, like attributes passed to Asciidoctor: they win over the document's own and
                      choose the product when one repository serves several (openshift-enterprise, product-title, product-version). A
                      name ending in ! locks the attribute as unset (upstream!). ifdef/ifndef blocks are evaluated against them.
                    maxProperties: 50
                    type: object
                  exclude:
                    items:
                      type: string
                    type: array
                  include:
                    description: Shell-style patterns a document path must match (empty
                      = all) and must not match.
                    items:
                      type: string
                    type: array
                  maxFiles:
                    default: 2000
                    description: Limit on documents read.
                    maximum: 10000
                    minimum: 1
                    type: integer
                  metadata:
                    additionalProperties:
                      type: string
                    description: Fields stamped on every chunk of the source (e.g.
                      product, version, language).
                    type: object
                  paths:
                    description: |-
                      Directories whose files are documents (empty = the whole repository). The files they include from elsewhere in
                      the repository are still read.
                    items:
                      type: string
                    maxItems: 100
                    type: array
                  ref:
                    default: main
                    description: Branch, tag or commit to read.
                    pattern: ^[A-Za-z0-9._/-]{1,200}$
                    type: string
                  url:
                    description: Public repository, https://github.com/<owner>/<repo>.
                    type: string
                    x-kubernetes-validations:
                    - message: a git source is a public https://github.com/<owner>/<repo>
                        repository
                      rule: self.matches('^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/?$')
                required:
                - url
                type: object
              owner:
                default: admin
                description: UnifAI user owning the object (workspace identity).
                type: string
              resyncToken:
                description: |-
                  Any change of this value queues a sync now (e.g. after an index migration, where a source re-ingests every
                  page at its next sync). Unset = no effect.
                maxLength: 64
                type: string
              suspend:
                description: Stop scheduled syncs.
                type: boolean
              syncInterval:
                description: Time between incremental syncs (minimum 10m). Unset =
                  sync only when the spec changes.
                type: string
                x-kubernetes-validations:
                - message: syncInterval is at least 10m
                  rule: duration(self) >= duration('10m')
              tags:
                description: |-
                  Tags put on the source, so a search can be scoped to a domain (query tags=<tag>) instead of "every
                  source the caller can see". Changing them registers the source again (no page is re-embedded).
                items:
                  type: string
                type: array
              teamId:
                description: Team workspace to use instead of the user's personal
                  one.
                type: string
              teamRef:
                description: |-
                  UnifaiTeam (same namespace) whose team workspace to use; the object waits until the team is Ready.
                  Exclusive with teamId.
                type: string
              type:
                enum:
                - confluence
                - web
                - git
                type: string
              unifaiName:
                description: Name in UnifAI (defaults to metadata.name).
                type: string
              visibility:
                default: private
                description: |-
                  private (owner only), shared (owner + members of aclGroups) or public (every signed-in user; for
                  public documentation). Shared and public need the owner in UnifaiStack.spec.rag.sharedPublishers.
                enum:
                - private
                - shared
                - public
                type: string
              web:
                description: |-
                  RAGWebSource scopes a web source: public pages fetched without credentials, from seed URLs and
                  (optionally) the pages they link to.
                properties:
                  crawl:
                    default: generic
                    description: |-
                      Discovery of linked pages: generic (same host, under the seed's directory), site (same host, any path: narrow
                      it with include) or none (the seeds only). redhat-docs is deprecated and removed in 0.2: it is site with the
                      include patterns */html/* and */html-single/* and the docs.redhat.com /documentation/ to /en/documentation/
                      rewrite, which a source now declares itself.
                    enum:
                    - generic
                    - site
                    - none
                    - redhat-docs
                    type: string
                  exclude:
                    items:
                      type: string
                    type: array
                  include:
                    description: |-
                      Shell-style patterns a discovered URL must match (empty = all) and must not match. They apply before
                      maxPages, which counts only the pages kept.
                    items:
                      type: string
                    type: array
                  maxPages:
                    default: 50
                    description: Limit on pages discovered per seed.
                    maximum: 1000
                    minimum: 1
                    type: integer
                  metadata:
                    additionalProperties:
                      type: string
                    description: Fields stamped on every chunk of the source (e.g.
                      product, version, language).
                    type: object
                  rewrites:
                    description: |-
                      Rewrites applied in turn to every discovered URL before the scope checks, for a site that serves a page
                      under several URLs: the first match of the regular expression (Python syntax) is replaced; the replacement
                      may refer to its groups (\1).
                    items:
                      description: 'RAGWebRewrite rewrites a discovered URL: the first
                        match of Match is replaced by Replace.'
                      properties:
                        match:
                          maxLength: 500
                          minLength: 1
                          type: string
                        replace:
                          maxLength: 500
                          type: string
                      required:
                      - match
                      type: object
                    maxItems: 20
                    type: array
                  urls:
                    description: |-
                      Seed pages. Each is fetched on every sync (its links are the discovery input); the pages found
                      from it are fetched only when the server says they changed.
                    items:
                      maxLength: 2048
                      type: string
                    maxItems: 500
                    minItems: 1
                    type: array
                    x-kubernetes-validations:
                    - message: web urls are http(s) URLs
                      rule: self.all(u, isURL(u) && (u.startsWith('http://') || u.startsWith('https://'))
                        && size(url(u).getHostname()) > 0)
                required:
                - urls
                type: object
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: confluence settings are required for type confluence
              rule: self.type != 'confluence' || has(self.confluence)
            - message: web settings are required for type web
              rule: self.type != 'web' || has(self.web)
            - message: git settings are required for type git
              rule: self.type != 'git' || has(self.git)
            - message: a shared source needs at least one ACL group
              rule: self.visibility != 'shared' || (has(self.aclGroups) && size(self.aclGroups)
                > 0)
            - message: teamId and teamRef are exclusive
              rule: '!has(self.teamId) || !has(self.teamRef) || size(self.teamId)
                == 0 || size(self.teamRef) == 0'
          status:
            description: UnifaiRAGSourceStatus reports the last sync.
            properties:
              blueprintId:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              hash:
                description: Truncated SHA-256 of the resolved spec last pushed to
                  UnifAI.
                type: string
              ingestedClassification:
                description: |-
                  Classification the RAG service stamped on the chunks of the last run (C1-C4). Empty while no run reported one:
                  a RAG image older than the classification field never reports it, so a set spec.classification with an empty
                  value here means the field is ignored.
                type: string
              lastReconciled:
                format: date-time
                type: string
              lastSyncTime:
                format: date-time
                type: string
              message:
                type: string
              nextSyncTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              pages:
                type: integer
              pagesChanged:
                type: integer
              pagesDeleted:
                type: integer
              phase:
                description: Ready, Error, Pending, Running, Completed, Failed, Submitted,
                  Suspended.
                type: string
              pipelineStatus:
                description: Pipeline status reported by the RAG service (PENDING
                  ... DONE, FAILED).
                type: string
              response:
                description: RAG pipeline dispatch response (truncated JSON).
                type: string
              result:
                description: Chat transcript (truncated JSON).
                type: string
              rid:
                description: Id of the UnifAI library resource.
                type: string
              scheduleId:
                type: string
              sessionId:
                type: string
              sourceId:
                description: Id of the source in the RAG service.
                type: string
              teamId:
                description: Id of the identity team (UnifaiTeam).
                type: string
              templateId:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
