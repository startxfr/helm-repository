{{- include "unifai.validate" . -}}
{{- if .Values.stack.enabled -}}
{{- $spec := deepCopy .Values.stack.spec -}}
{{- /* "external" replaces the default managed Keycloak : the CRD accepts exactly one of the two */ -}}
{{- if $spec.identity.external -}}
{{- $_ := unset $spec.identity "keycloak" -}}
{{- end -}}
{{- $exposure := default dict $spec.exposure -}}
{{- if and .Values.exposure.domain (not $exposure.domain) -}}
{{- $_ := set $exposure "domain" .Values.exposure.domain -}}
{{- end -}}
{{- if $exposure -}}
{{- $_ := set $spec "exposure" $exposure -}}
{{- end -}}
# The operator only accepts one stack per namespace, named "unifai".
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiStack
metadata:
  name: unifai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unifai.labels" . | nindent 4 }}
  annotations:
    {{- include "unifai.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
