{{- if and (eq .Values.exposure.type "ingress") .Values.exposure.ingress.installRouteCRD -}}
# Schema-less stand-in for the OpenShift Route API, as the UnifAI operator tests use on kind :
# the operator always creates Routes and fails without that API. Nothing serves these Routes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.route.openshift.io
  labels:
    {{- include "unifai.labels" . | nindent 4 }}
  annotations:
    {{- include "unifai.annotations" . | nindent 4 }}
spec:
  group: route.openshift.io
  scope: Namespaced
  names:
    kind: Route
    listKind: RouteList
    plural: routes
    singular: route
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
{{- end }}
