# Operator : cluster-wide, installed once
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unifai-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: unifai
  destination:
    server: https://kubernetes.default.svc
    namespace: unifai-operator
  source:
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    chart: unifai
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
    helm:
      values: |
        stack:
          enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
