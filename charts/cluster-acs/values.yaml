# Default values for cluster-acs.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organisational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-acs
  # Version name of this application (default use Chart appVersion)
  version: "4.11.0"

# Default settings of the ExternalSecret objects rendered by this chart when a
# secret is sourced from an external store (acs.securedCluster.registration.mode: externalSecret).
# Requires the External Secrets Operator and a SecretStore/ClusterSecretStore.
externalSecretDefaults:
  # API version of the ExternalSecret CRD (external-secrets.io/v1beta1 for ESO releases without the v1 API)
  apiVersion: external-secrets.io/v1
  # How often the Secret is refreshed from the external store
  refreshInterval: 1h
  # Store to read from (name is required as soon as a secret uses externalSecret)
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore

# configuration of the acs service
acs:
  # Enable the deployment of the acs service
  enabled: true
  # Deploy CS only on infra nodes
  infra: false
  # configuration of the multi-cluster Hub
  central:
    # Enable the deployment of the reporting-operator service
    enabled: true
    # Activate the manager as a helm hook
    hooked: false
    # name of the central deployment
    name: "default"
  # configuration of the scanner service
  scanner:
      # Enable the deployment of the scanner service
      enabled: true
  # configuration of the secured cluster services (Sensor, Admission controller, Collector)
  # that register this cluster in a Central (the one of this chart or a remote one)
  securedCluster:
    # Enable the deployment of the secured cluster services (SecuredCluster CR)
    enabled: false
    # Deploy the SecuredCluster in the ArgoCD PostSync phase (always the case when acs.central.hooked is true).
    # Without ArgoCD the SecuredCluster stays a regular release resource
    hooked: false
    # name of the SecuredCluster resource (must differ from acs.central.name, both share the namespace)
    name: "stackrox-secured-cluster-services"
    # Name of this cluster in ACS (required). Cannot be changed once the cluster is registered
    clusterName: ""
    # Central endpoint as host:port (ex: central-stackrox.apps.hub.example.com:443).
    # Empty: Sensor connects to the Central running in the same namespace (required when acs.central.enabled is false)
    centralEndpoint: ""
    # Labels attached to this cluster in ACS
    clusterLabels: {}
    # Admission controller configuration
    admissionControl:
      # Policy enforcement by the admission controller (Enabled or Disabled)
      enforcement: Enabled
      # Webhook failure policy (Ignore: fail-open, Fail: fail-closed)
      failurePolicy: Ignore
    # Per-node services configuration (Collector)
    perNode:
      # System-level data collection method (CORE_BPF or NoCollection)
      collection: CORE_BPF
      # Run per-node services on tainted nodes too (TolerateTaints or AvoidTaints)
      taintToleration: TolerateTaints
    # Kubernetes audit logs collection (Auto, Enabled or Disabled)
    auditLogs: Auto
    # Local scanner (AutoSense: deployed unless a Central runs in the same namespace, or Disabled)
    scanner: AutoSense
    # Local Scanner V4 (Default, AutoSense or Disabled)
    scannerV4: Default
    # Additional SecuredCluster spec (YAML), merged over the spec generated from the values above
    # ex: |
    #   sensor:
    #     resources:
    #       requests:
    #         cpu: 500m
    spec: ""
    # Registration of this cluster in Central (Cluster Registration Secret, ACS 4.7+)
    registration:
      # job: a Job generates the Cluster Registration Secret (CRS) through the Central API
      # externalSecret: the CRS is read from an external store (External Secrets Operator),
      #   registration.externalSecret.enabled: true is accepted as an alias
      # none: cluster-registration-secret (or init bundle secrets) created outside this chart
      mode: job
      # Configuration of the registration Job (mode job)
      job:
        # Image providing bash, coreutils, sed, grep, curl and oc. With the internal registry enabled,
        # image-registry.openshift-image-registry.svc:5000/openshift/cli:latest follows the cluster release
        image: "registry.redhat.io/openshift4/ose-cli-rhel9:v4.21"
        # Central API endpoint as host:port (default: acs.securedCluster.centralEndpoint,
        # else the central service of the release namespace)
        centralEndpoint: ""
        # Secret holding the Central admin password (operator generated by default)
        adminPasswordSecret:
          name: central-htpasswd
          key: password
        # Maximum number of clusters that can register with the generated CRS.
        # 0 (unlimited): the CRS stays usable to register this cluster again (ex: SecuredCluster re-created).
        # > 0 (ACS 4.11+): Central revokes the CRS once used, re-registering then needs a new CRS
        # (delete cluster-registration-secret and run the Job again)
        maxRegistrations: 0
        # Validity of the generated CRS as a protobuf duration (ex: "86400s"; empty: Central default)
        validFor: ""
        # Maximum time waiting for Central (seconds)
        timeoutSeconds: 1800
        # Delay before the finished Job is deleted (seconds)
        ttlSecondsAfterFinished: 300
      # Configuration of the ExternalSecret producing cluster-registration-secret (mode externalSecret)
      # Accepts secretStoreRef, refreshInterval (defaults: externalSecretDefaults), remoteRefs,
      # data, dataFrom and template. The key `crs` must be provided.
      externalSecret: {}
      #   remoteRefs:
      #     crs:
      #       key: ocp/acs/mycluster
      #       property: crs

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    type: namespace
    name: "startx-acs"
    display_name: Operator ACS
    description: ACS operators configured by startx
  rbac: 
    enabled: true
    groups: 
    - id: devops-view
      name: devops
      role: view
    - id: ops-admin
      name: ops
      role: admin
  networkpolicy: 
    enabled: false
  limits: 
    enabled: false
  quotas: 
    enabled: false

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operator:
  enabled: false
  context: 
    <<: *context
  subscription:
    enabled: true
    name: "rhacs-operator"
    namespace: "openshift-operators"
    version: "v4.11.0"
    operator: 
      channel: "stable"
      name: rhacs-operator
      installPlanApproval: Manual
      # csv: rhacs-operator
      source: 
        name: redhat-operators
        namespace: openshift-marketplace
      config: 
        infra: false
  operatorGroup:
    enabled: false
    target: "all-ns"
    name: "startx-rhacs"
    namespace: "openshift-operators"
    providedAPIs: "Central.v1alpha1.platform.stackrox.io,SecuredCluster.v1alpha1.platform.stackrox.io"
