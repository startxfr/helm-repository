# Default values for configuration of a STARTX cluster
# see values.yaml for explanation on each params
context: &context
  scope: startx
  cluster: default
  environment: infra
  component: loki
  app: startx-loki
  version: "6.5.1"

externalSecretDefaults:
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore

operatorNamespace:
  enabled: false
  name: openshift-operators-redhat

lokistack:
  enabled: false
  hooked: false
  name: logging-loki
  size: 1x.small
  storageClassName: gp3-csi
  managementState: Managed
  infra_enabled: true
  tenants:
    mode: openshift-logging
  storage:
    schemas:
      - version: v13
        effectiveDate: "2024-10-01"
    secret:
      name: logging-loki-s3
      type: s3
      credentialMode: ""
    tls:
      caName: ""
      caKey: ""
  retention:
    days: 7
    streams: []
  limits:
    ingestion: {}
    queries: {}
  replication:
    factor: 0
  rules:
    enabled: false
    selector: {}
    namespaceSelector: {}
  hashRing: {}
  extraSpec: {}

storageSecret:
  enabled: false
  name: ""
  data: {}
  # bucketnames: logging-loki
  # endpoint: https://s3.eu-west-3.amazonaws.com
  # region: eu-west-3
  # access_key_id: myaccesskey
  # access_key_secret: mysecretkey
  externalSecret:
    enabled: false
    secretStoreRef: {}
    refreshInterval: ""
    remoteRefs: {}
    data: []
    dataFrom: []
    template: {}

alertingRules:
  enabled: false
  list: []

recordingRules:
  enabled: false
  list: []

rulerConfig:
  enabled: false
  name: logging-loki-ruler
  spec: |
    evaluationInterval: 1m
    pollInterval: 1m

project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "openshift-logging"
    display_name: "Startx Loki log store"
    requester: startx
    description: Loki log store configured by STARTX

operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "loki-operator"
    namespace: "openshift-operators-redhat"
    version: "6.5.1"
    operator:
      channel: "stable-6.5"
      name: loki-operator
      installPlanApproval: Manual
      # csv: loki-operator
      source:
        name: redhat-operators
        namespace: openshift-marketplace
      config:
        infra: true
        # resources:
        #   limits:
        #     cpu: 400m
        #   requests:
        #     cpu: 400m
  operatorGroup:
    enabled: true
    hooked: false
    target: "all-ns"
    name: "openshift-operators-redhat"
    namespace: "openshift-operators-redhat"
    providedAPIs: "AlertingRule.v1.loki.grafana.com,LokiStack.v1.loki.grafana.com,RecordingRule.v1.loki.grafana.com,RulerConfig.v1.loki.grafana.com"
