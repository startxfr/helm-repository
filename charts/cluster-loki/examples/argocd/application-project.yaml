# Creates the openshift-logging namespace hosting the LokiStack.
# Set operatorNamespace.enabled to true as well when no other chart (cluster-config
# redhat.operators) manages the openshift-operators-redhat namespace of the Loki operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-loki-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: openshift-logging
    server: https://kubernetes.default.svc
  project: cluster-loki
  source:
    chart: cluster-loki
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: true
        operatorNamespace:
          enabled: false
        operator:
          enabled: false
        lokistack:
          enabled: false
        storageSecret:
          enabled: false
        alertingRules:
          enabled: false
        recordingRules:
          enabled: false
        rulerConfig:
          enabled: false
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    targetRevision: 21.3.321
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
