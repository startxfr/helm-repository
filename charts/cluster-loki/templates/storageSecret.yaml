{{- if .Values.storageSecret }}
{{- if .Values.storageSecret.enabled }}
{{- $name := .Values.storageSecret.name | default (dig "storage" "secret" "name" "logging-loki-s3" .Values.lokistack) -}}
{{- $namespace := .Values.project.project.name | default "openshift-logging" -}}
{{- if dig "externalSecret" "enabled" false .Values.storageSecret }}
{{ include "cluster-loki.externalSecret" (dict "root" . "name" $name "namespace" $namespace "config" .Values.storageSecret.externalSecret "defaults" .Values.externalSecretDefaults "wave" "1") }}
{{- else -}}
{{- if not .Values.storageSecret.data -}}
{{- fail (printf "storageSecret %s/%s: set storageSecret.data (object storage keys) or enable storageSecret.externalSecret" $namespace $name) -}}
{{- end }}
# Object storage keys depend on the provider, see https://github.com/openshift/loki/blob/release-6.6/operator/docs/lokistack/object_storage.md
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "cluster-loki.labels" . | nindent 4 }}
    app.kubernetes.io/name: "{{ $name }}-secret"
  annotations:
    {{- include "cluster-loki.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
stringData:
  {{- range $key, $value := .Values.storageSecret.data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
