# Default values for cluster-nmstate.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organisational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-nmstate
  # Version name of this application (default use Chart appVersion)
  version: "4.21.0"

# Deploy and activate the NMState operator instance
nmstate:
  # Enable the creation of the NMState CR (activates the operator daemonset)
  enabled: false
  # Activate the resource as a helm hook
  hooked: false
  # Name of the NMState instance (must be "nmstate" for the operator to reconcile)
  name: nmstate

# Deploy a NodeNetworkConfigurationPolicy to configure node network interfaces
nncp:
  # Enable the deployment of a NodeNetworkConfigurationPolicy
  enabled: false
  # Activate the policy as a helm hook
  hooked: false
  # Name of the NodeNetworkConfigurationPolicy
  name: default-network-policy
  # Node selector to target specific nodes (empty means all nodes)
  nodeSelector: {}
  # Desired network state expressed as NMState YAML
  # See https://nmstate.io for the full interface specification
  desiredState: |
    interfaces: []
    # Example: create a linux-bridge
    # interfaces:
    # - name: br-ex
    #   type: linux-bridge
    #   state: up
    #   ipv4:
    #     enabled: true
    #     dhcp: true
    #   bridge:
    #     options:
    #       stp:
    #         enabled: false
    #     port:
    #     - name: enp1s0


# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "openshift-nmstate"
    display_name: Operator NMState
    description: NMState network operator configured by STARTX

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "kubernetes-nmstate-operator"
    namespace: "openshift-nmstate"
    version: "4.21.0"
    operator:
      channel: "stable"
      name: kubernetes-nmstate-operator
      installPlanApproval: Automatic
      # csv: kubernetes-nmstate-operator
      source:
        name: redhat-operators
        namespace: openshift-marketplace
      config:
        infra: false
  operatorGroup:
    enabled: false
    hooked: false
    name: "openshift-nmstate"
    namespace: "openshift-nmstate"
    providedAPIs: "NMState.v1.nmstate.io"
