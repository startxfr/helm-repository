apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-nmstate-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: openshift-nmstate
    server: https://kubernetes.default.svc
  project: cluster-nmstate
  source:
    chart: cluster-nmstate
    helm:
      valueFiles:
        - values-startx.yaml
      values: |
        nmstate:
          enabled: true
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  ignoreDifferences:
    - group: nmstate.io
      kind: NMState
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
