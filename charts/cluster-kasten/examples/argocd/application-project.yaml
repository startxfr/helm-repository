apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-kasten-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cluster-kasten
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-kasten
    targetRevision: 21.3.278
    helm:
      valueFiles:
        - values-startx.yaml
      values: |
        project:
          enabled: true
        operator:
          enabled: false
        k10:
          enabled: false
        profiles:
          enabled: false
        policies:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kasten-io
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      name: default
      jsonPointers:
        - /imagePullSecrets
        - /secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
