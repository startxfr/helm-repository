apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-kasten-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-kasten
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-kasten
    targetRevision: 21.3.278
    helm:
      valueFiles:
        - values-startx.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: true
        k10:
          enabled: false
        profiles:
          enabled: false
        policies:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kasten-io
  ignoreDifferences:
    - group: operators.coreos.com
      kind: OperatorGroup
      name: kasten-io
      namespace: kasten-io
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
