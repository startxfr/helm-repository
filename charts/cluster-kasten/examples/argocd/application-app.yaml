apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-kasten-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-kasten
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-kasten
    targetRevision: 21.3.278
    helm:
      valueFiles:
        - values-startx.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: false
        k10:
          enabled: true
        profiles:
          enabled: true
        policies:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kasten-io
  ignoreDifferences:
    - group: apik10.kasten.io
      kind: K10
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
