# Default values for configuration of a STARTX cluster
# see values.yaml for explanation on each params
context: &context
  scope: startx
  cluster: default
  environment: infra
  component: backup
  app: kasten
  version: "8.5.8"

k10:
  enabled: true
  hooked: false
  apiVersion: "apik10.kasten.io/v1alpha1"
  name: "k10"
  auth:
    basicAuth:
      enabled: false
      htpasswd: ''
      secretName: ''
    tokenAuth:
      enabled: true
  global:
    persistence:
      catalog:
        size: ''
      storageClass: ''
  metering:
    mode: ''
  route:
    enabled: true
    host: ''
    tls:
      enabled: true

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project:
  enabled: true
  context:
    <<: *context
  project:
    enabled: true
    type: namespace
    name: "kasten-io"
    display_name: "Startx Kasten K10"
    requester: startx
    description: Kasten K10 namespace configured by STARTX
  rbac:
    enabled: false
  networkpolicy:
    enabled: false
  limits:
    enabled: false
  quotas:
    enabled: false

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operator:
  enabled: true
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "k10-kasten-operator-rhmp"
    namespace: "kasten-io"
    version: "v8.5.8"
    operator:
      channel: "stable"
      name: k10-kasten-operator-rhmp
      installPlanApproval: Automatic
      csv: k10-kasten-operator-rhmp
      source:
        name: certified-operators
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    hooked: false
    name: "kasten-io"
    namespace: "kasten-io"
    providedAPIs: "K10.v1alpha1.apik10.kasten.io"
