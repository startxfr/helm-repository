{{- if .Values.enabled }}
{{- if eq .Values.database.mode "cloudnativepg" }}
{{- $ns := include "cluster-quay-ha.dbNamespace" . }}
{{- $v := .Values }}
{{- $db := $v.database }}
{{- $group := include "cluster-quay-ha.cnpgApiGroup" . }}
{{- $lbl := include "cluster-quay-ha.cnpgLabelPrefix" . }}
{{- $backup := include "cluster-quay-ha.dbBackup" . }}
{{- $plugin := and $backup (eq $v.backup.cloudnativepg.method "plugin") }}
{{- $prefix := include "cluster-quay-ha.backupPrefix" . }}
{{- $s3 := $v.backup.s3 }}
{{- if $backup }}
---
# Credentials of the backup bucket (Barman Cloud)
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.quay.name }}-barman-s3
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-barman-s3" $v.quay.name | quote }}
    {{ $lbl }}/reload: "true"
  annotations:
    {{- include "cluster-quay-ha.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  ACCESS_KEY_ID: {{ $s3.accessKey | quote }}
  ACCESS_SECRET_KEY: {{ $s3.secretKey | quote }}
  {{- if $s3.region }}
  REGION: {{ $s3.region | quote }}
  {{- end }}
  {{- if $s3.caCert }}
  ca.crt: |
    {{- $s3.caCert | nindent 4 }}
  {{- end }}
{{- end }}
{{- range $key := list "quay" "clair" }}
{{- $c := index $db $key }}
{{- $restore := index $v.restore $key }}
{{- if or (eq $key "quay") $v.quay.components.clair }}
---
# Owner credentials: used by initdb and kept in sync on the role by managed.roles
apiVersion: v1
kind: Secret
metadata:
  name: {{ $c.name }}-owner
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-owner" $c.name | quote }}
    {{ $lbl }}/reload: "true"
  annotations:
    {{- include "cluster-quay-ha.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: kubernetes.io/basic-auth
stringData:
  username: {{ $c.user | quote }}
  password: {{ $c.password | quote }}
{{- if $plugin }}
---
# Object store of the Barman Cloud Plugin (backups and WAL archive of this cluster)
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $c.name }}-backup
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-backup" $c.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "15"
spec:
  retentionPolicy: {{ printf "%dd" (int $v.backup.retentionDays) | quote }}
  configuration:
    destinationPath: s3://{{ $s3.bucket }}/{{ $prefix }}
    endpointURL: {{ include "cluster-quay-ha.backupEndpointUrl" $ }}
    {{- if $s3.caCert }}
    endpointCA:
      name: {{ $v.quay.name }}-barman-s3
      key: ca.crt
    {{- end }}
    s3Credentials:
      accessKeyId:
        name: {{ $v.quay.name }}-barman-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ $v.quay.name }}-barman-s3
        key: ACCESS_SECRET_KEY
      {{- if $s3.region }}
      region:
        name: {{ $v.quay.name }}-barman-s3
        key: REGION
      {{- end }}
    wal:
      compression: {{ $v.backup.cloudnativepg.compression }}
      maxParallel: 4
    data:
      compression: {{ $v.backup.cloudnativepg.compression }}
      jobs: 2
{{- if $v.restore.enabled }}
---
# Object store of the source cluster for the recovery (serverName set by the plugin parameters of the Cluster)
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $c.name }}-recovery
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-recovery" $c.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "15"
spec:
  configuration:
    destinationPath: s3://{{ $s3.bucket }}/{{ include "cluster-quay-ha.restorePrefix" $ }}
    endpointURL: {{ include "cluster-quay-ha.backupEndpointUrl" $ }}
    {{- if $s3.caCert }}
    endpointCA:
      name: {{ $v.quay.name }}-barman-s3
      key: ca.crt
    {{- end }}
    s3Credentials:
      accessKeyId:
        name: {{ $v.quay.name }}-barman-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ $v.quay.name }}-barman-s3
        key: ACCESS_SECRET_KEY
      {{- if $s3.region }}
      region:
        name: {{ $v.quay.name }}-barman-s3
        key: REGION
      {{- end }}
    wal:
      maxParallel: 4
{{- end }}
{{- end }}
---
apiVersion: {{ $group }}/v1
kind: Cluster
metadata:
  name: {{ $c.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $c.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "20"
spec:
  instances: {{ $db.replicas }}
  {{- $image := $c.cloudnativepg.imageName }}
  {{- if and (not $image) (ne $db.cloudnativepg.flavor "edb") }}
  {{- $image = printf "ghcr.io/cloudnative-pg/postgresql:%d-system-trixie" (int $c.postgresVersion) }}
  {{- end }}
  {{- if $image }}
  imageName: {{ $image }}
  {{- end }}
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  storage:
    size: {{ $c.storage.size }}
    {{- if $c.storage.storageClass }}
    storageClass: {{ $c.storage.storageClass }}
    {{- end }}
  {{- with $c.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  postgresql:
    {{- with $c.parameters }}
    parameters:
      {{- range $pk, $pv := . }}
      {{ $pk }}: {{ $pv | toString | quote }}
      {{- end }}
    {{- end }}
    {{- if and $db.synchronous (gt (int $db.replicas) 1) }}
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
    {{- end }}
  {{- if $db.avoidInfraNodes }}
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: {{ $db.cloudnativepg.topologyKey }}
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/infra
                operator: DoesNotExist
  {{- end }}
  managed:
    roles:
      - name: {{ $c.user }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ $c.name }}-owner
  bootstrap:
    {{- if and $v.restore.enabled $backup }}
    # Recovery from the backups of the source cluster: read at cluster creation only
    recovery:
      source: source
      database: {{ $c.database }}
      owner: {{ $c.user }}
      secret:
        name: {{ $c.name }}-owner
      {{- if $restore.target }}
      recoveryTarget:
        targetTime: {{ $restore.target | quote }}
      {{- end }}
    {{- else }}
    initdb:
      database: {{ $c.database }}
      owner: {{ $c.user }}
      secret:
        name: {{ $c.name }}-owner
      {{- with $c.extensions }}
      postInitApplicationSQL:
        {{- range . }}
        - CREATE EXTENSION IF NOT EXISTS "{{ . }}";
        {{- end }}
      {{- end }}
    {{- end }}
  {{- if and $v.restore.enabled $backup }}
  externalClusters:
    - name: source
      {{- if $plugin }}
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: {{ $c.name }}-recovery
          serverName: {{ $restore.source }}
      {{- else }}
      barmanObjectStore:
        serverName: {{ $restore.source }}
        destinationPath: s3://{{ $s3.bucket }}/{{ include "cluster-quay-ha.restorePrefix" $ }}
        endpointURL: {{ include "cluster-quay-ha.backupEndpointUrl" $ }}
        {{- if $s3.caCert }}
        endpointCA:
          name: {{ $v.quay.name }}-barman-s3
          key: ca.crt
        {{- end }}
        s3Credentials:
          accessKeyId:
            name: {{ $v.quay.name }}-barman-s3
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: {{ $v.quay.name }}-barman-s3
            key: ACCESS_SECRET_KEY
          {{- if $s3.region }}
          region:
            name: {{ $v.quay.name }}-barman-s3
            key: REGION
          {{- end }}
        wal:
          maxParallel: 4
      {{- end }}
  {{- end }}
  {{- if $backup }}
  {{- if $plugin }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $c.name }}-backup
        {{- if $c.cloudnativepg.serverName }}
        serverName: {{ $c.cloudnativepg.serverName }}
        {{- end }}
  {{- else }}
  backup:
    retentionPolicy: {{ printf "%dd" (int $v.backup.retentionDays) | quote }}
    barmanObjectStore:
      serverName: {{ include "cluster-quay-ha.cnpgServerName" (dict "cluster" $c) }}
      destinationPath: s3://{{ $s3.bucket }}/{{ $prefix }}
      endpointURL: {{ include "cluster-quay-ha.backupEndpointUrl" $ }}
      {{- if $s3.caCert }}
      endpointCA:
        name: {{ $v.quay.name }}-barman-s3
        key: ca.crt
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ $v.quay.name }}-barman-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ $v.quay.name }}-barman-s3
          key: ACCESS_SECRET_KEY
        {{- if $s3.region }}
        region:
          name: {{ $v.quay.name }}-barman-s3
          key: REGION
        {{- end }}
      wal:
        compression: {{ $v.backup.cloudnativepg.compression }}
        maxParallel: 4
      data:
        compression: {{ $v.backup.cloudnativepg.compression }}
        jobs: 2
  {{- end }}
  {{- end }}
{{- if $backup }}
---
apiVersion: {{ $group }}/v1
kind: ScheduledBackup
metadata:
  name: {{ $c.name }}-full
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-full" $c.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "25"
spec:
  schedule: {{ include "cluster-quay-ha.cnpgSchedule" $ | quote }}
  backupOwnerReference: self
  immediate: true
  cluster:
    name: {{ $c.name }}
  {{- if $plugin }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  {{- else }}
  method: barmanObjectStore
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
