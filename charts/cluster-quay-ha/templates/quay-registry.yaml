{{- if .Values.enabled }}
{{- include "cluster-quay-ha.validate" . -}}
{{- $ns := include "cluster-quay-ha.namespace" . }}
{{- $v := .Values }}
{{- $q := $v.quay }}
{{- $quayOverrides := dict }}
{{- with $q.overrides.quay }}{{ $quayOverrides = deepCopy . }}{{ end }}
{{- $clairOverrides := dict }}
{{- with $q.overrides.clair }}{{ $clairOverrides = deepCopy . }}{{ end }}
{{- $mirrorOverrides := dict }}
{{- with $q.overrides.mirror }}{{ $mirrorOverrides = deepCopy . }}{{ end }}
{{- if $q.stopped }}
{{- $_ := set $quayOverrides "replicas" 0 }}
{{- $_ := set $clairOverrides "replicas" 0 }}
{{- $_ := set $mirrorOverrides "replicas" 0 }}
{{- end }}
---
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: {{ $q.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-quayregistry" $q.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "30"
spec:
  configBundleSecret: {{ $q.existingConfigBundleSecret | default (printf "%s-config-bundle" $q.name) }}
  components:
    - kind: quay
      managed: true
      {{- with $quayOverrides }}
      overrides:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - kind: postgres
      managed: {{ eq $v.database.mode "quayOperator" }}
    - kind: clair
      managed: {{ $q.components.clair }}
      {{- if and $q.components.clair $clairOverrides }}
      overrides:
        {{- toYaml $clairOverrides | nindent 8 }}
      {{- end }}
    - kind: clairpostgres
      managed: {{ and $q.components.clair (eq $v.database.mode "quayOperator") }}
    - kind: redis
      managed: true
    - kind: horizontalpodautoscaler
      managed: {{ and $q.components.hpa (not $q.stopped) }}
    - kind: objectstorage
      managed: {{ eq $v.storage.mode "operator" }}
    - kind: route
      managed: {{ $q.components.route }}
    - kind: tls
      managed: {{ $q.tls.managed }}
    - kind: mirror
      managed: {{ $q.components.mirror }}
      {{- if and $q.components.mirror $mirrorOverrides }}
      overrides:
        {{- toYaml $mirrorOverrides | nindent 8 }}
      {{- end }}
    - kind: monitoring
      managed: {{ $q.components.monitoring }}
{{- if $q.podDisruptionBudgets.enabled }}
{{- range $component := list "quay-app" "clair-app" "quay-mirror" }}
{{- if or (ne $component "clair-app") $q.components.clair }}
{{- if or (ne $component "quay-mirror") $q.components.mirror }}
---
# The Quay operator sets no PodDisruptionBudget: a drain evicts one pod of each component at a time
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $q.name }}-{{ $component }}
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-%s-pdb" $q.name $component | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "40"
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      quay-operator/quayregistry: {{ $q.name }}
      quay-component: {{ $component }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
