{{- if .Values.enabled }}
{{- if and .Values.networkPolicy.enabled (include "cluster-quay-ha.chartManagedDb" .) }}
{{- $ns := include "cluster-quay-ha.dbNamespace" . }}
{{- $v := .Values }}
{{- $db := $v.database }}
{{- $clusters := list $db.quay.name }}
{{- if $v.quay.components.clair }}{{ $clusters = append $clusters $db.clair.name }}{{ end }}
{{- $clusterLabel := "postgres-operator.crunchydata.com/cluster" }}
{{- if eq $db.mode "cloudnativepg" }}{{ $clusterLabel = printf "%s/cluster" (include "cluster-quay-ha.cnpgLabelPrefix" .) }}{{ end }}
{{- /* Namespaces of the database operator: CloudNativePG must reach every instance on 8000 (status) and 5432 */}}
{{- $opNs := list }}
{{- with $v.networkPolicy.operatorNamespaces }}{{ $opNs = . }}{{ end }}
{{- if not $opNs }}
{{- if eq $db.mode "cloudnativepg" }}
{{- if eq $db.cloudnativepg.flavor "edb" }}{{ $opNs = list "openshift-operators" }}{{ else }}{{ $opNs = list "cnpg-system" }}{{ end }}
{{- else if and $v.dbOperator $v.dbOperator.subscription $v.dbOperator.subscription.namespace }}
{{- $opNs = list $v.dbOperator.subscription.namespace }}
{{- end }}
{{- end }}
{{- $opNs = without $opNs $ns }}
---
# Only the pods of the namespace (Quay, Clair, the database operator jobs), the database operator and the
# monitoring stacks reach the database pods; password and TLS are still required
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $v.quay.name }}-postgres
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-postgres-networkpolicy" $v.quay.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "20"
spec:
  podSelector:
    matchExpressions:
      - key: {{ $clusterLabel }}
        operator: In
        values:
          {{- range $clusters }}
          - {{ . }}
          {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    {{- if ne $ns (include "cluster-quay-ha.namespace" .) }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "cluster-quay-ha.namespace" . }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if $opNs }}
    # Database operator running outside the database namespace (every port: status API, PostgreSQL)
    - from:
        {{- range $opNs }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
    {{- end }}
    - from:
        {{- range $v.networkPolicy.monitoringNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 9187
{{- end }}
{{- end }}
