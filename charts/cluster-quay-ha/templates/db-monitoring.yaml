{{- if .Values.enabled }}
{{- if and .Values.monitoring.enabled (include "cluster-quay-ha.chartManagedDb" .) }}
{{- $ns := include "cluster-quay-ha.dbNamespace" . }}
{{- $v := .Values }}
{{- $db := $v.database }}
{{- $m := dict "replicationLagBytes" (int64 $v.monitoring.replicationLagBytes) "replicationLagSeconds" (int64 $v.monitoring.replicationLagSeconds) "backupMaxAgeHours" (int64 $v.monitoring.backupMaxAgeHours) "fullBackupMaxAgeDays" (int64 $v.monitoring.fullBackupMaxAgeDays) "volumeUsagePercent" (int64 $v.monitoring.volumeUsagePercent) }}
{{- $plugin := and $v.backup.enabled (eq $db.mode "cloudnativepg") (eq $v.backup.cloudnativepg.method "plugin") }}
{{- $clusters := list $db.quay.name }}
{{- if $v.quay.components.clair }}{{ $clusters = append $clusters $db.clair.name }}{{ end }}
{{- $re := join "|" $clusters }}
{{- $lbl := include "cluster-quay-ha.cnpgLabelPrefix" . }}
---
# One PodMonitor for both clusters (CloudNativePG: spec.monitoring.enablePodMonitor is deprecated since 1.30)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $v.quay.name }}-postgres
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-postgres" $v.quay.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "40"
spec:
  selector:
    {{- if eq $db.mode "crunchy" }}
    matchLabels:
      postgres-operator.crunchydata.com/crunchy-postgres-exporter: "true"
    matchExpressions:
      - key: postgres-operator.crunchydata.com/cluster
        operator: In
        values:
          {{- range $clusters }}
          - {{ . }}
          {{- end }}
    {{- else }}
    matchLabels:
      {{ $lbl }}/podRole: instance
    matchExpressions:
      - key: {{ $lbl }}/cluster
        operator: In
        values:
          {{- range $clusters }}
          - {{ . }}
          {{- end }}
    {{- end }}
  podMetricsEndpoints:
    - port: {{ if eq $db.mode "crunchy" }}exporter{{ else }}metrics{{ end }}
      interval: 30s
      relabelings:
        {{- if eq $db.mode "crunchy" }}
        - sourceLabels: [__meta_kubernetes_pod_label_postgres_operator_crunchydata_com_cluster]
          targetLabel: pg_cluster
        - sourceLabels: [__meta_kubernetes_pod_label_postgres_operator_crunchydata_com_role]
          targetLabel: role
        {{- else }}
        - sourceLabels: [__meta_kubernetes_pod_label_{{ $lbl | replace "." "_" }}_cluster]
          targetLabel: pg_cluster
        - sourceLabels: [__meta_kubernetes_pod_label_{{ $lbl | replace "." "_" }}_instanceRole]
          targetLabel: role
        {{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $v.quay.name }}-postgres
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-postgres-rules" $v.quay.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "40"
spec:
  groups:
    - name: {{ $v.quay.name }}-postgres
      rules:
        {{- if eq $db.mode "crunchy" }}
        - alert: QuayPostgresNoPrimary
          expr: |
            {{- range $i, $c := $clusters }}
            {{ if $i }}  or {{ end }}absent(ccp_is_in_recovery_status{pg_cluster="{{ $c }}"} == 2)
            {{- end }}
          for: 2m
          labels:
            severity: critical
            app: quay
          annotations:
            summary: A PostgreSQL cluster of the registry has no reachable primary instance
        {{- if gt (int $db.replicas) 1 }}
        - alert: QuayPostgresNoReplica
          expr: |
            count by (pg_cluster) (ccp_is_in_recovery_status{pg_cluster=~"{{ $re }}"} == 2)
              unless count by (pg_cluster) (ccp_is_in_recovery_status{pg_cluster=~"{{ $re }}"} == 1)
          for: 10m
          labels:
            severity: warning
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }} runs without a replica: no failover possible"
        {{- end }}
        - alert: QuayPostgresReplicationLag
          expr: max by (pg_cluster) (ccp_replication_lag_size_bytes{pg_cluster=~"{{ $re }}"}) > {{ $m.replicationLagBytes }}
          for: 5m
          labels:
            severity: warning
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }}: a replica lags more than {{ $m.replicationLagBytes }} bytes of WAL behind the primary"
        {{- if $v.backup.enabled }}
        - alert: QuayPostgresWalArchiveFailing
          expr: max by (pg_cluster) (ccp_archive_command_status_seconds_since_last_fail{pg_cluster=~"{{ $re }}"}) > 300
          for: 1m
          labels:
            severity: critical
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }}: WAL archiving to the backup bucket has been failing for more than 5 minutes"
        - alert: QuayPostgresBackupTooOld
          expr: min by (pg_cluster) (ccp_backrest_last_diff_backup_time_since_completion_seconds{pg_cluster=~"{{ $re }}"}) > {{ $m.backupMaxAgeHours }} * 3600
          for: 1h
          labels:
            severity: critical
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }}: no full or differential backup for more than {{ $m.backupMaxAgeHours }} hours"
        - alert: QuayPostgresFullBackupTooOld
          expr: min by (pg_cluster) (ccp_backrest_last_full_backup_time_since_completion_seconds{pg_cluster=~"{{ $re }}"}) > {{ $m.fullBackupMaxAgeDays }} * 86400
          for: 1h
          labels:
            severity: critical
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }}: no full backup for more than {{ $m.fullBackupMaxAgeDays }} days"
        - alert: QuayPostgresBackupsNotVisible
          expr: |
            {{- range $i, $c := $clusters }}
            {{ if $i }}  or {{ end }}absent(ccp_backrest_last_diff_backup_time_since_completion_seconds{pg_cluster="{{ $c }}"})
            {{- end }}
          for: 1h
          labels:
            severity: critical
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }}: no backup visible, repository unreachable or no backup ever completed"
        {{- end }}
        - alert: QuayPostgresConnections
          expr: max by (pg_cluster, pod) (100 * ccp_connection_stats_total{pg_cluster=~"{{ $re }}"} / ccp_connection_stats_max_connections{pg_cluster=~"{{ $re }}"}) > 80
          for: 5m
          labels:
            severity: warning
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }}: more than 80% of max_connections in use"
        - alert: QuayPostgresVolumeFull
          expr: max by (pg_cluster, pod) (100 * (1 - ccp_nodemx_data_disk_available_bytes{pg_cluster=~"{{ $re }}"} / ccp_nodemx_data_disk_total_bytes{pg_cluster=~"{{ $re }}"})) > {{ $m.volumeUsagePercent }}
          for: 5m
          labels:
            severity: warning
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pod }}` }}: data volume more than {{ $m.volumeUsagePercent }}% full"
        {{- else }}
        - alert: QuayPostgresNoPrimary
          expr: |
            {{- range $i, $c := $clusters }}
            {{ if $i }}  or {{ end }}absent(cnpg_pg_replication_in_recovery{pg_cluster="{{ $c }}"} == 0)
            {{- end }}
          for: 2m
          labels:
            severity: critical
            app: quay
          annotations:
            summary: A PostgreSQL cluster of the registry has no reachable primary instance
        {{- if gt (int $db.replicas) 1 }}
        - alert: QuayPostgresNoReplica
          expr: |
            count by (pg_cluster) (cnpg_pg_replication_in_recovery{pg_cluster=~"{{ $re }}"} == 0)
              unless count by (pg_cluster) (cnpg_pg_replication_in_recovery{pg_cluster=~"{{ $re }}"} == 1)
          for: 10m
          labels:
            severity: warning
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }} runs without a replica: no failover possible"
        {{- end }}
        - alert: QuayPostgresInstanceDown
          expr: cnpg_collector_up{pg_cluster=~"{{ $re }}"} == 0
          for: 5m
          labels:
            severity: critical
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pod }}` }}: PostgreSQL is down"
        - alert: QuayPostgresReplicationLag
          expr: max by (pg_cluster) (cnpg_pg_replication_lag{pg_cluster=~"{{ $re }}"}) > {{ $m.replicationLagSeconds }}
          for: 5m
          labels:
            severity: warning
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }}: a replica lags more than {{ $m.replicationLagSeconds }} seconds behind the primary"
        {{- if $v.backup.enabled }}
        - alert: QuayPostgresWalArchiveFailing
          expr: max by (pg_cluster) (cnpg_collector_pg_wal_archive_status{pg_cluster=~"{{ $re }}",value="ready"}) > 2
          for: 10m
          labels:
            severity: critical
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }}: WAL segments are waiting to be archived to the backup bucket"
        {{- if not $plugin }}
        # cnpg_collector_last_available_backup_timestamp is fed by the native backup method only (not by the plugin)
        - alert: QuayPostgresBackupTooOld
          expr: time() - max by (pg_cluster) (cnpg_collector_last_available_backup_timestamp{pg_cluster=~"{{ $re }}"}) > {{ $m.backupMaxAgeHours }} * 3600
          for: 1h
          labels:
            severity: critical
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }}: no successful backup for more than {{ $m.backupMaxAgeHours }} hours"
        - alert: QuayPostgresBackupsNotVisible
          expr: |
            {{- range $i, $c := $clusters }}
            {{ if $i }}  or {{ end }}absent(cnpg_collector_last_available_backup_timestamp{pg_cluster="{{ $c }}"} > 0)
            {{- end }}
          for: 1h
          labels:
            severity: critical
            app: quay
          annotations:
            summary: "{{ `{{ $labels.pg_cluster }}` }}: no backup visible, no backup ever completed"
        {{- end }}
        {{- end }}
        - alert: QuayPostgresVolumeFull
          expr: max by (persistentvolumeclaim) (100 * kubelet_volume_stats_used_bytes{namespace="{{ $ns }}",persistentvolumeclaim=~"({{ $re }})-[0-9]+"} / kubelet_volume_stats_capacity_bytes{namespace="{{ $ns }}",persistentvolumeclaim=~"({{ $re }})-[0-9]+"}) > {{ $m.volumeUsagePercent }}
          for: 5m
          labels:
            severity: warning
            app: quay
          annotations:
            summary: "{{ `{{ $labels.persistentvolumeclaim }}` }}: data volume more than {{ $m.volumeUsagePercent }}% full"
        {{- end }}
{{- end }}
{{- end }}
