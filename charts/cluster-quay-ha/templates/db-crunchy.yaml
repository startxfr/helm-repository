{{- if .Values.enabled }}
{{- if eq .Values.database.mode "crunchy" }}
{{- $ns := include "cluster-quay-ha.dbNamespace" . }}
{{- $v := .Values }}
{{- $db := $v.database }}
{{- $backup := include "cluster-quay-ha.dbBackup" . }}
{{- $prefix := include "cluster-quay-ha.backupPrefix" . }}
{{- if $backup }}
---
# Credentials of the backup bucket, read by pgBackRest in the database pods and the backup jobs
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.quay.name }}-pgbackrest-s3
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-pgbackrest-s3" $v.quay.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  s3.conf: |
    [global]
    repo1-s3-key={{ $v.backup.s3.accessKey }}
    repo1-s3-key-secret={{ $v.backup.s3.secretKey }}
  {{- if $v.backup.s3.caCert }}
  s3-ca.crt: |
    {{- $v.backup.s3.caCert | nindent 4 }}
  {{- end }}
{{- end }}
{{- range $key := list "quay" "clair" }}
{{- $c := index $db $key }}
{{- $restore := index $v.restore $key }}
{{- $inPlace := index $v.restore.inPlace $key }}
{{- if or (eq $key "quay") $v.quay.components.clair }}
---
# Owner password: the operator keeps the password present here and computes the SCRAM verifier itself
apiVersion: v1
kind: Secret
metadata:
  name: {{ $c.name }}-pguser-{{ $c.user }}
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-pguser-%s" $c.name $c.user | quote }}
    postgres-operator.crunchydata.com/cluster: {{ $c.name }}
    postgres-operator.crunchydata.com/pguser: {{ $c.user }}
    postgres-operator.crunchydata.com/role: pguser
  annotations:
    {{- include "cluster-quay-ha.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  password: {{ $c.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $c.name }}-init
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-init" $c.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
data:
  init.sql: |
    {{- include "cluster-quay-ha.initSQL" (dict "database" $c.database "user" $c.user "extensions" $c.extensions) | nindent 4 }}
---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: {{ $c.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $c.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "20"
spec:
  postgresVersion: {{ $c.postgresVersion }}
  users:
    - name: {{ $c.user }}
      databases:
        - {{ $c.database }}
      password:
        type: AlphaNumeric
  databaseInitSQL:
    name: {{ $c.name }}-init
    key: init.sql
  {{- with $c.parameters }}
  config:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- if $db.synchronous }}
  patroni:
    dynamicConfiguration:
      synchronous_mode: true
  {{- end }}
  instances:
    - name: pgha1
      replicas: {{ $db.replicas }}
      {{- with $c.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        {{- if $c.storage.storageClass }}
        storageClassName: {{ $c.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $c.storage.size }}
      {{- if $db.avoidInfraNodes }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/infra
                    operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  postgres-operator.crunchydata.com/cluster: {{ $c.name }}
                  postgres-operator.crunchydata.com/instance-set: pgha1
      {{- end }}
  {{- if and $v.restore.enabled $backup }}
  # Restore into a new cluster: read at cluster creation only
  dataSource:
    pgbackrest:
      stanza: db
      configuration:
        - secret:
            name: {{ $v.quay.name }}-pgbackrest-s3
      global:
        repo1-path: {{ $restore.source }}
        repo1-s3-uri-style: path
        {{- if $v.backup.s3.port }}
        repo1-storage-port: {{ $v.backup.s3.port | quote }}
        {{- end }}
        {{- if $v.backup.s3.caCert }}
        repo1-storage-ca-file: /etc/pgbackrest/conf.d/s3-ca.crt
        {{- end }}
      repo:
        name: repo1
        s3:
          bucket: {{ $v.backup.s3.bucket }}
          endpoint: {{ $v.backup.s3.endpoint }}
          region: {{ $v.backup.s3.region }}
      {{- if $restore.target }}
      options:
        - --type=time
        - --target={{ $restore.target | quote }}
      {{- end }}
  {{- end }}
  {{- if $backup }}
  backups:
    pgbackrest:
      configuration:
        - secret:
            name: {{ $v.quay.name }}-pgbackrest-s3
      {{- if $db.avoidInfraNodes }}
      jobs:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/infra
                      operator: DoesNotExist
      {{- end }}
      manual:
        repoName: repo1
        options:
          - --type=full
      # In place restore: enabled by a commit, triggered by the pgbackrest-restore annotation (README)
      restore:
        enabled: {{ $v.restore.inPlace.enabled }}
        repoName: repo1
        {{- if and $v.restore.inPlace.enabled $inPlace.target }}
        options:
          - --type=time
          - --target={{ $inPlace.target | quote }}
        {{- end }}
      global:
        repo1-path: /{{ $prefix }}/{{ $c.name }}/repo1
        repo1-retention-full: {{ $v.backup.retentionDays | quote }}
        repo1-retention-full-type: time
        repo1-s3-uri-style: path
        {{- if $v.backup.s3.port }}
        repo1-storage-port: {{ $v.backup.s3.port | quote }}
        {{- end }}
        {{- if $v.backup.s3.caCert }}
        repo1-storage-ca-file: /etc/pgbackrest/conf.d/s3-ca.crt
        {{- end }}
      repos:
        - name: repo1
          s3:
            bucket: {{ $v.backup.s3.bucket }}
            endpoint: {{ $v.backup.s3.endpoint }}
            region: {{ $v.backup.s3.region }}
          schedules:
            full: {{ $v.backup.schedules.full | quote }}
            {{- if $v.backup.schedules.differential }}
            differential: {{ $v.backup.schedules.differential | quote }}
            {{- end }}
  {{- end }}
  {{- if $v.monitoring.enabled }}
  monitoring:
    pgmonitor:
      exporter: {}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
