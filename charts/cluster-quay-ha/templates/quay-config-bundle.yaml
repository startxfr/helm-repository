{{- if .Values.enabled }}
{{- include "cluster-quay-ha.validate" . -}}
{{- $ns := include "cluster-quay-ha.namespace" . }}
{{- $v := .Values }}
{{- if not $v.quay.existingConfigBundleSecret }}
---
# Config bundle of the registry: config.yaml, optional clair-config.yaml, extra CA certificates, optional TLS pair.
# Applied server side by Argo CD so that no clear text copy lands in a last-applied-configuration annotation.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.quay.name }}-config-bundle
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-config-bundle" $v.quay.name | quote }}
  annotations:
    {{- include "cluster-quay-ha.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  config.yaml: |
    {{- include "cluster-quay-ha.config" . | nindent 4 }}
  {{- if and (include "cluster-quay-ha.unmanagedDb" .) $v.quay.components.clair }}
  clair-config.yaml: |
    indexer:
      connstring: {{ include "cluster-quay-ha.clairConnString" . }}
    matcher:
      connstring: {{ include "cluster-quay-ha.clairConnString" . }}
    notifier:
      connstring: {{ include "cluster-quay-ha.clairConnString" . }}
  {{- end }}
  {{- if and (include "cluster-quay-ha.unmanagedDb" .) (eq $v.database.tls.mode "verify-full") }}
  extra_ca_cert_postgres-ca.crt: |
    {{- $v.database.tls.caCert | nindent 4 }}
  {{- end }}
  {{- if and (eq $v.storage.mode "external") $v.storage.external.caCert }}
  extra_ca_cert_storage.crt: |
    {{- $v.storage.external.caCert | nindent 4 }}
  {{- end }}
  {{- if and $v.oidc.enabled $v.oidc.caCert }}
  extra_ca_cert_oidc.crt: |
    {{- $v.oidc.caCert | nindent 4 }}
  {{- end }}
  {{- range $name, $pem := $v.quay.extraCaCerts }}
  extra_ca_cert_{{ $name }}: |
    {{- $pem | nindent 4 }}
  {{- end }}
  {{- if not $v.quay.tls.managed }}
  ssl.cert: |
    {{- $v.quay.tls.cert | nindent 4 }}
  ssl.key: |
    {{- $v.quay.tls.key | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and (include "cluster-quay-ha.unmanagedDb" .) (eq $v.database.tls.mode "verify-full") }}
---
# CA of the databases for the quay-app, quay-mirror and upgrade pods, rendered even with an existing config bundle:
# the operator projects this secret into /run/secrets/postgresql and the Quay image copies ca.crt to /.postgresql/root.crt
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-client-certs
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-quay-ha.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgresql-client-certs
  annotations:
    {{- include "cluster-quay-ha.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  ca.crt: |
    {{- $v.database.tls.caCert | nindent 4 }}
{{- end }}
{{- end }}
