# Default values for cluster-quay-ha.
# Every section is documented in README.md. Values marked "secret" are expected to be
# Argo CD Vault Plugin placeholders (<path:kv/data/...#key>) or supplied by a values file
# kept out of Git; the chart never generates or encodes them.

# Application deployment context (STARTX labels)
context:
  # Name of the global scope for this application (organisational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: registry
  # Application name (functional tenant)
  app: quay
  # Version name of this application
  version: "3.18.0"

# Render the registry and its databases. false: only the enabled sub-charts (project, operator, dbOperator)
# are rendered, which is how a first Argo CD Application installs the namespace and the operators (see README).
enabled: true

# Namespace of every object rendered by this chart (QuayRegistry, databases, secrets...).
# Empty: project.project.name when the project sub-chart is enabled, otherwise the release namespace.
namespace: ""

# ------------------------------------------------------------------------------------------------
# STARTX sub-charts (optional): namespace and OLM subscriptions
# ------------------------------------------------------------------------------------------------
# Namespace of the registry, rendered by the STARTX project chart.
# Note: that chart labels the namespace openshift.io/cluster-monitoring=true (see README, Monitoring).
project:
  enabled: false
  context:
    scope: myscope
    cluster: default
    environment: myenv
    component: registry
    app: quay
    version: "3.18.0"
  project:
    enabled: true
    hooked: false
    type: namespace
    name: quay
    display_name: "Quay registry"
    description: "Red Hat Quay registry, high availability"
    requester: cluster-quay-ha

# OLM subscription of the Quay operator (STARTX operator chart). Installed cluster wide in
# openshift-operators by default: the monitoring component of the operator requires AllNamespaces mode.
operator:
  enabled: false
  context:
    scope: myscope
    cluster: default
    environment: myenv
    component: registry
    app: quay-operator
    version: "3.18.0"
  subscription:
    enabled: true
    hooked: false
    name: quay-operator
    namespace: openshift-operators
    # Without csv the subscription follows the channel. With csv: quay-operator and version: v3.18.<z>
    # the chart renders startingCSV: quay-operator.v3.18.<z> (pin the version that took your backups)
    version: "v3.18"
    operator:
      channel: stable-3.18
      name: quay-operator
      installPlanApproval: Manual
      source:
        name: redhat-operators
        namespace: openshift-marketplace
  operatorGroup:
    enabled: false
    name: quay-operator
    namespace: openshift-operators

# OLM subscription of the database operator (STARTX operator chart), only for database.mode crunchy
# (Crunchy Postgres for Kubernetes, certified-operators) or cloudnativepg with the EDB flavor
# (EDB Postgres for Kubernetes, certified-operators). The community CloudNativePG operator is not in
# the Red Hat or certified catalogs: install it from community-operators or from its release manifest (see README).
dbOperator:
  enabled: false
  context:
    scope: myscope
    cluster: default
    environment: myenv
    component: database
    app: quay-postgres
    version: "5.8.9"
  subscription:
    enabled: true
    hooked: false
    name: crunchy-postgres-operator
    namespace: quay
    version: v5.8.9
    operator:
      channel: v5
      name: crunchy-postgres-operator
      installPlanApproval: Manual
      csv: postgresoperator
      source:
        name: certified-operators
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    hooked: false
    name: quay-db-operator
    namespace: quay
    providedAPIs: "PostgresCluster.v1beta1.postgres-operator.crunchydata.com"

# ------------------------------------------------------------------------------------------------
# Quay registry (QuayRegistry custom resource and its config bundle)
# ------------------------------------------------------------------------------------------------
quay:
  # Name of the QuayRegistry. Every object created by the operator is prefixed with it (<name>-quay-app...)
  name: registry
  # SERVER_HOSTNAME. Empty: the operator uses the default route hostname (<name>-quay-<namespace>.apps...)
  hostname: ""
  # SUPER_USERS
  superUsers:
    - quayadmin
  # FEATURE_USER_INITIALIZE: allows the creation of the first super user through the API (set to false afterwards)
  userInitialize: true
  # FEATURE_USER_CREATION (forced to true when oidc.enabled)
  userCreation: false
  # SECRET_KEY: random string, 64 characters (secret). Required.
  secretKey: ""
  # DATABASE_SECRET_KEY: random string, 64 characters (secret). Required. Never change it once Quay runs.
  databaseSecretKey: ""
  # Registry title shown in the UI
  registryTitle: "Red Hat Quay"
  registryTitleShort: "Quay"
  # Tag expiration
  defaultTagExpiration: "2w"
  tagExpirationOptions:
    - "0s"
    - "1d"
    - "1w"
    - "2w"
    - "4w"
  # Any other config.yaml key; merged last, overrides the keys rendered by the chart
  extraConfig: {}
  # Extra CA certificates added to the config bundle as extra_ca_cert_<name> (PEM). Example:
  # extraCaCerts:
  #   corporate-ca.crt: |
  #     -----BEGIN CERTIFICATE-----
  extraCaCerts: {}
  # Name of an existing config bundle Secret. When set, the chart renders no bundle: you are responsible
  # for config.yaml, clair-config.yaml and extra_ca_cert_* keys.
  existingConfigBundleSecret: ""
  # Route TLS certificate. managed: true lets the operator use the cluster wildcard certificate.
  # managed: false requires cert and key (PEM, secret), added to the bundle as ssl.cert and ssl.key.
  tls:
    managed: true
    cert: ""
    key: ""
  # Components managed by the operator
  components:
    # Clair security scanner (and its database, see database.*)
    clair: true
    # Repository mirroring workers
    mirror: true
    # HorizontalPodAutoscaler for quay-app, clair-app and quay-mirror (min 2, max 20/10/20)
    hpa: true
    # OpenShift Route
    route: true
    # ServiceMonitor, PrometheusRule and Grafana dashboard (requires the operator in AllNamespaces mode)
    monitoring: true
  # Overrides of the managed components (replicas, resources, env, affinity, volumeSize for clair...)
  overrides:
    quay:
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 12Gi
    clair:
      volumeSize: 50Gi
    mirror: {}
  # true: quay-app, clair-app and quay-mirror are scaled to zero and the HPA is unmanaged (maintenance, restore)
  stopped: false
  # PodDisruptionBudgets (maxUnavailable 1) for quay-app, clair-app and quay-mirror
  podDisruptionBudgets:
    enabled: true

# ------------------------------------------------------------------------------------------------
# Object storage of the registry
# ------------------------------------------------------------------------------------------------
storage:
  # external: S3 compatible endpoint described below (DISTRIBUTED_STORAGE_CONFIG in the bundle)
  # operator: object storage managed by the Quay operator (ObjectBucketClaim, requires OpenShift Data Foundation / NooBaa)
  mode: external
  external:
    # RadosGWStorage: any S3 compatible endpoint (Ceph RGW, MinIO, NooBaa, a cloud S3 compatible service...)
    # S3Storage: Amazon S3 only (Quay derives the endpoint from region: host, port and isSecure are ignored)
    driver: RadosGWStorage
    # Hostname of the endpoint, without scheme (RadosGWStorage)
    host: ""
    # Port of the endpoint (RadosGWStorage; empty: 443 or 80 according to isSecure)
    port: ""
    isSecure: true
    bucket: ""
    storagePath: /datastorage/registry
    # Credentials (secret)
    accessKey: ""
    secretKey: ""
    # Signature region: S3Storage requires it (the endpoint is s3.<region>.amazonaws.com); RadosGWStorage uses it when set
    region: ""
    # PEM of a private CA signing the endpoint certificate (added to the bundle as extra_ca_cert_storage.crt)
    caCert: ""
    # Full DISTRIBUTED_STORAGE_CONFIG passthrough for other drivers (e.g. IBMCloudStorage, GoogleCloudStorage).
    # When set, the keys above are ignored except caCert. Example:
    # custom:
    #   default:
    #     - S3Storage
    #     - s3_bucket: ...
    custom: {}

# ------------------------------------------------------------------------------------------------
# PostgreSQL databases of Quay and Clair
# ------------------------------------------------------------------------------------------------
database:
  # crunchy:       two PostgresCluster (Crunchy Postgres for Kubernetes, PGO 5.x), rendered by this chart
  # cloudnativepg: two Cluster (CloudNativePG 1.26+ or EDB Postgres for Kubernetes), rendered by this chart
  # external:      databases you operate elsewhere (quay.host / clair.host below)
  # quayOperator:  single pod databases managed by the Quay operator (not highly available, no backup: for tests)
  mode: crunchy
  # Namespace of the database clusters and their secrets (crunchy, cloudnativepg). Empty: the namespace of the registry.
  # A dedicated namespace keeps the database PodMonitor and alerts out of the registry namespace, which the Quay
  # operator labels openshift.io/cluster-monitoring=true (see README, Monitoring).
  namespace: ""
  # Render the Namespace object of database.namespace (rendered even when enabled is false, so that the Argo CD
  # Application installing the operators can create it; the AppProject must allow cluster scoped Namespaces).
  # Set it to true in exactly one Application.
  createNamespace: false
  # Number of PostgreSQL instances per cluster (crunchy, cloudnativepg)
  replicas: 2
  # Synchronous replication (crunchy: Patroni synchronous_mode; cloudnativepg: quorum, preferred data durability)
  synchronous: true
  # Keep database pods off the infra nodes (node-role.kubernetes.io/infra) and on distinct nodes (crunchy, cloudnativepg)
  avoidInfraNodes: true
  # TLS between Quay/Clair and the databases.
  # require: encrypted, server certificate not verified (works without caCert)
  # verify-full: server certificate verified against caCert (PEM): crunchy -> secret <cluster>-cluster-cert key ca.crt
  #   (root CA of the operator, 10 years), cloudnativepg -> secret <cluster>-ca key ca.crt of each cluster (90 days by
  #   default, CERTIFICATE_DURATION of the operator: raise it or refresh caCert at each renewal), external -> your CA
  tls:
    mode: require
    caCert: ""
  # Quay database
  quay:
    # Cluster name (crunchy, cloudnativepg)
    name: quay-db
    # external mode: host and port of the server
    host: ""
    port: 5432
    database: quay
    user: quay
    # Owner password (secret). Required in every mode except quayOperator.
    password: ""
    # Major version (crunchy: postgresVersion; cloudnativepg: see imageName)
    postgresVersion: 17
    # Extensions created in the database (Quay requires pg_trgm)
    extensions:
      - pg_trgm
    storage:
      size: 100Gi
      # Empty: default StorageClass
      storageClass: ""
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        memory: 16Gi
    # postgresql.conf parameters
    parameters:
      max_connections: "2000"
      shared_buffers: "2GB"
      effective_cache_size: "6GB"
    cloudnativepg:
      # Image of the instances. Empty: community flavor -> ghcr.io/cloudnative-pg/postgresql:<postgresVersion>-system-trixie
      # (system images carry barman-cloud, needed by the native backup method; pin a minor version in production),
      # edb flavor -> the default image of the EDB operator
      imageName: ""
      # Folder of this cluster in the backup bucket (s3://<bucket>/<prefix>/<serverName>). Empty: the cluster name.
      # Set it (e.g. quay-db-r1) when a cluster is recreated from its own backups under the same name: the archive
      # of a new cluster must be empty (see README, Restore)
      serverName: ""
  # Clair database (ignored when quay.components.clair is false)
  clair:
    name: clair-db
    host: ""
    port: 5432
    database: clair
    user: clair
    password: ""
    postgresVersion: 15
    extensions:
      - uuid-ossp
    storage:
      size: 50Gi
      storageClass: ""
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        memory: 8Gi
    parameters:
      max_connections: "2000"
      shared_buffers: "1GB"
      effective_cache_size: "3GB"
    cloudnativepg:
      imageName: ""
      serverName: ""
  cloudnativepg:
    # community: postgresql.cnpg.io/v1 (CloudNativePG); edb: postgresql.k8s.enterprisedb.io/v1 (EDB Postgres for Kubernetes)
    flavor: community
    # Pod anti affinity topology key
    topologyKey: kubernetes.io/hostname

# ------------------------------------------------------------------------------------------------
# Backup of the databases to an S3 compatible bucket (crunchy: pgBackRest; cloudnativepg: Barman Cloud)
# ------------------------------------------------------------------------------------------------
backup:
  # false: no backup section at all. On a running crunchy cluster the backups section is removed at once (the
  # postgres-operator.crunchydata.com/authorizeBackupRemoval annotation is only needed for volume based repositories);
  # the content of the bucket is kept
  enabled: true
  s3:
    # Hostname of the endpoint, without scheme
    endpoint: ""
    # Empty: 443
    port: ""
    region: ""
    bucket: ""
    # Credentials (secret)
    accessKey: ""
    secretKey: ""
    # PEM of a private CA signing the endpoint certificate
    caCert: ""
    # Prefix of the paths used in the bucket; empty: the namespace of the databases. Paths: /<prefix>/<cluster>/repo1
    # (crunchy, pgBackRest repo1-path) and s3://<bucket>/<prefix>/<serverName> (cloudnativepg, Barman Cloud)
    pathPrefix: ""
  # Retention of full backups, in days
  retentionDays: 14
  schedules:
    # cron, 5 fields: full backup
    full: "0 1 * * 0"
    # cron, 5 fields: differential backup (crunchy only)
    differential: "0 1 * * 1-6"
  cloudnativepg:
    # barmanObjectStore: native Barman Cloud integration (deprecated since CloudNativePG 1.26, still functional, needs a system image)
    # plugin: Barman Cloud Plugin (requires the plugin installed next to the operator and cert-manager); renders ObjectStore objects.
    #   The backup age alerts (QuayPostgresBackupTooOld, QuayPostgresBackupsNotVisible) are not rendered with the plugin:
    #   it does not feed cnpg_collector_last_available_backup_timestamp
    method: barmanObjectStore
    # WAL and base backup compression: gzip, bzip2, lz4 or snappy
    compression: gzip

# ------------------------------------------------------------------------------------------------
# Restore of the databases from the backup bucket
# ------------------------------------------------------------------------------------------------
restore:
  # Bootstrap the clusters from a backup instead of initializing them. Read at cluster creation only.
  # The new cluster must not write its own backups where it restores from: crunchy -> another backup.s3.pathPrefix
  # (restore.<db>.source is a full path); cloudnativepg -> another cluster name or database.<db>.cloudnativepg.serverName
  enabled: false
  # cloudnativepg: prefix in the bucket holding the backups to restore from; empty: backup.s3.pathPrefix
  # (crunchy: unused, restore.<db>.source is a full repo1-path)
  pathPrefix: ""
  quay:
    # crunchy: repo1-path of the source cluster (e.g. /quay/quay-db/repo1); cloudnativepg: serverName of the source cluster
    source: ""
    # Point in time, "2026-10-15 14:00:00+00"; empty: end of the archive
    target: ""
  clair:
    source: ""
    target: ""
  # crunchy only: restore in place of a running cluster (spec.backups.pgbackrest.restore), triggered by the
  # postgres-operator.crunchydata.com/pgbackrest-restore annotation (see README)
  inPlace:
    enabled: false
    quay:
      target: ""
    clair:
      target: ""

# ------------------------------------------------------------------------------------------------
# OIDC login (Keycloak, Red Hat build of Keycloak, any OpenID Connect provider)
# ------------------------------------------------------------------------------------------------
oidc:
  enabled: false
  # true: AUTHENTICATION_TYPE OIDC, the provider is the internal authentication of Quay: team synchronization from the
  #   group claim; username/password logins (UI form, podman login) are checked by the provider through the OAuth2
  #   password grant (enable "Direct access grants" on the Keycloak client, or use robot accounts); the accounts created
  #   before in the database, including the first super user, no longer log in with their password (their API tokens
  #   keep working). List the provider usernames of the administrators in quay.superUsers before switching.
  # false: AUTHENTICATION_TYPE stays Database, the provider is an additional login button (the procedure of the Quay
  #   operator documentation): database accounts keep their password, no team synchronization. FEATURE_USER_CREATION
  #   is set to true in both cases (first login of a provider user); with false it also allows self registration.
  internalAuthentication: true
  # Prefix of the config block (<SERVICE>_LOGIN_CONFIG) and name shown on the login button
  serviceName: SSO
  # Issuer URL with a trailing slash: https://sso.example.com/realms/<realm>/
  server: ""
  clientId: quay
  # secret
  clientSecret: ""
  loginScopes:
    - openid
    - email
    - profile
  usernameClaim: preferred_username
  emailClaim: email
  # Claim carrying the groups, for team synchronization (empty: no group claim)
  groupClaim: groups
  # FEATURE_TEAM_SYNCING (internalAuthentication only)
  teamSyncing: true
  # FEATURE_NONSUPERUSER_TEAM_SYNCING_SETUP (internalAuthentication only)
  nonSuperuserTeamSyncingSetup: false
  pkce: true
  # PEM of a private CA signing the provider certificate (added as extra_ca_cert_oidc.crt)
  caCert: ""

# ------------------------------------------------------------------------------------------------
# Monitoring and network
# ------------------------------------------------------------------------------------------------
monitoring:
  # PodMonitor (crunchy) or Cluster.spec.monitoring.enablePodMonitor (cloudnativepg) and PrometheusRule alerts.
  # Requires the Prometheus operator CRDs (OpenShift user workload monitoring).
  enabled: true
  # Thresholds of the alerts
  replicationLagBytes: 104857600
  replicationLagSeconds: 60
  backupMaxAgeHours: 36
  fullBackupMaxAgeDays: 8
  volumeUsagePercent: 80
networkPolicy:
  # Ingress policy on the database pods: same namespace, the registry namespace on 5432 (when database.namespace
  # differs), the database operator namespaces (every port) and the monitoring namespaces on the metrics port
  enabled: true
  monitoringNamespaces:
    - openshift-monitoring
    - openshift-user-workload-monitoring
  # Namespaces of the database operator when it runs outside the database namespace (CloudNativePG reaches every
  # instance on 8000 and 5432). Empty: cnpg-system (cloudnativepg, community flavor), openshift-operators
  # (cloudnativepg, edb flavor), dbOperator.subscription.namespace (crunchy)
  operatorNamespaces: []
