# Wave 1: namespace and OLM subscriptions (Quay operator, database operator). Nothing else is rendered (enabled: false).
# Approve the InstallPlans before syncing the second Application (installPlanApproval: Manual).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-quay-ha-operators
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-quay-ha
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-quay-ha
    targetRevision: 21.3.0
    helm:
      values: |
        enabled: false
        project:
          enabled: true
          project:
            name: quay
        operator:
          enabled: true
        dbOperator:
          enabled: true
          subscription:
            namespace: quay
          operatorGroup:
            namespace: quay
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
