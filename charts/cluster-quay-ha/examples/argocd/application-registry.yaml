# Wave 2: databases, config bundle, QuayRegistry, budgets, monitoring. Sync waves inside the chart order the objects
# (secrets 10, clusters 20, registry 30, budgets and rules 40); the health checks of examples/argocd/argocd-health.yaml
# make Argo CD wait for the databases before creating the registry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-quay-ha
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-quay-ha
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-quay-ha
    targetRevision: 21.3.0
    helm:
      # Secrets: use a values file kept out of Git, or the Argo CD Vault Plugin (see applicationset.yaml)
      values: |
        quay:
          hostname: quay.apps.ocp.example.com
          secretKey: <64-random-characters>
          databaseSecretKey: <64-random-characters>
        storage:
          mode: external
          external:
            host: s3.example.com
            bucket: quay-registry
            accessKey: <access-key>
            secretKey: <secret-key>
        database:
          mode: crunchy
          quay:
            password: <quay-db-password>
          clair:
            password: <clair-db-password>
        backup:
          enabled: true
          s3:
            endpoint: s3.example.com
            region: us-east-1
            bucket: quay-pgbackrest
            accessKey: <access-key>
            secretKey: <secret-key>
  destination:
    server: https://kubernetes.default.svc
    namespace: quay
  ignoreDifferences:
    - group: postgres-operator.crunchydata.com
      kind: PostgresCluster
      jsonPointers:
        - /metadata/finalizers
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /metadata/finalizers
    - group: quay.redhat.com
      kind: QuayRegistry
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
