# Complete example of a values file kept in a Git repository of the environment (see applicationset.yaml and the
# README, "Deploy with ArgoCD"): HA registry, external S3 bucket, Crunchy databases in a dedicated namespace, pgBackRest
# backups to a second bucket, OIDC login switched on later. Secrets are Argo CD Vault Plugin placeholders.
# Replace <s3-endpoint>, <s3-region>, quay.hostname and the <realm> of oidc.server: the chart refuses to render while
# a documentation placeholder (<...> that is not <path:...>) remains in a value in use.
#
# The same file serves the two Applications generated by applicationset.yaml: the operators one adds
# --set enabled=false --set project.enabled=true --set operator.enabled=true --set dbOperator.enabled=true
# --set database.createNamespace=true, the registry one uses it as is.

context:
  scope: myscope
  cluster: mycluster
  environment: prod
  component: registry
  app: quay
  version: "3.18.0"

# Namespace of the registry (created by the project sub-chart, operators Application)
namespace: quay-enterprise

project:
  enabled: false
  context:
    scope: myscope
    cluster: mycluster
    environment: prod
    component: registry
    app: quay
    version: "3.18.0"
  project:
    enabled: true
    hooked: false
    type: namespace
    name: quay-enterprise
    display_name: "Quay registry"
    description: "Red Hat Quay, Quay operator"
    requester: quay-gitops

operator:
  enabled: false
  context:
    scope: myscope
    cluster: mycluster
    environment: prod
    component: registry
    app: quay-operator
    version: "3.18.0"
  subscription:
    enabled: true
    hooked: false
    name: quay-operator
    namespace: openshift-operators
    # After the installation, pin the version: csv: quay-operator and version: v3.18.<z> (README, Maintenance)
    version: "v3.18"
    operator:
      channel: stable-3.18
      name: quay-operator
      installPlanApproval: Manual
      source:
        name: redhat-operators
        namespace: openshift-marketplace
  operatorGroup:
    enabled: false
    name: quay-operator
    namespace: openshift-operators

dbOperator:
  enabled: false
  context:
    scope: myscope
    cluster: mycluster
    environment: prod
    component: database
    app: quay-postgres
    version: "5.8.9"
  subscription:
    enabled: true
    hooked: false
    name: crunchy-postgres-operator
    namespace: quay-postgres
    version: v5.8.9
    operator:
      channel: v5
      name: crunchy-postgres-operator
      installPlanApproval: Manual
      csv: postgresoperator
      source:
        name: certified-operators
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    hooked: false
    name: quay-postgres
    namespace: quay-postgres
    providedAPIs: "PostgresCluster.v1beta1.postgres-operator.crunchydata.com"

quay:
  name: registry
  hostname: quay.apps.ocp.example.com
  superUsers:
    - quayadmin
  # true while the first super user is created (README, First super user), then false
  userInitialize: true
  userCreation: false
  secretKey: <path:kv/data/quay/prod#secret_key>
  databaseSecretKey: <path:kv/data/quay/prod#database_secret_key>
  tls:
    managed: true
  components:
    clair: true
    mirror: true
    hpa: true
    route: true
    monitoring: true
  overrides:
    quay:
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 12Gi
    clair:
      volumeSize: 50Gi
  stopped: false
  podDisruptionBudgets:
    enabled: true
  extraConfig: {}

storage:
  mode: external
  external:
    driver: RadosGWStorage
    host: <s3-endpoint>
    isSecure: true
    bucket: quay-registry
    storagePath: /datastorage/registry
    accessKey: <path:kv/data/quay/prod#s3_access_key>
    secretKey: <path:kv/data/quay/prod#s3_secret_key>
    # Signature region when the endpoint requires one, empty otherwise
    region: <s3-region>
    # PEM of a private CA signing the endpoint certificate, empty when the CA is public
    caCert: ""

database:
  mode: crunchy
  # Dedicated namespace: the PodMonitor and the alerts of the databases stay out of the namespace labeled by the Quay operator
  namespace: quay-postgres
  # The namespace is created by the operators Application, which sets this value to true (applicationset.yaml)
  createNamespace: false
  replicas: 2
  synchronous: true
  avoidInfraNodes: true
  tls:
    # First sync with require; switch to verify-full once the CA is in Vault (README, Verify the database certificates)
    mode: require
    caCert: ""
  quay:
    name: quay-db
    database: quay
    user: quay
    password: <path:kv/data/quay/prod#quay_db_password>
    postgresVersion: 17
    extensions:
      - pg_trgm
    storage:
      size: 100Gi
      storageClass: ""
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        memory: 16Gi
    parameters:
      max_connections: "2000"
      shared_buffers: "2GB"
      effective_cache_size: "6GB"
  clair:
    name: clair-db
    database: clair
    user: clair
    password: <path:kv/data/quay/prod#clair_db_password>
    postgresVersion: 15
    extensions:
      - uuid-ossp
    storage:
      size: 50Gi
      storageClass: ""
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        memory: 8Gi
    parameters:
      max_connections: "2000"
      shared_buffers: "1GB"
      effective_cache_size: "3GB"

backup:
  enabled: true
  s3:
    endpoint: <s3-endpoint>
    region: <s3-region>
    bucket: quay-pgbackrest
    accessKey: <path:kv/data/quay/prod#pgbackrest_access_key>
    secretKey: <path:kv/data/quay/prod#pgbackrest_secret_key>
    caCert: ""
    pathPrefix: quay-postgres
  retentionDays: 14
  schedules:
    full: "0 1 * * 0"
    differential: "0 1 * * 1-6"

restore:
  enabled: false
  quay:
    source: ""
    target: ""
  clair:
    source: ""
    target: ""
  inPlace:
    enabled: false

oidc:
  # false until the first super user exists, then true (README, Enable OIDC)
  enabled: false
  # The provider becomes the internal authentication of Quay (AUTHENTICATION_TYPE OIDC, team synchronization)
  internalAuthentication: true
  serviceName: SSO
  server: https://sso.example.com/realms/<realm>/
  clientId: quay
  clientSecret: <path:kv/data/quay/prod#oidc_client_secret>
  loginScopes:
    - openid
    - email
    - profile
  usernameClaim: preferred_username
  emailClaim: email
  groupClaim: groups
  teamSyncing: true
  pkce: true
  caCert: ""

monitoring:
  enabled: true
networkPolicy:
  enabled: true
  monitoringNamespaces:
    - openshift-monitoring
    - openshift-user-workload-monitoring
