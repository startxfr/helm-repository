apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-quay-ha
  namespace: openshift-gitops
spec:
  description: Red Hat Quay registry, high availability (cluster-quay-ha chart)
  sourceRepos:
    - http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    # Git repository of the values when applicationset.yaml is used
    - https://git.example.com/infra/quay-values.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: openshift-operators
    - server: https://kubernetes.default.svc
      namespace: quay
    # Namespaces of values-example.yaml (applicationset.yaml)
    - server: https://kubernetes.default.svc
      namespace: quay-enterprise
    - server: https://kubernetes.default.svc
      namespace: quay-postgres
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
