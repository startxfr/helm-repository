apiVersion: v2
# Name of this Helm chart
name: cluster-quay-ha
# Description of this Helm chart
description: Helm chart used to deploy a highly available Red Hat Quay registry (Quay operator) with external or operator managed S3 storage, external or operator managed PostgreSQL (Crunchy or CloudNativePG), OIDC login, backup and restore
# Helm chart application
type: application
# Version of this helm chart (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release guidelines)
version: 21.3.0
# Version of the Quay operator channel this chart is written for
appVersion: 3.18.0
# Icon of this helm-chart
icon: https://helm-repository.readthedocs.io/en/latest/img/cluster-quay.svg
# Kube minimum version
kubeVersion: ">=1.30.0-0"
# Keyword list for this chart
keywords:
  - kubernetes
  - helm
  - startx
  - cluster-chart
  - cluster
  - infrastructure
  - registry
  - container registry
  - quay
  - postgresql
  - crunchy
  - cloudnativepg
  - high availability
# STARTX helm chart repository homepage
home: https://helm-repository.readthedocs.io/en/latest
# Sources and documentation for this chart
sources:
  - https://helm-repository.readthedocs.io/en/latest/charts/cluster-quay-ha
  - https://github.com/startxfr/helm-repository/tree/master/charts/cluster-quay-ha
# Main maintainer contact for this helm chart
maintainers:
  - name: "STARTX"
    email: "dev@startx.fr"
    url: "https://www.startx.fr"

dependencies:
  # Namespace (OpenShift project) of the registry. Optional: Argo CD CreateNamespace=true does the same job.
  - name: project
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.278"
    alias: project
    condition: project.enabled
  # OLM subscription of the Quay operator
  - name: operator
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.278"
    alias: operator
    condition: operator.enabled
  # OLM subscription of the database operator (Crunchy Postgres for Kubernetes, or EDB Postgres for Kubernetes)
  - name: operator
    repository: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/21
    version: "21.3.278"
    alias: dbOperator
    condition: dbOperator.enabled

annotations:
  # category associated to this package
  category: cluster
  # Artifacthub category associated to this package
  artifacthub.io/category: integration-delivery
  # Artifacthub license
  artifacthub.io/license: "GPL-3.0-or-later"
  # Artifacthub is this release a pre-release
  artifacthub.io/prerelease: "true"
  # Artifacthub is an operator chart
  artifacthub.io/operator: "true"
  # Artifacthub operator capabilities
  artifacthub.io/operatorCapabilities: "Seamless Upgrades"
  # Artifacthub chart recommandations
  startx.io/recommendations: |
    - name: Startx basic chart - Project
      url: https://helm-repository.readthedocs.io/en/latest/charts/project
    - name: Startx basic chart - Operator
      url: https://helm-repository.readthedocs.io/en/latest/charts/operator
  # Artifacthub signing keys
  artifacthub.io/signKey: |
    fingerprint: FAC998719FEFFB2E03E119EE0F36B25015D3A34D
    url: https://helm-repository.readthedocs.io/en/latest/pgp_keys.asc
  # Artifacthub changes logs
  artifacthub.io/changes: |
    - kind: added
      description: "First release: HA Quay registry with external/managed S3, Crunchy or CloudNativePG databases, OIDC, backup and restore"
  artifacthub.io/containsSecurityUpdates: "false"
