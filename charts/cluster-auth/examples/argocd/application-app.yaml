apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-auth-app
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: openshift-config
    server: https://kubernetes.default.svc
  project: cluster-auth
  source:
    chart: cluster-auth
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        auth:
          enabled: true
          # Another owner manages OAuth/cluster (ADR-0346): set oauth.enabled to false, the Secrets stay rendered
          # oauth:
          #   enabled: false
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  ignoreDifferences:
    # Secrets copied into openshift-authentication (manageSubresource) are rewritten by the OpenShift
    # authentication operator after each sync
    - kind: Secret
      namespace: openshift-authentication
      jqPathExpressions:
        - .data
        - .stringData
        - .metadata.annotations
        - .metadata.labels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
