{{- if .Values.auth.enabled -}}
{{- if .Values.auth.authBackend -}}
{{- $namespace := .Values.auth.namespace | default "openshift-config" -}}
{{ range $i, $auth := .Values.auth.authBackend }} 
{{-  if eq $auth.type "htpasswd" -}}
{{- if dig "externalSecret" "enabled" false $auth }}
{{- if $auth.manageSubresource }}
{{- fail (printf "cluster-auth: backend %q uses externalSecret, which is not compatible with manageSubresource" ($auth.name | default "default-htpasswd")) }}
{{- end }}
{{ include "cluster-auth.externalSecret" (dict "root" $ "name" (printf "%s-htpasswd-auth" ($auth.name | default "default-htpasswd")) "namespace" $namespace "config" $auth.externalSecret "defaults" $.Values.externalSecretDefaults "keys" (list "htpasswd")) }}
{{- else -}}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: "{{- $auth.name | default "default-htpasswd" -}}-htpasswd-auth"
  namespace: "{{- $namespace -}}"
  labels:
    {{- include "cluster-auth.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{- $auth.name | default "default-htpasswd" -}}-htpasswd-auth-secret"
  annotations:
    {{- include "cluster-auth.annotations" $ | nindent 4 }}
    {{- if $auth.comment }}
    startx.fr/generator-cmd: |-
      {{ $auth.htpasswdComment | nindent 6 }}
    {{- end }}
stringData:
  htpasswd: |-
    {{- $auth.htpasswdContent | nindent 4 }}
{{-  if $auth.manageSubresource }}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: "v4-0-config-user-idp-{{ $i }}-file-data"
  namespace: "openshift-authentication"
  labels:
    {{- include "cluster-auth.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{- $auth.name | default "default-htpasswd" -}}-htpasswd-auth-secret"
  annotations:
    {{- include "cluster-auth.annotations" $ | nindent 4 }}
    {{- if $auth.comment }}
    startx.fr/generator-cmd: |-
      {{ $auth.htpasswdComment | nindent 6 }}
    {{- end }}
stringData:
  htpasswd: |-
    {{- $auth.htpasswdContent | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{ end }}
{{ end }}
{{ end }}
