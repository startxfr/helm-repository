{{- if .Values.auth.enabled -}}
{{- if .Values.auth.authBackend -}}
{{- $namespace := .Values.auth.namespace | default "openshift-config" -}}
{{ range $i, $auth := .Values.auth.authBackend }} 
{{-  if eq $auth.type "ldap" -}}
{{- if dig "externalSecret" "enabled" false $auth }}
{{- if $auth.manageSubresource }}
{{- fail (printf "cluster-auth: backend %q uses externalSecret, which is not compatible with manageSubresource" ($auth.name | default "default-ldap")) }}
{{- end }}
{{ include "cluster-auth.externalSecret" (dict "root" $ "name" (printf "%s-ldap-auth" ($auth.name | default "default-ldap")) "namespace" $namespace "config" $auth.externalSecret "defaults" $.Values.externalSecretDefaults "keys" (list "bindPassword")) }}
{{- else -}}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: "{{- $auth.name | default "default-ldap" -}}-ldap-auth"
  namespace: "{{- $namespace -}}"
  labels:
    {{- include "cluster-auth.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{- $auth.name | default "default-ldap" -}}-ldap-auth-secret"
  annotations:
    {{- include "cluster-auth.annotations" $ | nindent 4 }}
stringData:
  bindPassword: "{{- $auth.ldapBindPassword -}}"
{{-  if $auth.manageSubresource }}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: "v4-0-config-user-idp-{{ $i }}-bind-password"
  namespace: "openshift-authentication"
  labels:
    {{- include "cluster-auth.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{- $auth.name | default "default-ldap" -}}-ldap-auth-secret"
  annotations:
    {{- include "cluster-auth.annotations" $ | nindent 4 }}
stringData:
  bindPassword: "{{- $auth.ldapBindPassword -}}"
{{- end }}
{{- end }}
{{- end }}
{{ end }}
{{ end }}
{{ end }}
