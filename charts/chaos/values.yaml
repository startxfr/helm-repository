# Default values for chaos.

# # Use it to Overwrite the helm-chart name
#nameOverride: chaos
# # Use it to Overwrite the helm-chart version
#versionOverride: 0.0.1

# Application chaos context
context:  &context
# Name of the global scope for this application (organizational tenant)
 scope: companyname
# Name of the cluster running this application (platform tenant)
 cluster: clustername
# Name of the environment for this application (ex: dev, factory, preprod or prod)
 environment: dev
# Component name of this application (logical tenant)
 component: chaos
# Application name (functional tenant, default use Chart name)
 app: generic
# Version name of this application (default use Chart appVersion)
 version: "0.0.1"

# Configuration of the cerberus (see https://helm-repository.readthedocs.io/en/latest/charts/chaos-cerberus)
cerberus: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    project: 
      enabled: true
      type: namespace
      name: chaos-cerberus
      display_name: Chaos - Cerberus
      description: Cerberus watchdog of the chaos test suite
  cerberus: 
    enabled: false
    expose: false
    allowedNamespaces:
      - chaos-kraken
      - chaos-pipeline
    watch_url_routes: []
    kubeconfig:
      mode: local

# Configuration of the kraken (see https://helm-repository.readthedocs.io/en/latest/charts/chaos-kraken)
kraken: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    project: 
      enabled: true
      type: namespace
      name: chaos-kraken
      display_name: Chaos - Kraken
      description: Kraken chaos orchestrator of the chaos test suite
  kraken: 
    enabled: false
    engine: core
    job: 
      name: kraken-test
    cerberus:
      enabled: false
      url: "http://cerberus.chaos-cerberus.svc.cluster.local:8080"
    kubeconfig:
      mode: local

# Configuration of the chaos pipelines (see https://helm-repository.readthedocs.io/en/latest/charts/chaos-pipeline)
pipeline: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    project: 
      enabled: true
      type: namespace
      name: chaos-pipeline
      display_name: Chaos - Pipeline
      description: Tekton chaos pipelines of the chaos test suite
  pipeline: 
    enabled: false
    cerberus:
      enabled: true
      url: "http://cerberus.chaos-cerberus.svc.cluster.local:8080"

# Configuration of the litmus (see https://helm-repository.readthedocs.io/en/latest/charts/chaos-litmus)
litmus: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    project: 
      enabled: true
      type: namespace
      name: chaos-litmus
      display_name: Chaos - Litmus
      description: Litmus chaos orchestrator in STARTX Chaos test suite
  litmus:
    enabled: false
    nameOverride: litmus
    portalScope: cluster

# Configuration of the chaos-mesh (see https://helm-repository.readthedocs.io/en/latest/charts/chaos-mesh)
mesh: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    project: 
      enabled: true
      type: namespace
      name: chaos-mesh
      display_name: Chaos - Mesh
      description: Chaos-mesh chaos orchestrator in STARTX Chaos test suite
  mesh: 
    enabled: false
    expose: true
    chaosDaemon:
      runtime: crio
      socketPath: /var/run/crio/crio.sock

# Configuration of the kube-monkey (see https://helm-repository.readthedocs.io/en/latest/charts/chaos-monkey)
monkey: 
  enabled: false
  context: 
    <<: *context
  project: 
    enabled: true
    project: 
      enabled: true
      type: namespace
      name: chaos-kubemonkey
      display_name: Chaos - Monkey
      description: Kubernetes chaos monkey in STARTX Chaos test suite
  monkey:
    enabled: false
    nameOverride: monkey
    fullnameOverride: example-monkey
