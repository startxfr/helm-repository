apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-litmus-instance
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: chaos-litmus
    server: https://kubernetes.default.svc
  project: chaos
  source:
    chart: chaos-litmus
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: true
        litmus:
          enabled: true
          # Use standalone MongoDB for test environments:
          # - avoids replicaSet (3 primary + 1 arbiter) which creates SCC issues on OCP
          # - disables PVC to avoid WaitForFirstConsumer StorageClass deadlock
          mongodb:
            architecture: standalone
            persistence:
              enabled: false
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    targetRevision: 21.3.107
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
