apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-litmus-instance
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: chaos-litmus
    server: https://kubernetes.default.svc
  project: chaos
  source:
    chart: chaos-litmus
    helm:
      values: |
        project:
          enabled: true
        litmus:
          enabled: true
          # Secrets to create before the sync (see the chaos-litmus README)
          existingSecret: litmus-admin
          # Use standalone MongoDB for test environments:
          # - avoids replicaSet (3 primary + 1 arbiter) which creates SCC issues on OCP
          # - disables PVC to avoid WaitForFirstConsumer StorageClass deadlock
          mongodb:
            architecture: standalone
            auth:
              existingSecret: litmus-mongodb
            persistence:
              enabled: false
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
