apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-monkey-instance
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: chaos-monkey
    server: https://kubernetes.default.svc
  project: chaos
  source:
    chart: chaos-monkey
    helm:
      values: |
        project:
          enabled: true
        monkey:
          enabled: true
          config:
            dryRun: true
            timezone: Europe/Paris
            startHour: 9
            endHour: 17
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
