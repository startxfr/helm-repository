apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-kraken-instance
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: chaos-kraken
    server: https://kubernetes.default.svc
  project: chaos
  source:
    chart: chaos-kraken
    helm:
      values: |
        project:
          enabled: true
        kraken:
          enabled: true
          engine: core
          cerberus:
            enabled: true
            url: "http://cerberus.chaos-cerberus.svc.cluster.local:8080"
          scenarios:
            pods-monitoring:
              enabled: true
          kubeconfig:
            mode: local
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  # No automated sync: every sync of this Application starts a chaos run
  syncPolicy: {}
