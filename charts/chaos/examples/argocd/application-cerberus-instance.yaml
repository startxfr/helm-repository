apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-cerberus-instance
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: chaos-cerberus
    server: https://kubernetes.default.svc
  project: chaos
  source:
    chart: chaos-cerberus
    helm:
      values: |
        project:
          enabled: true
        cerberus:
          enabled: true
          kubeconfig:
            # local: use the cerberus ServiceAccount with a read-only ClusterRole
            mode: local
    repoURL: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
