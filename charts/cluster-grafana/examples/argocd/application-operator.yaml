# Installs the community grafana-operator (OwnNamespace OperatorGroup in default-grafana)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-grafana-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-grafana
  source:
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    chart: cluster-grafana
    targetRevision: 21.3.361
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: true
        grafana:
          enabled: false
        route:
          enabled: false
        grafana_datasources:
          enabled: false
        grafana_dashboards:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default-grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
