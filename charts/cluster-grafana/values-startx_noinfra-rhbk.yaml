# Default values for configuration of a STARTX cluster, Grafana authenticated by the startx realm of cluster-rhbk
# see values.yaml for explanation on each params
context: &context
  scope: startx
  cluster: default
  environment: infra
  component: grafana
  app: startx-grafana
  version: "5.25.0"
externalSecretDefaults:
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
grafana:
  enabled: false
  hooked: false
  name: startx
  version: "13.1.3"
  adminSecret:
    enabled: false
    name: ""
    username: admin
    password: ""
    externalSecret:
      enabled: false
      remoteRefs: {}
  spec: |
    config:
      log:
        mode: console
      analytics:
        reporting_enabled: "false"
        check_for_updates: "false"
        check_for_plugin_updates: "false"
      plugins:
        # No download of the plugins preinstalled from grafana.com at startup (the pod may have no internet access)
        preinstall_disabled: "true"
route:
  enabled: false
  # Fixed host required by the OIDC callback URL (replace apps.example.com by the cluster apps domain)
  host: "startx-default-grafana.apps.example.com"
  termination: edge
  insecureEdgeTerminationPolicy: Redirect
oidc:
  enabled: true
  name: Keycloak
  # Realm startx of the cluster-rhbk chart (values-startx_noinfra-grafana.yaml), replace apps.example.com
  issuerUrl: "https://startx-default-rhbk.apps.example.com/realms/startx"
  authUrl: ""
  tokenUrl: ""
  apiUrl: ""
  signoutUrl: ""
  clientId: grafana
  scopes: openid email profile
  roleAttributePath: "contains(roles[*], 'grafanaadmin') && 'GrafanaAdmin' || contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'"
  clientSecret:
    enabled: true
    name: ""
    # Demo secret only, identical to the grafana client of the cluster-rhbk demo realm: override it with an Argo CD
    # Vault Plugin placeholder or use externalSecret outside of demo environments
    value: "startx-grafana-demo-secret"
    externalSecret:
      enabled: false
      remoteRefs: {}
  ca:
    certificate: ""
    # Trust the cluster CA bundle (enough when the ingress certificate is signed by a CA of the proxy trustedCA)
    injectTrustedBundle: true
    configMap: ""
    key: ca-bundle.crt
grafana_datasources:
  enabled: false
  list: []
grafana_dashboards:
  enabled: false
  list:
    - name: startx-welcome
      enabled: true
      spec: |
        json: |
          {
            "title": "STARTX welcome",
            "uid": "startx-welcome",
            "schemaVersion": 39,
            "panels": [
              {
                "type": "text",
                "title": "STARTX",
                "gridPos": {"h": 6, "w": 24, "x": 0, "y": 0},
                "options": {"mode": "markdown", "content": "Grafana deployed by the STARTX **cluster-grafana** helm chart."}
              }
            ]
          }
project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "default-grafana"
    display_name: "Startx Grafana"
    requester: startx
    description: Grafana configured by STARTX
operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "grafana-operator"
    namespace: "default-grafana"
    version: "v5.25.0"
    operator:
      channel: v5
      name: grafana-operator
      installPlanApproval: Manual
      csv: grafana-operator
      source:
        name: community-operators
        namespace: openshift-marketplace
      config:
        infra: false
  operatorGroup:
    enabled: true
    hooked: false
    name: "grafana-operator"
    namespace: "default-grafana"
    providedAPIs: "Grafana.v1beta1.grafana.integreatly.org,GrafanaAlertRuleGroup.v1beta1.grafana.integreatly.org,GrafanaContactPoint.v1beta1.grafana.integreatly.org,GrafanaDashboard.v1beta1.grafana.integreatly.org,GrafanaDatasource.v1beta1.grafana.integreatly.org,GrafanaFolder.v1beta1.grafana.integreatly.org,GrafanaLibraryPanel.v1beta1.grafana.integreatly.org,GrafanaManifest.v1beta1.grafana.integreatly.org,GrafanaMuteTiming.v1beta1.grafana.integreatly.org,GrafanaNotificationPolicy.v1beta1.grafana.integreatly.org,GrafanaNotificationPolicyRoute.v1beta1.grafana.integreatly.org,GrafanaNotificationTemplate.v1beta1.grafana.integreatly.org,GrafanaServiceAccount.v1beta1.grafana.integreatly.org"
