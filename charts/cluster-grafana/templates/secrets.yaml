{{- if .Values.grafana.enabled -}}
{{- $namespace := include "cluster-grafana.namespace" . -}}
{{- $admin := .Values.grafana.adminSecret -}}
{{- if $admin.enabled }}
{{- $name := include "cluster-grafana.adminSecretName" . }}
{{- if dig "externalSecret" "enabled" false $admin }}
{{ include "cluster-grafana.externalSecret" (dict "root" $ "name" $name "namespace" $namespace "config" $admin.externalSecret "defaults" .Values.externalSecretDefaults "keys" (list "username" "password") "wave" "1") }}
{{- else }}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "cluster-grafana.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-secret" $name | quote }}
  annotations:
    {{- include "cluster-grafana.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
stringData:
  username: {{ required "grafana.adminSecret.username is required" $admin.username | quote }}
  password: {{ required "grafana.adminSecret.password is required (or use grafana.adminSecret.externalSecret)" $admin.password | quote }}
{{- end }}
{{- end }}
{{- $client := .Values.oidc.clientSecret -}}
{{- if and .Values.oidc.enabled $client.enabled }}
{{- $name := include "cluster-grafana.oidcSecretName" . }}
{{- if dig "externalSecret" "enabled" false $client }}
{{ include "cluster-grafana.externalSecret" (dict "root" $ "name" $name "namespace" $namespace "config" $client.externalSecret "defaults" .Values.externalSecretDefaults "keys" (list "client-secret") "wave" "1") }}
{{- else }}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "cluster-grafana.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-secret" $name | quote }}
  annotations:
    {{- include "cluster-grafana.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
stringData:
  client-secret: {{ required "oidc.clientSecret.value is required (or use oidc.clientSecret.externalSecret)" $client.value | quote }}
{{- end }}
{{- end }}
{{- $cookie := .Values.oauthProxy.cookieSecret -}}
{{- if and .Values.oauthProxy.enabled $cookie.enabled }}
{{- $name := include "cluster-grafana.oauthProxyCookieName" . }}
{{- if dig "externalSecret" "enabled" false $cookie }}
{{ include "cluster-grafana.externalSecret" (dict "root" $ "name" $name "namespace" $namespace "config" $cookie.externalSecret "defaults" .Values.externalSecretDefaults "keys" (list "cookie_secret") "wave" "1") }}
{{- else }}
---
kind: Secret
apiVersion: v1
type: Opaque
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "cluster-grafana.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-secret" $name | quote }}
  annotations:
    {{- include "cluster-grafana.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
stringData:
  cookie_secret: {{ required "oauthProxy.cookieSecret.value is required (or use oauthProxy.cookieSecret.externalSecret)" $cookie.value | quote }}
{{- end }}
{{- end }}
{{- end -}}
