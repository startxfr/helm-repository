{{- if .Values.grafana.enabled -}}{{- if .Values.oauthProxy.enabled -}}
{{- $namespace := include "cluster-grafana.namespace" . -}}
{{- $name := include "cluster-grafana.oauthProxySaName" . -}}
{{- /* Dedicated ServiceAccount (not the one managed by the operator, which would reset the annotation). The
       OAuth redirect reference points to the route <grafana.name>-route created by the operator */ -}}
---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "cluster-grafana.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-serviceaccount" $name | quote }}
  annotations:
    {{- include "cluster-grafana.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
    serviceaccounts.openshift.io/oauth-redirectreference.primary: {{ dict "kind" "OAuthRedirectReference" "apiVersion" "v1" "reference" (dict "kind" "Route" "name" (printf "%s-route" (include "cluster-grafana.grafanaName" .))) | toJson | quote }}
{{- end }}{{- end -}}
