apiVersion: v2
# Name of this Helm chart
name: cluster-grafana
# Description of this Helm chart
description: Helm chart used to configure Grafana at the cluster level, with the community grafana-operator, a Grafana instance, its route, datasources, dashboards and an optional OpenID Connect authentication (Red Hat build of Keycloak)
# Helm chart application
type: application
# Version of this helm chart (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release guidelines)
version: 21.3.412
# Version name of the grafana-operator (see https://github.com/startxfr/helm-repository/blob/dev/README.md for helm chart release history)
appVersion: "5.25.0"
# Icon of this helm-chart
icon: https://helm-repository.readthedocs.io/en/latest/img/cluster-grafana.svg
# Kube minimum version
kubeVersion: ">=1.30.0-0"
# Keyword list for this chart
keywords:
  - kubernetes
  - helm
  - startx
  - cluster-chart
  - cluster
  - infrastructure
  - monitoring
  - observability
  - grafana
  - dashboard
  - OIDC
# STARTX helm chart repository homepage
home: https://helm-repository.readthedocs.io/en/latest
# Sources and documentation for this chart
sources:
  - https://helm-repository.readthedocs.io/en/latest/charts/cluster-grafana
  - https://github.com/startxfr/helm-repository/tree/master/charts/cluster-grafana
# Main maintainer contact for this helm chart
maintainers:
  - name: "STARTX"
    email: "dev@startx.fr"
    url: "https://www.startx.fr"

dependencies:
  - name: project
    repository: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/21
    version: "21.3.410"
    alias: project
    condition: project.enabled
  - name: operator
    repository: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/21
    version: "21.3.410"
    alias: operator
    condition: operator.enabled

annotations:
  # category associated to this package
  category: cluster
  # Artifacthub category associated to this package
  artifacthub.io/category: monitoring-logging
  # Artifacthub license
  artifacthub.io/license: "GPL-3.0-or-later"
  # Artifacthub is this release a pre-release
  artifacthub.io/prerelease: "true"
  # Artifacthub is an operator chart
  artifacthub.io/operator: "true"
  # Artifacthub operator capabilities
  artifacthub.io/operatorCapabilities: "Seamless Upgrades"
  # Artifacthub chart recommendations
  startx.io/recommendations: |
    - name: Startx basic chart - Project
      url: https://helm-repository.readthedocs.io/en/latest/charts/project
    - name: Startx basic chart - Operator
      url: https://helm-repository.readthedocs.io/en/latest/charts/operator
    - name: Startx cluster chart - RHBK (OpenID Connect provider)
      url: https://helm-repository.readthedocs.io/en/latest/charts/cluster-rhbk
  # Artifacthub signing keys
  artifacthub.io/signKey: |
    fingerprint: FAC998719FEFFB2E03E119EE0F36B25015D3A34D
    url: https://helm-repository.readthedocs.io/en/latest/pgp_keys.asc
  # Artifacthub changes logs
  artifacthub.io/changes: |
    - kind: added
      description: "oauthProxy block: OpenShift oauth-proxy sidecar in front of Grafana (auth.proxy), without redeclaring the grafana container"
    - kind: added
      description: "[cluster-grafana] Initial chart creation"
  artifacthub.io/containsSecurityUpdates: "false"
