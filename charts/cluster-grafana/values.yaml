# Default values for cluster-grafana.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organizational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-grafana
  # Version name of this application (default use Chart appVersion)
  version: "5.25.0"

# Defaults applied to every secret of this chart sourced from an external store (`externalSecret.enabled: true`).
# Requires the External Secrets Operator and a SecretStore/ClusterSecretStore.
externalSecretDefaults:
  # API version of the ExternalSecret CRD (external-secrets.io/v1beta1 for ESO releases without the v1 API)
  apiVersion: external-secrets.io/v1
  # How often the Secret is refreshed from the external store
  refreshInterval: 1h
  # Store to read from (name is required as soon as a secret uses externalSecret)
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore

# Deploy a Grafana instance (Grafana CR of the grafana-operator)
grafana:
  # Enable the Grafana instance and its secrets
  enabled: false
  # Activate the Grafana CR as a helm hook
  hooked: false
  # Name of the Grafana CR (the operator names its objects after it: <name>-deployment, <name>-service, <name>-route...)
  name: default
  # Grafana version: image tag (ex: 13.1.3) or full image reference, with or without digest. Pinned so that an
  # operator upgrade does not restart Grafana with a new version
  version: "13.1.3"
  # Admin credentials Secret (keys username and password), read by Grafana and by the operator.
  # When disabled, the operator generates the Secret <name>-admin-credentials (user admin, random password)
  adminSecret:
    # Render the admin Secret
    enabled: false
    # Name of the Secret (default: <grafana.name>-admin)
    name: ""
    # Admin user name
    username: admin
    # Admin password (secret, required unless externalSecret is used). Use an Argo CD Vault Plugin
    # placeholder (<path:kv/data/...#key>) or a values file kept out of Git
    password: ""
    # Source the Secret from an external store instead (External Secrets Operator)
    externalSecret:
      # Use the External Secrets Operator to produce this Secret
      enabled: false
      # Map secretKey -> ESO remoteRef; the keys username and password are required
      remoteRefs: {}
      #   username:
      #     key: kv/grafana/admin
      #     property: username
      #   password:
      #     key: kv/grafana/admin
      #     property: password
  # Grafana CR specifications. The chart merges this spec over a generated base:
  # - version from grafana.version
  # - route.spec when route.enabled
  # - config.server.root_url when route.host is set
  # - config.auth.generic_oauth, the client secret variable and the CA bundle volume when oidc.enabled
  # - disableDefaultAdminSecret and the admin variables when adminSecret.enabled
  # Every key set here takes precedence over the generated base (a list such as
  # deployment.spec.template.spec.containers replaces the generated one)
  spec: |
    config:
      log:
        mode: console

# Expose Grafana with an OpenShift Route managed by the grafana-operator (Grafana CR spec.route)
route:
  # Enable the route
  enabled: false
  # Host of the route (empty: generated by OpenShift). Required by oidc.enabled (callback URL)
  host: ""
  # TLS termination: edge or reencrypt
  termination: edge
  # Policy for plain HTTP requests
  insecureEdgeTerminationPolicy: Redirect

# Authenticate the Grafana users with an OpenID Connect provider, such as a Red Hat build of Keycloak realm
# deployed by the cluster-rhbk chart (Grafana generic_oauth). Requires grafana.enabled and route.host
oidc:
  # Enable the OpenID Connect authentication
  enabled: false
  # Label of the login button
  name: OpenID Connect
  # Issuer URL of a Keycloak realm (https://<keycloak host>/realms/<realm>). The auth, token, userinfo and logout
  # endpoints are derived from it (Keycloak layout). Leave it empty with another provider and set the URLs below
  issuerUrl: ""
  # Authorization endpoint (overrides the one derived from issuerUrl, required when issuerUrl is empty)
  authUrl: ""
  # Token endpoint (overrides the one derived from issuerUrl, required when issuerUrl is empty)
  tokenUrl: ""
  # Userinfo endpoint (overrides the one derived from issuerUrl, required when issuerUrl is empty)
  apiUrl: ""
  # Logout URL Grafana redirects to after sign out, used as is (overrides the one derived from issuerUrl, optional).
  # Add post_logout_redirect_uri and client_id to it when the provider expects them
  signoutUrl: ""
  # Client ID registered in the provider
  clientId: grafana
  # Requested scopes
  scopes: openid email profile
  # JMESPath expression mapping the claims of the ID token or of the userinfo to a Grafana role. The default expects
  # the client roles grafanaadmin, admin and editor in a top-level `roles` claim (see the cluster-rhbk README)
  roleAttributePath: "contains(roles[*], 'grafanaadmin') && 'GrafanaAdmin' || contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'"
  # Client secret Secret (key client-secret), exposed to Grafana as GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
  clientSecret:
    # Render the client secret Secret (false: the Secret is expected to exist)
    enabled: true
    # Name of the Secret (default: <grafana.name>-oidc-client)
    name: ""
    # Client secret (secret, required unless externalSecret is used). Must match the client secret in the provider
    value: ""
    # Source the Secret from an external store instead (External Secrets Operator)
    externalSecret:
      # Use the External Secrets Operator to produce this Secret
      enabled: false
      # Map secretKey -> ESO remoteRef; the key client-secret is required
      remoteRefs: {}
      #   client-secret:
      #     key: kv/grafana/oidc
      #     property: client_secret
  # CA bundle Grafana trusts to reach the provider endpoints (e.g. route certificate of Keycloak). Set only one of:
  ca:
    # Inline PEM certificate(s), rendered in the ConfigMap <grafana.name>-oidc-ca
    certificate: ""
    # Inject the cluster trusted CA bundle (system CAs and proxy trustedCA) in the ConfigMap <grafana.name>-oidc-ca
    injectTrustedBundle: false
    # Name of an existing ConfigMap holding the CA bundle
    configMap: ""
    # Key of the CA bundle in the ConfigMap (always ca-bundle.crt with injectTrustedBundle)
    key: ca-bundle.crt

# Grafana datasources (GrafanaDatasource CR), attached to the Grafana instance of this chart
grafana_datasources:
  # Enable the datasources
  enabled: false
  # List of datasources
  list:
      # Name of the GrafanaDatasource CR
    - name: "mydatasource"
      # Enable this datasource
      enabled: true
      # GrafanaDatasource spec (instanceSelector defaults to the Grafana instance of this chart)
      spec: |
        datasource:
          name: My Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090

# Grafana dashboards (GrafanaDashboard CR), attached to the Grafana instance of this chart
grafana_dashboards:
  # Enable the dashboards
  enabled: false
  # List of dashboards
  list:
      # Name of the GrafanaDashboard CR
    - name: "mydashboard"
      # Enable this dashboard
      enabled: true
      # GrafanaDashboard spec (json, url, gzipJson, configMapRef or grafanaCom; instanceSelector defaults to the
      # Grafana instance of this chart)
      spec: |
        json: |
          {"title": "My dashboard", "panels": [], "schemaVersion": 39}

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "default-grafana"
    display_name: Default Grafana
    description: Grafana configured by STARTX

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "grafana-operator"
    namespace: "default-grafana"
    version: "v5.25.0"
    operator:
      channel: v5
      name: grafana-operator
      installPlanApproval: Manual
      csv: grafana-operator
      source:
        name: community-operators
        namespace: openshift-marketplace
      config:
        infra: false
  operatorGroup:
    enabled: true
    hooked: false
    name: "grafana-operator"
    namespace: "default-grafana"
    providedAPIs: "Grafana.v1beta1.grafana.integreatly.org,GrafanaAlertRuleGroup.v1beta1.grafana.integreatly.org,GrafanaContactPoint.v1beta1.grafana.integreatly.org,GrafanaDashboard.v1beta1.grafana.integreatly.org,GrafanaDatasource.v1beta1.grafana.integreatly.org,GrafanaFolder.v1beta1.grafana.integreatly.org,GrafanaLibraryPanel.v1beta1.grafana.integreatly.org,GrafanaManifest.v1beta1.grafana.integreatly.org,GrafanaMuteTiming.v1beta1.grafana.integreatly.org,GrafanaNotificationPolicy.v1beta1.grafana.integreatly.org,GrafanaNotificationPolicyRoute.v1beta1.grafana.integreatly.org,GrafanaNotificationTemplate.v1beta1.grafana.integreatly.org,GrafanaServiceAccount.v1beta1.grafana.integreatly.org"
