{{- if .Values.secrets.enabled -}}
{{- $namespace := .Values.project.project.name | default "default-eck" -}}
{{- range .Values.secrets.list }}
{{- $name := required "secrets.list: every item needs a name" .name }}
{{- $ns := .namespace | default $namespace }}
{{- if dig "externalSecret" "enabled" false . }}
{{ include "cluster-eck.externalSecret" (dict "root" $ "name" $name "namespace" $ns "config" .externalSecret "defaults" $.Values.externalSecretDefaults "type" .type "wave" "1") }}
{{- else }}
{{- if not .data }}
{{- fail (printf "secrets.list: the secret %s needs data, or externalSecret.enabled" $name) }}
{{- end }}
---
apiVersion: v1
kind: Secret
type: {{ .type | default "Opaque" | quote }}
metadata:
  name: {{ $name | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "cluster-eck.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{- $name -}}-secret"
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "cluster-eck.annotations" $ | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
stringData:
  {{- range $key, $value := .data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end -}}
