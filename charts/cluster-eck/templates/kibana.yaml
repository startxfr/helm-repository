{{- if .Values.kibana.enabled -}}
{{- $namespace := .Values.project.project.name | default "default-eck" -}}
{{- range .Values.kibana.list }}
{{- $name := required "kibana.list: every item needs a name" .name }}
{{- $ns := .namespace | default $namespace }}
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: {{ $name | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "cluster-eck.labels" $ | nindent 4 }}
    app.kubernetes.io/name: "{{- $name -}}-kibana"
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "cluster-eck.annotations" $ | nindent 4 }}
    {{- if $.Values.kibana.hooked }}
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "30"
    helm.sh/hook-delete-policy: hook-failed
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
    {{- end }}
    argocd.argoproj.io/sync-wave: "30"
spec:
  {{- include "cluster-eck.spec" (dict "kind" "Kibana" "name" $name "spec" .spec "required" true) | nindent 2 }}
{{- if dig "route" "enabled" false . }}
{{ include "cluster-eck.route" (dict "root" $ "name" (printf "%s-kb" $name) "namespace" $ns "service" (printf "%s-kb-http" $name) "config" .route "wave" "35") }}
{{- end }}
{{- end }}
{{- end -}}
