# Deploys the certified ECK operator in openshift-operators (AllNamespaces install mode, global OperatorGroup).
# The Subscription uses installPlanApproval Manual: approve the InstallPlan to install the operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-eck-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: openshift-operators
    server: https://kubernetes.default.svc
  project: cluster-eck
  source:
    chart: cluster-eck
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: true
          operatorGroup:
            enabled: false
        tuned:
          enabled: false
        elasticsearch:
          enabled: false
        kibana:
          enabled: false
        secrets:
          enabled: false
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
