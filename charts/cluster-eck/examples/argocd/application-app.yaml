# Sets vm.max_map_count on the worker nodes (Tuned), then creates the startx Elasticsearch cluster (3 nodes,
# 50Gi each) and its Kibana in default-eck, with a passthrough route for Kibana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-eck-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: default-eck
    server: https://kubernetes.default.svc
  project: cluster-eck
  source:
    chart: cluster-eck
    helm:
      valueFiles:
        - values-startx_noinfra.yaml
      values: |
        project:
          enabled: false
        operator:
          enabled: false
        tuned:
          enabled: true
        elasticsearch:
          enabled: true
        kibana:
          enabled: true
        secrets:
          enabled: false
    repoURL: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
    # pin an exact version in production (ADR-0004)
    targetRevision: 21.3.x
  ignoreDifferences:
    - group: elasticsearch.k8s.elastic.co
      kind: Elasticsearch
      jsonPointers:
        - /metadata/finalizers
    - group: kibana.k8s.elastic.co
      kind: Kibana
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
