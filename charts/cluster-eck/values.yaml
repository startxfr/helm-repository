# Default values for cluster-eck.

# Application deployment context
context:  &context
  # Name of the global scope for this application (organizational tenant)
  scope: myscope
  # Name of the cluster running this application (platform tenant)
  cluster: default
  # Name of the environment for this application (ex: dev, factory, preprod or prod)
  environment: myenv
  # Component name of this application (logical tenant)
  component: mycomponent
  # Application name (functional tenant, default use Chart name)
  app: default-eck
  # Version name of this application (default use Chart appVersion)
  version: "3.5.0"

# Default settings of the ExternalSecret objects rendered by this chart when a
# secret is sourced from an external store (`externalSecret.enabled: true`).
# Requires the External Secrets Operator and a SecretStore/ClusterSecretStore.
externalSecretDefaults:
  # API version of the ExternalSecret CRD (external-secrets.io/v1beta1 for ESO releases without the v1 API)
  apiVersion: external-secrets.io/v1
  # How often the Secret is refreshed from the external store
  refreshInterval: 1h
  # Store to read from (name is required as soon as a secret uses externalSecret)
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore

# Kernel setting required by Elasticsearch on the nodes running it (Tuned resource of the Node Tuning Operator,
# applied without reboot). OpenShift nodes set vm.max_map_count to 262144; Elastic recommends 1048576 for
# Elasticsearch 8.16 and later in production
tuned:
  # Enable the creation of the Tuned resource
  enabled: false
  # Activate the resource as a helm hook
  hooked: false
  # Name of the Tuned resource and of its profile
  name: openshift-elasticsearch
  # Value of the vm.max_map_count kernel setting
  maxMapCount: 1048576
  # Profile of OpenShift extended by this one: openshift-node for the worker nodes, openshift-control-plane
  # for the infra and control plane nodes
  include: openshift-node
  # Priority of the profile, the lowest value wins (the profiles of OpenShift use 30 and 40)
  priority: 20
  # Nodes receiving the profile: list of node labels, a node carrying one of them is selected
  # (label is the key of the node label, the optional value restricts the match to this value)
  match:
    - label: node-role.kubernetes.io/worker

# Elasticsearch clusters (Elasticsearch resource of the ECK operator)
elasticsearch:
  # Enable the creation of the Elasticsearch resources listed below
  enabled: false
  # Activate the resources as helm hooks
  hooked: false
  # List of Elasticsearch resources (spec is rendered as is)
  list: []
  #   # Name of the cluster. The operator names its objects after it: service <name>-es-http (port 9200) and
  #   # secret <name>-es-elastic-user (password of the elastic user)
  # - name: default
  #   # Namespace of the cluster (default is the project namespace). It must be a namespace of the default pod
  #   # network, and never default, kube-* or openshift-*
  #   namespace: ""
  #   # Additional labels set on the resource
  #   labels: {}
  #   # Route publishing the HTTP API of the cluster outside of OpenShift
  #   route:
  #     # Enable the creation of the route <name>-es
  #     enabled: false
  #     # Hostname of the route (empty: generated by OpenShift)
  #     host: ""
  #     # Additional annotations of the route
  #     annotations: {}
  #     # TLS termination: passthrough (default, Elasticsearch presents its own certificate), reencrypt or edge
  #     termination: passthrough
  #     # Additional fields of the tls block of the route (destinationCACertificate, certificate, key...)
  #     tls: {}
  #   # Specification of the cluster
  #   spec:
  #     # Version of Elasticsearch (required)
  #     version: 9.5.0
  #     # Groups of nodes sharing the same roles, configuration and resources (required)
  #     nodeSets:
  #         # Name of the group
  #       - name: default
  #         # Number of Elasticsearch nodes of the group
  #         count: 3
  #         # Elasticsearch configuration of the nodes (elasticsearch.yml)
  #         config:
  #           node.roles: ["master", "data", "ingest"]
  #           # # Demo only: do not use memory mapping, when vm.max_map_count cannot be set on the nodes
  #           # node.store.allow_mmap: false
  #         # Pod template of the nodes (resources, node selector, tolerations, affinity...)
  #         podTemplate:
  #           spec:
  #             containers:
  #               - name: elasticsearch
  #                 resources:
  #                   requests:
  #                     cpu: "1"
  #                     memory: 4Gi
  #                   limits:
  #                     memory: 4Gi
  #         # Data volume of each node, the claim must be named elasticsearch-data (default is a 1Gi volume of
  #         # the default storage class)
  #         volumeClaimTemplates:
  #           - metadata:
  #               name: elasticsearch-data
  #             spec:
  #               accessModes:
  #                 - ReadWriteOnce
  #               storageClassName: gp3-csi
  #               resources:
  #                 requests:
  #                   storage: 50Gi
  #     # Secrets holding the secure settings added to the keystore (ex: credentials of a snapshot repository,
  #     # see the secrets block)
  #     secureSettings:
  #       - secretName: es-snapshot-s3
  #     # HTTP layer of the cluster: service and certificate. The operator generates a self-signed certificate
  #     # unless a tls secret is given
  #     http:
  #       tls:
  #         certificate:
  #           secretName: es-http-tls

# Kibana instances (Kibana resource of the ECK operator)
kibana:
  # Enable the creation of the Kibana resources listed below
  enabled: false
  # Activate the resources as helm hooks
  hooked: false
  # List of Kibana resources (spec is rendered as is)
  list: []
  #   # Name of the instance. The operator creates the service <name>-kb-http (port 5601)
  # - name: default
  #   # Namespace of the instance (default is the project namespace)
  #   namespace: ""
  #   # Additional labels set on the resource
  #   labels: {}
  #   # Route publishing Kibana outside of OpenShift
  #   route:
  #     # Enable the creation of the route <name>-kb
  #     enabled: false
  #     # Hostname of the route (empty: generated by OpenShift)
  #     host: ""
  #     # Additional annotations of the route
  #     annotations: {}
  #     # TLS termination: passthrough (default, Kibana presents its own certificate), reencrypt or edge
  #     termination: passthrough
  #     # Additional fields of the tls block of the route (destinationCACertificate, certificate, key...)
  #     tls: {}
  #   # Specification of the instance
  #   spec:
  #     # Version of Kibana, the same as the Elasticsearch cluster (required)
  #     version: 9.5.0
  #     # Number of Kibana pods
  #     count: 1
  #     # Elasticsearch cluster of this chart used by Kibana: the operator configures the user and the certificates
  #     elasticsearchRef:
  #       name: default
  #     # Pod template of Kibana (resources, node selector, tolerations...)
  #     podTemplate:
  #       spec:
  #         containers:
  #           - name: kibana
  #             resources:
  #               requests:
  #                 cpu: 500m
  #                 memory: 1Gi
  #               limits:
  #                 memory: 2Gi

# Secrets referenced by the Elastic resources (ex: secure settings of a snapshot repository, users of the file
# realm, certificates of the HTTP layer). A secret is rendered from its data, or by an ExternalSecret reading
# an external store
secrets:
  # Enable the creation of the secrets listed below
  enabled: false
  # List of secrets
  list: []
  #   # Name of the secret
  # - name: es-snapshot-s3
  #   # Namespace of the secret: the one of the resource referencing it (default is the project namespace)
  #   namespace: ""
  #   # Type of the secret (default Opaque)
  #   type: Opaque
  #   # Additional labels set on the secret
  #   labels: {}
  #   # Key/value pairs of the secret, rendered as stringData. Never commit a real credential: use externalSecret,
  #   # or keep the secret out of the chart and create it by hand
  #   data:
  #     s3.client.default.access_key: ""
  #     s3.client.default.secret_key: ""
  #   # Source this secret from an external store instead of the data above: renders an ExternalSecret
  #   # producing the same secret (see externalSecretDefaults)
  #   externalSecret:
  #     # Enable the ExternalSecret mode
  #     enabled: false
  #     # Store to read from (default is externalSecretDefaults.secretStoreRef)
  #     secretStoreRef: {}
  #     # How often the secret is refreshed (default is externalSecretDefaults.refreshInterval)
  #     refreshInterval: ""
  #     # Map of the secret keys to the remote references ({key, property, version}) of the external store
  #     remoteRefs:
  #       s3.client.default.access_key:
  #         key: ocp/eck/snapshot-s3
  #         property: access_key
  #       s3.client.default.secret_key:
  #         key: ocp/eck/snapshot-s3
  #         property: secret_key
  #     # Raw ExternalSecret spec.data, spec.dataFrom and spec.target.template (alternatives to remoteRefs)
  #     data: []
  #     dataFrom: []
  #     template: {}

# Configuration of the project (see https://helm-repository.readthedocs.io/en/latest/charts/project)
project:
  enabled: false
  context:
    <<: *context
  project:
    enabled: true
    hooked: false
    type: namespace
    name: "default-eck"
    display_name: Elasticsearch
    description: Elasticsearch clusters configured by STARTX

# Configuration of the operator (see https://helm-repository.readthedocs.io/en/latest/charts/operator)
# The certified ECK operator is installed in openshift-operators (AllNamespaces mode, global OperatorGroup)
operator:
  enabled: false
  context:
    <<: *context
  subscription:
    enabled: true
    hooked: false
    name: "elasticsearch-eck-operator-certified"
    namespace: "openshift-operators"
    version: "v3.5.0"
    operator:
      channel: "stable"
      name: elasticsearch-eck-operator-certified
      installPlanApproval: Manual
      # csv: elasticsearch-eck-operator-certified
      source:
        name: certified-operators
        namespace: openshift-marketplace
      config:
        infra: false
  operatorGroup:
    enabled: false
    hooked: false
    name: "elasticsearch-eck-operator-certified"
    namespace: "openshift-operators"
    target: "all-ns"
    providedAPIs: "Elasticsearch.v1.elasticsearch.k8s.elastic.co,Kibana.v1.kibana.k8s.elastic.co"
