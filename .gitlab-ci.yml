# GitLab CI of the helm repository: the same checks as .github/workflows/ci.yml, all of them run by
# .github/scripts/ci-check.sh and tests/contract/run.sh (plain bash, helm, yq, python3).
#
# NOT TESTED: this file was written without access to a GitLab runner. It is kept simple on purpose: adapt the image
# and the runner tags to your runners, then run a first pipeline on a merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "devel"

stages:
  - static
  - charts
  - contract
  - argocd

default:
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bash ca-certificates curl git python3 jq >/dev/null
    - curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz | tar -xz -C /tmp && install /tmp/linux-amd64/helm /usr/local/bin/helm
    - curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 && chmod +x /usr/local/bin/yq

static:
  stage: static
  script:
    - .github/scripts/ci-check.sh static

charts:
  stage: charts
  variables:
    CI_JOBS: "4"
  parallel:
    matrix:
      - GROUP:
          - "chaos*"
          - "cluster-[0-9a-f]*"
          - "cluster-[g-m]*"
          - "cluster-[n-r]*"
          - "cluster-[s-z]*"
          - "example-* operator project sxapi unifai"
  script:
    - .github/scripts/ci-check.sh charts "$GROUP"

contract:
  stage: contract
  script:
    - tests/contract/run.sh

argocd:
  stage: argocd
  script:
    - .github/scripts/ci-check.sh argocd
